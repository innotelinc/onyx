# Onyx service users (docs/design/04#4-config-and-state-layout).
#
# One unprivileged system user per daemon, all in the shared `onyx` group
# (sockets in /run/onyx are group-owned, see deploy/tmpfiles.d/onyx.conf).
# onyx-privd is deliberately *not* listed: it is the single root process and
# needs no own account. systemd-sysusers resolves these at boot; the script
# installer (scripts/onyx-install) creates the same identities on existing
# hosts via useradd/groupadd.
g onyx - -
u onyx-core      - "Onyx control plane (onyx-core)"       /nonexistent /usr/sbin/nologin
u onyx-api       - "Onyx HTTP gateway (onyx-api)"         /nonexistent /usr/sbin/nologin
u onyx-shared    - "Onyx share renderer (onyx-shared)"    /nonexistent /usr/sbin/nologin
u onyx-storaged  - "Onyx storage data plane (onyx-storaged)" /nonexistent /usr/sbin/nologin