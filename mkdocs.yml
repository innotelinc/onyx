# MkDocs configuration for the ONYX design-doc site (docs/design/), published
# by .github/workflows/pages.yml alongside the landing page:
#
#   https://innotelinc.github.io/onyx/         -> web/landing (static page)
#   https://innotelinc.github.io/onyx/docs/    -> this site (built in CI)
#
# The canonical source of truth stays docs/design/ — this file only controls
# presentation. site_dir points into the landing page so the Pages upload
# remains a single artifact; web/landing/docs is git-ignored.
site_name: ONYX — Design Documents
site_description: >-
  The living specification of ONYX (Online Storage System — Platform):
  enterprise-grade storage, virtualization, object storage, backups and app
  hosting — private and self-hosted.
site_url: https://innotelinc.github.io/onyx/docs/
repo_url: https://github.com/innotelinc/onyx
repo_name: innotelinc/onyx
edit_uri: edit/main/docs/design/

# Build docs/design in place; the README there is the site home.
docs_dir: docs/design
site_dir: web/landing/docs

theme:
  name: material
  # Prism is dark-first (docs/design/03 §1.2) — matches the landing page.
  palette:
    - scheme: onyx
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: onyx-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/hexagon-multiple
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.expand
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share

extra_css:
  - styles/onyx.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/innotelinc/onyx
    - icon: material/home-circle
      link: https://innotelinc.github.io/onyx/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Product Vision: 01-product-vision.md
  - Technical Architecture: 02-technical-architecture.md
  - Frontend Design System: 03-frontend-design-system.md
  - Backend Service Architecture: 04-backend-service-architecture.md
  - Storage Subsystem: 05-storage-subsystem.md
  - API Specification: 06-api-specification.md
  - Security Model: 07-security-model.md
  - User Management: 08-user-management.md
  - App Ecosystem: 09-app-ecosystem.md
  - Installer and Updates: 10-installer-and-updates.md
  - Platform and Cloud: 11-platform-and-cloud.md
