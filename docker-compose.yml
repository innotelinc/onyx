# ONYX — Online Storage System — Platform (docs/design/11-platform-and-cloud.md)
#
# The containerized deployment: every onyx daemon + Authentik (SSO) + Nginx
# Proxy Manager (ingress). All onyx services talk gRPC over a shared unix
# socket volume (/run/onyx) exactly like the native systemd install; the only
# host ports are NPM's (80/443/81). setup.sh brings the whole stack up and
# provisions NPM (wildcard TSIG cert + the six subdomains) + Authentik.
#
# Deploy:
#   cp .env.example .env      # fill in secrets
#   ./setup.sh

name: onyx-platform

x-onyx-sockets: &onyx-sockets
  volumes:
    - onyx-sockets:/run/onyx

services:
  # ---- ONYX daemons ---------------------------------------------------------

  onyx-privd:
    build:
      context: .
      dockerfile: docker/onyx-privd.Dockerfile
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-privd:${IMAGE_TAG:-latest}
    # The single privilege boundary (docs/design/07): root, host devices, the
    # data pool, and the daemon-config dir. Everything else is unprivileged.
    privileged: true
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-config:/etc/onyx/conf.d
      - /dev:/dev
      # rshared propagation so the pool mounts privd creates reach storaged, the
      # API and the host — the host path must be a shared mount too, which
      # setup.sh ensures (`mount --make-shared /mnt/onyx`). Without both halves
      # privd sees the pool and the API does not.
      - /mnt/onyx:/mnt/onyx:rshared
    restart: unless-stopped

  onyx-storaged:
    build:
      context: .
      dockerfile: docker/onyx-storaged.Dockerfile
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-storaged:${IMAGE_TAG:-latest}
    # privileged: uevent netlink watcher + block-device access
    privileged: true
    volumes:
      - onyx-sockets:/run/onyx
      - /dev:/dev
      - /mnt/onyx:/mnt/onyx:rshared
    command: ["--mount-root", "/mnt/onyx"]
    restart: unless-stopped

  onyx-shared:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-shared }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-shared:${IMAGE_TAG:-latest}
    <<: *onyx-sockets
    restart: unless-stopped

  onyx-core:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-core }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-core:${IMAGE_TAG:-latest}
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-core-state:/var/lib/onyx/core
    command: ["--device-mount-root", "/mnt/onyx"]
    restart: unless-stopped

  onyx-api:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-api }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-api:${IMAGE_TAG:-latest}
    # Memory posture (docs/service-audit.md): Go daemons are small; cap each.
    mem_limit: 512m
    memswap_limit: 512m
    # LAN ingress for the shared Nginx Proxy Manager (192.168.1.46): api/admin
    # surfaces publish on the host so NPM can forward to them. 2081 is free on
    # the shared host (8080 belongs to signara there).
    ports:
      - "${ONYX_API_PORT:-2081}:8080"
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-api-state:/var/lib/onyx/api
      # Read-write: the Shares page's cloud/remote storage setup writes the
      # remote catalog here (rclone config create), and onyx-backupd reads the
      # same file for remote backup targets. setup.sh makes the directory
      # writable by the container user (uid 100) before the stack starts.
      - ${RCLONE_CONFIG_DIR:-./data/rclone}:/etc/rclone
      # The file explorer and safe mutations operate on the same host storage
      # root as storaged; without this bind mount /mnt/onyx is absent in the API
      # container even while the data plane can see it. rshared so pool mounts
      # created by privd appear here as well (see the onyx-privd comment).
      - /mnt/onyx:/mnt/onyx:rshared
      # This product's Vault token, read-only. Cerulean's Vault bootstrap mints
      # it (VAULT_PRODUCT_TOKENS=onyx there) and renews it in place; the stack
      # only ever reads it. See data/vault/token/ (gitignored).
      - ${ONYX_VAULT_TOKEN_DIR:-./data/vault/token}:/vault/token:ro
    # Vault is published on the host, not on this compose network, so the
    # containers reach it through the bridge gateway alias.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Device trust (docs/design/11 §10.3): drives GET /api/v1/devices/trust.
      DEVICE_TRUST: ${DEVICE_TRUST:-off}
      CERULEAN_API_URL: ${CERULEAN_API_URL:-}
      CERULEAN_API_TOKEN: ${CERULEAN_API_TOKEN:-}
      FLEET_ID: ${FLEET_ID:-}
      # SecretOps (docs/design/11 §6.9): CERULEAN_API_TOKEN may be a
      # `vault://<mount>/<path>#<key>` reference resolved at startup against
      # Cerulean Vault — the platform's only secret store. Report health on
      # GET /api/v1/system/status as `vault:`.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_TOKEN_FILE: ${VAULT_TOKEN_FILE:-}
      VAULT_PREFIX: ${VAULT_PREFIX:-cerulean}
      VAULT_PATH: ${VAULT_PATH:-onyx}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-}
      VAULT_CACERT: ${VAULT_CACERT:-}
    command: ["--listen", "0.0.0.0:8080"]
    restart: unless-stopped

  onyx-snapd:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-snapd }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-snapd:${IMAGE_TAG:-latest}
    <<: *onyx-sockets
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-snapd-state:/var/lib/onyx/snapd
    restart: unless-stopped

  onyx-backupd:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-backupd }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-backupd:${IMAGE_TAG:-latest}
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-backupd-state:/var/lib/onyx/backupd
      - ${RCLONE_CONFIG_DIR:-./data/rclone}:/etc/rclone:ro
      # Backupd needs to read mounted source folders and write future pool
      # restore destinations; the API still owns path validation.
      - /mnt/onyx:/mnt/onyx
    command: ["--http-listen", "0.0.0.0:8084"]
    # LAN ingress for the shared NPM: backup surface (2084 is free on the host).
    ports:
      - "${ONYX_BACKUPD_PORT:-2084}:8084"
    restart: unless-stopped

  onyx-vmm:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-vmm }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-vmm:${IMAGE_TAG:-latest}
    <<: *onyx-sockets
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-vmm-state:/var/lib/onyx/vmm
    restart: unless-stopped

  onyx-appd:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-appd }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-appd:${IMAGE_TAG:-latest}
    <<: *onyx-sockets
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-appd-state:/var/lib/onyx/appd
      # onyx-appd drives the host's engine (`docker compose`) to run app
      # containers, so it needs the daemon socket. Socket access is
      # root-equivalent, which is why the image's unprivileged user is granted
      # exactly that one group (DOCKER_GID) rather than the whole of root.
      - /var/run/docker.sock:/var/run/docker.sock
      # App data lives on the pool, mounted at the same path the host uses, so a
      # manifest's bind mount resolves to real pool storage on both sides and is
      # snapshotted with everything else.
      - /mnt/onyx:/mnt/onyx:rshared
    group_add:
      # The host's docker group id: DOCKER_GID=$(getent group docker | cut -d: -f3)
      - "${DOCKER_GID:-999}"
    # --host is the public name apps use in the URLs the UI shows an operator.
    command: ["--compose-bin", "docker", "--host", "${DOMAIN:-onyx.innotel.us}"]
    restart: unless-stopped

  onyx-ai:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-ai }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-ai:${IMAGE_TAG:-latest}
    <<: *onyx-sockets
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-ai-state:/var/lib/onyx/ai
      - ${ONYX_VAULT_TOKEN_DIR:-./data/vault/token}:/vault/token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The AI plane (docs/design/11 §6.5): ONYX consumes the platform's single
      # OmniRoute rather than shipping an upstream provider key. OMNIROUTE_API_KEY
      # may be a `vault://<mount>/<path>#<key>` reference, resolved at startup by
      # the same Cerulean Vault client onyx-objectstore uses; an unresolvable
      # reference stops the service instead of becoming an empty credential.
      # The door is the proxy in front of the gateway (:20129), not the
      # gateway's own port: Cerulean SSO is the gateway's only gate, so 20128
      # answers on the gateway host's loopback and bridge alone. What matters
      # here is that it is a routable address: the image's own default is
      # `http://localhost:20128`, which inside this container is itself.
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://192.168.1.46:20129/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-}
      # Documented BYO-key escape hatch (local-first; docs/design/07). The
      # gateway wins when both are set.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_TOKEN_FILE: ${VAULT_TOKEN_FILE:-}
      VAULT_PREFIX: ${VAULT_PREFIX:-cerulean}
      VAULT_PATH: ${VAULT_PATH:-onyx}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-}
      VAULT_CACERT: ${VAULT_CACERT:-}
    restart: unless-stopped

  onyx-objectstore:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-objectstore }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-objectstore:${IMAGE_TAG:-latest}
    volumes:
      - onyx-sockets:/run/onyx
      - onyx-objectstore-state:/var/lib/onyx/objectstore
      # The same remote catalog onyx-api writes and onyx-backupd reads: a
      # CLOUD/TIERED bucket targets one of these remotes, so configuring a
      # provider on the Shares page is all it takes to tier a bucket to it.
      # Read-only here — this service only ever reads a remote.
      - ${RCLONE_CONFIG_DIR:-./data/rclone}:/etc/rclone:ro
      - ${ONYX_VAULT_TOKEN_DIR:-./data/vault/token}:/vault/token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      HYBRID_CLOUD_ENDPOINT: ${HYBRID_CLOUD_ENDPOINT:-}
      # SecretOps (docs/design/11 §6.9): S3_* are `vault://<mount>/<path>#<key>`
      # references resolved at startup through Cerulean Vault. A reference that
      # cannot be resolved stops the service rather than becoming an empty
      # credential — an object store with no key is worse than one that refuses
      # to start.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_TOKEN_FILE: ${VAULT_TOKEN_FILE:-}
      VAULT_PREFIX: ${VAULT_PREFIX:-cerulean}
      VAULT_PATH: ${VAULT_PATH:-onyx}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-}
      VAULT_CACERT: ${VAULT_CACERT:-}
    # --rclone-config points at the shared catalog bind-mounted above; an empty
    # --rclone-bin would disable cloud tiers entirely.
    command: ["--http-listen", "0.0.0.0:9000", "--rclone-config", "/etc/rclone/rclone.conf"]
    # Memory posture: object store buffers uploads; cap moderately.
    mem_limit: 1g
    memswap_limit: 1g
    # LAN ingress for the shared NPM: storage surface (2090 is free on the
    # host — 9000 belongs to prefect there).
    ports:
      - "${ONYX_OBJECTSTORE_PORT:-2090}:9000"
    restart: unless-stopped

  onyx-davd:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args: { SERVICE: onyx-davd }
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-davd:${IMAGE_TAG:-latest}
    <<: *onyx-sockets
    volumes:
      - onyx-sockets:/run/onyx
      # The share table onyx-core renders (SIGHUP reloads it). Read-only: davd
      # never writes config, only privd does.
      - onyx-config:/etc/onyx/conf.d:ro
      # The same host storage root storaged mounts pools under, so a WebDAV
      # share is the real directory rather than a copy.
      - /mnt/onyx:/mnt/onyx:rshared
    # LAN ingress for the shared NPM: the WebDAV surface, at the /webdav/<share>
    # path the Shares page advertises (map an NPM location for /webdav here).
    # davd authenticates nobody itself: it requires the identity header the
    # gateway sets (X-Onyx-User, e.g. from an Authentik-gated proxy host), so a
    # request that reaches this port directly is refused with 401.
    ports:
      - "${ONYX_WEBDAV_PORT:-2082}:8081"
    command: ["--listen", "0.0.0.0:8081"]
    # Memory posture: davd streams file bodies through; it holds no state.
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped

  onyx-web:
    build:
      context: .
      dockerfile: docker/onyx-web/Dockerfile
    image: ghcr.io/innotelinc/onyx-oss-platform/onyx-web:${IMAGE_TAG:-latest}
    # LAN ingress for the shared NPM: app surface (2080 is free on the host —
    # 80 belongs to zeus-freepbx there).
    ports:
      - "${ONYX_WEB_PORT:-2080}:80"
    restart: unless-stopped



  # ---- Ingress: Nginx Proxy Manager ----------------------------------------

  nginx-proxy-manager:
    profiles: ["npm"]
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DISABLE_IPV6: "true"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
      # Device trust (docs/design/11 §10): the ONYX device CA, generated on the
      # host by scripts/provision-device-trust.sh, read by ssl_verify_client in
      # the gated proxy hosts' advanced config.
      - ${ONYX_PKI_DIR:-/etc/onyx/pki}:/etc/letsencrypt/onyx-device-ca:ro
    depends_on:
      - onyx-api
      - onyx-web
      - onyx-backupd
      - onyx-objectstore
    restart: unless-stopped

volumes:
  onyx-sockets:
  onyx-config:
  onyx-core-state:
  onyx-api-state:
  onyx-snapd-state:
  onyx-backupd-state:
  onyx-vmm-state:
  onyx-appd-state:
  onyx-ai-state:
  onyx-objectstore-state:
  npm-data:
  npm-letsencrypt:
