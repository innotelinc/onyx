syntax = "proto3";

package onyx.v1;

option go_package = "github.com/innotelinc/onyx/proto/gen/go/onyx/v1;onyxv1";

// Privd is the privilege helper (docs/design/04-backend-service-architecture.md#7-privilege-helper).
// It is the single root process on the system and executes a strict allowlist
// of structured operations — never arbitrary commands, never a shell.
// Reachable only over a local unix socket from other services.
service Privd {
  // Run executes one allowlisted operation with per-op argument validation.
  rpc Run(PrivRequest) returns (PrivResponse);
}

// The closed set of operations privd knows how to execute.
enum PrivOp {
  PRIV_OP_UNSPECIFIED = 0;

  // `btrfs filesystem show --raw` — enumerate every Btrfs filesystem on the
  // host. No arguments. Raw byte sizes, no units.
  BTRFS_FILESYSTEM_SHOW_RAW = 1;

  // `btrfs filesystem usage -b <mountpoint>` — usage stats for one mounted
  // pool. The single argument must be an existing path under /mnt/onyx/.
  BTRFS_FILESYSTEM_USAGE_RAW = 2;

  // `lsblk -n -P -b -o KNAME,TYPE,FSTYPE,LABEL,UUID,SIZE,MOUNTPOINT` —
  // enumerate every block device with filesystem+label+uuid info. No
  // arguments; scanning is unprivileged but probing filesystems over /dev
  // needs root, so it runs inside privd.
  LSBLK_RAW = 3;

  // `mount <device> <mountpoint>` — attach one validated device at one
  // validated mountpoint under /mnt/onyx/. Creates the mountpoint directory.
  // The device argument must be an existing block device under /dev/; the
  // mountpoint must resolve inside /mnt/onyx/.
  MOUNT_BLOCK = 4;

  // `umount <mountpoint>` — detach one device mounted under /mnt/onyx/.
  // Safe to call after an unplug (the kernel keeps the mount alive). An
  // optional second argument "true" forces a busy mount to be retried with
  // `umount -f` then `umount -l`; used only by operations the user already
  // confirmed (e.g. formatting a disk into a pool).
  UNMOUNT_BLOCK = 5;

  // `smartctl -H -A <device>` — SMART health + attributes (temperature).
  // The single argument must be a validated block device under /dev/.
  SMART_INFO_RAW = 6;

  // `write <target> <content>` — atomically write one generated daemon
  // config (docs/design/04#4, conf.d). target is a closed set: "smb"
  // (smb.conf), "nfs" (exports), "ftp" (vsftpd.conf), "sftp" (sshd_config),
  // "webdav" (davd.conf), "rsync" (rsyncd.conf). The full file content travels
  // as the second argument and is size-capped. The path is fixed by the target
  // — callers never pass a path.
  WRITE_DAEMON_CONFIG = 7;

  // `reload <targets...>` — validate and reload daemons after a config write
  // (docs/design/02#6 step 4). "smb": `testparm -s <smb.conf>` first, then
  // `systemctl reload smbd`. "nfs": `exportfs -ra`. "sftp": `sshd -t -f
  // <sshd_config>` first, then `systemctl reload onyx-sftp`. "ftp", "webdav",
  // "rsync": `systemctl reload` of vsftpd / onyx-davd / rsyncd. Fails closed:
  // no reload unless validation passes.
  RELOAD_DAEMONS = 8;

  // `mkfs.btrfs [-f] -L <label> <device>` or `mkfs.ext4 [-F] -L <label> <device>`.
  // The filesystem and force flag are strictly allowlisted.
  FORMAT_FILESYSTEM = 9;
  // Backward-compatible alias for the original Btrfs-only operation.
  CREATE_BTRFS_POOL = 10;

  // `rmdir <mountpoint>` — remove the empty mountpoint directory left behind
  // after a pool/device unmount, so the file explorer never lists a stale
  // directory. The path must resolve under /mnt/onyx/. rmdir semantics: a
  // directory that still holds anything is never removed.
  REMOVE_MOUNTPOINT = 11;
}

message PrivRequest {
  PrivOp op = 1;
  // Positional arguments; validated per-op before execution.
  repeated string args = 2;
}

message PrivResponse {
  // Process exit code. 0 on success; non-zero on failure.
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
}