syntax = "proto3";

package onyx.v1;

option go_package = "github.com/innotelinc/onyx/proto/gen/go/onyx/v1;onyxv1";

// Shares are the single logical share model (docs/design/05#6-sharing-protocols):
// one share, exposed over any enabled protocol. onyx-core owns the intent
// (SQLite) and policy; onyx-shared translates a share into per-daemon config.
// The HTTP gateway talks only to onyx-core; onyx-shared is reached over the
// local unix socket.
service CoreShares {
  rpc CreateShare(CreateShareRequest) returns (Share);
  rpc ListShares(ListSharesRequest) returns (ListSharesResponse);
  rpc GetShare(GetShareRequest) returns (Share);
  rpc DeleteShare(DeleteShareRequest) returns (DeleteShareResponse);
}

// Shared renders per-daemon configuration from a Share. It never touches
// daemons itself; onyx-core writes the rendered config and reloads the
// daemons through onyx-privd (docs/design/02#6 steps 3-4).
service Shared {
  rpc RenderConfig(RenderConfigRequest) returns (RenderConfigResponse);
  // RenderAll renders the complete daemon config files for the current share
  // set (docs/design/02#6 step 3): a full smb.conf (global section + every
  // share) and a full exports file. onyx-core feeds this straight to
  // onyx-privd's WRITE_DAEMON_CONFIG, so reload sees exactly what the UI
  // configures.
  rpc RenderAll(RenderAllRequest) returns (RenderAllResponse);
}

// The protocols one logical share can be exposed over (docs/design/05#6).
// Every protocol is off by default; enabling one is an explicit, logged act.
enum ShareProtocol {
  SHARE_PROTOCOL_UNSPECIFIED = 0;
  SHARE_PROTOCOL_SMB = 1;
  SHARE_PROTOCOL_NFS = 2;
  // FTP over explicit TLS (FTPS) via vsftpd, chrooted per share.
  SHARE_PROTOCOL_FTP = 3;
  // SFTP via the dedicated onyx-sftp sshd instance, chrooted per share.
  SHARE_PROTOCOL_SFTP = 4;
  // HTTPS WebDAV served by onyx-davd (API auth layer).
  SHARE_PROTOCOL_WEBDAV = 5;
  // rsync module over rsyncd, restricted to Onyx users.
  SHARE_PROTOCOL_RSYNC = 6;
}

// A logical share. `name` is a stable id (^[a-z0-9_-]{1,64}$); `path` is the
// dataset directory it maps to (absolute, under /mnt/onyx in production).
message Share {
  string name = 1;
  string path = 2;
  string comment = 3;
  bool readonly = 4;
  repeated ShareProtocol protocols = 5;
}

message CreateShareRequest {
  string name = 1;
  string path = 2;
  string comment = 3;
  bool readonly = 4;
  repeated ShareProtocol protocols = 5;
}

message ListSharesRequest {}

message ListSharesResponse {
  repeated Share shares = 1;
}

message GetShareRequest {
  string name = 1;
}

message DeleteShareRequest {
  string name = 1;
}

message DeleteShareResponse {}

message RenderAllRequest {
  repeated Share shares = 1;
}

message RenderAllResponse {
  // Complete /etc/onyx/conf.d/smb.conf content.
  string smb_conf = 1;
  // Complete /etc/onyx/conf.d/exports content.
  string nfs_exports = 2;
  // Complete /etc/onyx/conf.d/vsftpd.conf content (empty when no share uses FTP).
  string ftp_conf = 3;
  // Complete /etc/onyx/conf.d/sshd_config content for the dedicated onyx-sftp
  // sshd (empty when no share uses SFTP).
  string sftp_conf = 4;
  // Complete /etc/onyx/conf.d/davd.conf content for onyx-davd (empty when no
  // share uses WebDAV).
  string webdav_conf = 5;
  // Complete /etc/onyx/conf.d/rsyncd.conf content (empty when no share uses
  // rsync).
  string rsync_conf = 6;
}

// --- onyx-shared ---

message RenderConfigRequest {
  Share share = 1;
}

// Generated daemon fragments for one share. Empty string = protocol not
// enabled for this share.
message RenderConfigResponse {
  // smb.conf share-section fragment (docs/design/05#6, SMB row).
  string smb_conf = 1;
  // /etc/exports fragment (docs/design/05#6, NFS row).
  string nfs_exports = 2;
  // The share's FTP exposure fragment: its chroot root and write policy
  // (FTP row). Per-user `vsftpd.d/` chroots are driven by Onyx users, not the
  // share model.
  string ftp_conf = 3;
  // sshd_config Match block fragment for the dedicated sshd (SFTP row).
  string sftp_conf = 4;
  // davd.conf share-table fragment (WebDAV row).
  string webdav_conf = 5;
  // rsyncd.conf module fragment (Rsync row).
  string rsync_conf = 6;
}