# Onyx runtime paths (docs/design/04#4-config-and-state-layout).
#
# /run/onyx holds the unix sockets every daemon talks over. It is 2770
# root:onyx so the socket files created inside (each by its owning service
# user, via UMask=0002 -> 0664, group onyx) are reachable by every daemon.
# /mnt/onyx is the allowlisted mount root onyx-privd may mount drives under.
# /etc/onyx/conf.d holds the generated smb.conf/exports, written by root's
# onyx-privd only.
d /run/onyx 2770 root onyx -
d /mnt/onyx 2770 root onyx -
d /var/lib/onyx 0750 root onyx -
d /var/lib/onyx/core 0750 onyx-core onyx -
d /var/lib/onyx/onyx-storaged 0750 onyx-storaged onyx -
d /var/lib/onyx/snapd 0750 onyx-snapd onyx -
d /var/lib/onyx/backupd 0750 onyx-backupd onyx -
d /var/lib/onyx/vmm 0750 onyx-vmm onyx -
d /var/lib/onyx/appd 0750 onyx-appd onyx -
d /var/lib/onyx/ai 0750 onyx-ai onyx -
d /var/lib/onyx/objectstore 0750 onyx-objectstore onyx -
d /etc/onyx 0750 root onyx -
d /etc/onyx/conf.d 0755 root onyx -