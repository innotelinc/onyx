# onyx-rsyncd drop-in — serve rsync modules from the config onyx-shared renders
# and onyx-core writes to /etc/onyx/conf.d/rsyncd.conf (docs/design/05#6 Rsync
# row). Installed over the distribution's rsync.service, which reads
# /etc/rsyncd.conf via /etc/default/rsync; the empty ExecStart= clears that.
# --no-detach keeps the daemon in the foreground for systemd.
[Unit]
# Debian's rsync.service conditions on /etc/rsyncd.conf; reset that condition
# and wait for the Onyx config instead, so the unit stays inactive until a
# share enables rsync and onyx-privd starts it.
ConditionPathExists=
ConditionPathExists=/etc/onyx/conf.d/rsyncd.conf

[Service]
ExecStart=
ExecStart=/usr/bin/rsync --daemon --no-detach --config=/etc/onyx/conf.d/rsyncd.conf
# What onyx-privd asks for over systemctl (the daemon re-reads on SIGHUP).
ExecReload=/bin/kill -HUP $MAINPID
