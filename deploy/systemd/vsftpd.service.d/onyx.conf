# onyx-vsftpd drop-in — serve FTP(S) from the config onyx-shared renders and
# onyx-core writes to /etc/onyx/conf.d/vsftpd.conf (docs/design/05#6 FTP row).
# Installed over the distribution's vsftpd.service, which reads
# /etc/vsftpd.conf; the empty ExecStart= clears that so only this runs.
[Unit]
# Reset any condition the distribution unit set (/etc/vsftpd.conf), then wait
# for the Onyx config instead: the unit stays inactive until a share enables
# FTP, and onyx-privd starts it with `systemctl reload-or-restart vsftpd`.
ConditionPathExists=
ConditionPathExists=/etc/onyx/conf.d/vsftpd.conf

[Service]
ExecStart=
ExecStart=/usr/sbin/vsftpd /etc/onyx/conf.d/vsftpd.conf
# What onyx-privd asks for over systemctl (vsftpd re-reads its config on SIGHUP).
ExecReload=/bin/kill -HUP $MAINPID
