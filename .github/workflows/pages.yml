# Publish the ONYX landing page (web/landing/) to GitHub Pages.
#
# Requires Pages to be enabled once: repo Settings → Pages → Source:
# "GitHub Actions". After that, every push to main that touches the landing
# page republishes https://innotelinc.github.io/onyx/ (workflow_dispatch works
# too). Static-only, no build step — just stage + upload + deploy.

name: Pages (landing)

on:
  push:
    branches: [main]
    paths:
      - "web/landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Cancel any in-flight publish for the same ref; a Pages deploy is atomic.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
