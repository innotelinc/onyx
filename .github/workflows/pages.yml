# Publish the ONYX landing page (web/landing/) + design-doc site (docs/design,
# rendered with MkDocs Material into web/landing/docs/) to GitHub Pages.
#
# Requires Pages to be enabled once: repo Settings → Pages → Source:
# "GitHub Actions". After that, every push to main that touches either surface
# republishes:
#   https://innotelinc.github.io/onyx/        (landing, static)
#   https://innotelinc.github.io/onyx/docs/   (design docs, mkdocs build)
# workflow_dispatch works too.

name: Pages (landing + docs)

on:
  push:
    branches: [main]
    paths:
      - "web/landing/**"
      - "docs/design/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Cancel any in-flight publish for the same ref; a Pages deploy is atomic.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build design-doc site (into web/landing/docs)
        run: mkdocs build --strict --clean

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
