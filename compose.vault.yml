# ─────────────────────────────────────────────────────────────────────────────
# compose.vault.yml — SecretOps for a standalone ONYX checkout.
#
# On the Cerulean platform you do NOT need this file. Vault already runs there
# as `cerulean-vault`, so consume it instead:
#
#   VAULT_ADDR=http://<host>:8200
#   VAULT_TOKEN_FILE=./data/vault/token/onyx.token     # scoped, never root
#   VAULT_PREFIX=cerulean
#   VAULT_PATH=onyx
#
# and reference secrets as `vault://<mount>/<path>#<key>` — the same convention
# Cerulean (and Olympus) resolve at startup, so the stack and the platform agree
# on one format:
#
#   S3_ACCESS_KEY=vault://cerulean/onyx#S3_ACCESS_KEY
#   CERULEAN_API_TOKEN=vault://cerulean/onyx/api#CERULEAN_API_TOKEN
#
# Point VAULT_TOKEN at a token scoped to this product's own path under that
# prefix (the `onyx` policy — minted over there by VAULT_PRODUCT_TOKENS=onyx,
# never the platform's mount-wide `cerulean` policy and never the root token,
# which lives in ./data/vault/init/init.json, 0600).
#
# This file is the fallback for a checkout with no platform Vault. It is a
# separate profile so a deployment that consumes Cerulean's Vault cannot start a
# second, in-memory one by accident:
#
#   docker compose -f compose.vault.yml --profile vault up -d
#   export VAULT_ADDR=http://127.0.0.1:8200
#   export VAULT_TOKEN=<the VAULT_DEV_ROOT_TOKEN_ID below>
#   python3 scripts/vault-migrate.py --from-env-file .env \
#       --keys S3_ACCESS_KEY,S3_SECRET_KEY,CERULEAN_API_TOKEN
#
# ⚠ It runs Vault in **dev mode**: in-memory storage, auto-initialised and
# auto-unsealed. Fine for local iteration, and NOT for anything whose secrets
# must survive a restart — dev mode loses everything when the container is
# recreated, and its root token is a fixed, well-known string. For durable
# storage use the platform's file-backed Vault (see docs/stack.md).
# ─────────────────────────────────────────────────────────────────────────────
name: onyx-vault

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: onyx-vault
    profiles: ["vault"]
    restart: unless-stopped
    # Vault wants to mlock memory so keys are never swapped to disk.
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-onyx-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      # `vault status` exits non-zero while sealed, so it is a real liveness
      # signal rather than a bare port check. Unauthenticated, hence no token.
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      # Inert unless a container labelled autoheal=true exists in THIS stack;
      # the platform's autoheal will pick it up if the label is present.
      - "autoheal=true"
