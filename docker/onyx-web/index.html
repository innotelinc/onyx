<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ONYX — Online Storage System</title>
  <meta name="description" content="ONYX — Self-hosted online storage system. Manage pools, files, snapshots and shares.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d10'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='none' stroke='%233b9dff' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    /* ── Prism tokens (docs/design/03 §2). Dark-first; light is supported. ── */
    :root {
      --onyx-bg: #0b0d10;
      --onyx-bg-elevated: #12151a;
      --onyx-bg-glass: rgba(24, 28, 34, 0.72);
      --onyx-surface: #181c22;
      --onyx-surface-hover: #1f242c;
      --onyx-border: #262c35;
      --onyx-text: #e6e9ee;
      --onyx-text-secondary: #b3bcc8;
      --onyx-text-muted: #8f98a6;
      --onyx-accent: #3b9dff;
      --onyx-accent-hover: #6cb6ff;
      --onyx-accent-tint: rgba(59, 157, 255, 0.12);
      --onyx-success: #3ddc84;
      --onyx-warning: #f5b544;
      --onyx-danger: #f25f5f;
      --onyx-info: #5ac8fa;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
      --sidebar-w: 240px;
      --sidebar-rail: 64px;
      --rail-w: 300px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --dur-micro: 150ms;
      --dur-std: 220ms;
    }
    [data-theme="light"] {
      --onyx-bg: #f6f7f9;
      --onyx-bg-elevated: #ffffff;
      --onyx-bg-glass: rgba(255, 255, 255, 0.78);
      --onyx-surface: #ffffff;
      --onyx-surface-hover: #eef1f5;
      --onyx-border: #dde2e9;
      --onyx-text: #10131a;
      --onyx-text-secondary: #3d4550;
      --onyx-text-muted: #5b6470;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      letter-spacing: -0.011em;
      background: var(--onyx-bg);
      color: var(--onyx-text);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    a { color: var(--onyx-accent); text-decoration: none; }
    a:hover { color: var(--onyx-accent-hover); }
    :focus-visible { outline: 2px solid var(--onyx-accent); outline-offset: 2px; border-radius: var(--radius-sm); }

    /* ── Shell ─────────────────────────────────────────────────────────── */
    .app { display: grid; grid-template-columns: auto 1fr auto; height: 100vh; }

    /* ── Sidebar (Arc-style, collapsible to a 64px rail) ───────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--onyx-surface);
      border-right: 1px solid var(--onyx-border);
      display: flex; flex-direction: column;
      transition: width var(--dur-std) var(--ease);
      overflow: hidden;
    }
    .app[data-collapsed="true"] .sidebar { width: var(--sidebar-rail); }
    .brand { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); }
    .brand .mark {
      width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center;
      border-radius: var(--radius-md);
      background: linear-gradient(140deg, var(--onyx-accent), #1b6fd0);
      color: #fff; font-weight: 700;
    }
    .brand .name { font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
    .app[data-collapsed="true"] .brand .name { display: none; }

    .nav { flex: 1; overflow-y: auto; padding: var(--space-2); display: flex; flex-direction: column; gap: 2px; }
    .nav .section {
      padding: var(--space-3) var(--space-3) var(--space-1);
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--onyx-text-muted);
    }
    .app[data-collapsed="true"] .nav .section { display: none; }
    .nav a {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      color: var(--onyx-text-secondary); white-space: nowrap;
      transition: background var(--dur-micro) var(--ease), color var(--dur-micro) var(--ease);
    }
    .nav a:hover { background: var(--onyx-surface-hover); color: var(--onyx-text); }
    .nav a[aria-current="page"] { background: var(--onyx-accent-tint); color: var(--onyx-accent); }
    .nav a svg { width: 18px; height: 18px; flex: 0 0 18px; }
    .nav a .label { flex: 1; }
    .nav a .badge {
      font-size: 11px; font-variant-numeric: tabular-nums;
      padding: 1px 7px; border-radius: 999px;
      background: var(--onyx-surface-hover); color: var(--onyx-text-secondary);
    }
    .app[data-collapsed="true"] .nav a .label,
    .app[data-collapsed="true"] .nav a .badge { display: none; }
    .app[data-collapsed="true"] .nav a { justify-content: center; padding: var(--space-2); }

    .sidebar-foot { padding: var(--space-3); border-top: 1px solid var(--onyx-border); }
    .ghost-btn {
      width: 100%; display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: transparent; border: 1px solid transparent; border-radius: var(--radius-md);
      color: var(--onyx-text-muted); cursor: pointer;
      transition: background var(--dur-micro) var(--ease), color var(--dur-micro) var(--ease);
    }
    .ghost-btn:hover { background: var(--onyx-surface-hover); color: var(--onyx-text); }
    .app[data-collapsed="true"] .ghost-btn .label { display: none; }
    .app[data-collapsed="true"] .ghost-btn { justify-content: center; }

    /* ── Main ──────────────────────────────────────────────────────────── */
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 56px; flex: 0 0 56px;
      display: flex; align-items: center; gap: var(--space-4);
      padding: 0 var(--space-5);
      border-bottom: 1px solid var(--onyx-border);
      background: var(--onyx-bg-glass);
      backdrop-filter: blur(24px);
    }
    .crumbs { display: flex; align-items: center; gap: var(--space-2); color: var(--onyx-text-muted); white-space: nowrap; }
    .crumbs b { color: var(--onyx-text); font-weight: 600; }
    .search {
      flex: 1; max-width: 460px; display: flex; align-items: center; gap: var(--space-2);
      height: 34px; padding: 0 var(--space-3);
      background: var(--onyx-surface); border: 1px solid var(--onyx-border);
      border-radius: var(--radius-md); color: var(--onyx-text-muted); cursor: text;
    }
    .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--onyx-text); }
    .search kbd, kbd {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
      padding: 2px 6px; border: 1px solid var(--onyx-border); border-radius: var(--radius-sm);
      background: var(--onyx-bg-elevated); color: var(--onyx-text-muted);
    }
    .topbar .spacer { flex: 1; }
    .pill {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: 4px 10px; border-radius: 999px; font-size: 12px;
      border: 1px solid var(--onyx-border); background: var(--onyx-surface);
      color: var(--onyx-text-secondary);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--onyx-text-muted); }
    .dot.ok { background: var(--onyx-success); }
    .dot.warn { background: var(--onyx-warning); }
    .dot.err { background: var(--onyx-danger); }
    .icon-btn {
      width: 34px; height: 34px; display: grid; place-items: center;
      background: transparent; border: 1px solid transparent; border-radius: var(--radius-md);
      color: var(--onyx-text-secondary); cursor: pointer;
      transition: background var(--dur-micro) var(--ease);
    }
    .icon-btn:hover { background: var(--onyx-surface-hover); color: var(--onyx-text); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(140deg, var(--onyx-accent), #1b6fd0); color: #fff;
      font-size: 12px; font-weight: 600;
    }

    .content { flex: 1; overflow-y: auto; padding: var(--space-6); }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); }
    .page-head h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    .page-head p { margin: var(--space-1) 0 0; color: var(--onyx-text-muted); }

    .grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card {
      background: var(--onyx-bg-elevated); border: 1px solid var(--onyx-border);
      border-radius: var(--radius-lg); padding: var(--space-5);
    }
    .card h3 { margin: 0 0 var(--space-2); font-size: 14px; }
    .card .stat { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .card .sub { color: var(--onyx-text-muted); font-size: 12px; }
    .empty {
      border: 1px dashed var(--onyx-border); border-radius: var(--radius-lg);
      padding: var(--space-10); text-align: center; color: var(--onyx-text-muted);
    }
    .empty b { display: block; color: var(--onyx-text); margin-bottom: var(--space-2); font-size: 15px; }
    .btn {
      display: inline-flex; align-items: center; gap: var(--space-2);
      height: 34px; padding: 0 var(--space-4); border-radius: var(--radius-md);
      border: 1px solid var(--onyx-border); background: var(--onyx-surface);
      color: var(--onyx-text); cursor: pointer;
      transition: background var(--dur-micro) var(--ease), border-color var(--dur-micro) var(--ease);
    }
    .btn:hover { background: var(--onyx-surface-hover); border-color: var(--onyx-accent); }
    .btn.primary { background: var(--onyx-accent); border-color: var(--onyx-accent); color: #fff; }
    .btn.primary:hover { background: var(--onyx-accent-hover); }
    .reserved { border-style: dashed; background: transparent; }
    .reserved .stat { color: var(--onyx-text-muted); font-size: 15px; font-weight: 600; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--onyx-accent-tint); color: var(--onyx-accent); }

    /* ── Activity rail ─────────────────────────────────────────────────── */
    .rail {
      width: var(--rail-w); background: var(--onyx-surface);
      border-left: 1px solid var(--onyx-border); display: flex; flex-direction: column;
      transition: width var(--dur-std) var(--ease);
      overflow: hidden;
    }
    .app[data-rail="closed"] .rail { width: 0; border-left: 0; }
    .rail h2 { margin: 0; padding: var(--space-4); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--onyx-text-muted); white-space: nowrap; }
    .rail .events { padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); overflow-y: auto; }
    .event { display: flex; gap: var(--space-3); font-size: 13px; }
    .event time { color: var(--onyx-text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    /* ── Command palette ───────────────────────────────────────────────── */
    .palette {
      position: fixed; inset: 0; z-index: 50; display: none;
      background: rgba(6, 8, 11, 0.55); backdrop-filter: blur(4px);
      padding-top: 14vh; justify-content: center;
    }
    .palette[data-open="true"] { display: flex; }
    .palette .sheet {
      width: min(640px, 92vw); max-height: 60vh; overflow: hidden;
      background: var(--onyx-bg-elevated); border: 1px solid var(--onyx-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 48px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .03);
      display: flex; flex-direction: column;
    }
    .palette .sheet input {
      border: 0; outline: 0; background: transparent; color: var(--onyx-text);
      padding: var(--space-4); border-bottom: 1px solid var(--onyx-border); font-size: 15px;
    }
    .palette ul { list-style: none; margin: 0; padding: var(--space-2); overflow-y: auto; }
    .palette li {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
      padding: var(--space-3); border-radius: var(--radius-md); cursor: pointer;
    }
    .palette li[data-active="true"], .palette li:hover { background: var(--onyx-surface-hover); }
    .palette li .hint { color: var(--onyx-text-muted); font-size: 12px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
    @media (max-width: 1100px) { .rail { display: none; } }
    @media (max-width: 820px) { .app[data-collapsed="false"] .sidebar { width: var(--sidebar-rail); } }
  </style>
</head>
<body>
  <div class="app" id="app" data-collapsed="false" data-rail="open">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">O</span>
        <span class="name">ONYX</span>
      </div>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="collapse" type="button" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
          <span class="label">Collapse</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"><b>Dashboard</b></div>
        <button class="search" id="search" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span style="flex:1;text-align:left">Search files, shares, actions…</span>
          <kbd>⌘K</kbd>
        </button>
        <span class="spacer"></span>
        <span class="pill" id="status" title="System status"><span class="dot" id="status-dot"></span><span id="status-text">Checking…</span></span>
        <button class="icon-btn" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" id="rail-toggle" type="button" title="Toggle activity rail" aria-label="Toggle activity rail">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <span class="avatar" title="Signed in via Cerulean" aria-label="Account">O</span>
      </header>
      <main class="content" id="content"></main>
    </div>

    <!-- Activity rail -->
    <aside class="rail" aria-label="Activity">
      <h2>Activity</h2>
      <div class="events" id="events">
        <div class="event"><span class="dot ok" style="margin-top:5px"></span><div><div>System status endpoint connected</div><time id="ev-time">now</time></div></div>
        <div class="event"><span class="dot ok" style="margin-top:5px"></span><div><div>Snapshot and backup safety APIs connected</div><time>live</time></div></div>
      </div>
    </aside>
  </div>

  <!-- Command palette -->
  <div class="palette" id="palette" data-open="false" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="sheet">
      <input id="palette-input" placeholder="Type a command…" autocomplete="off" spellcheck="false">
      <ul id="palette-list"></ul>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var I = function (d) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
    };
    var ICONS = {
      dashboard: I('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),
      files: I('<path d="M4 4h5l2 2h9v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>'),
      snapshots: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      backups: I('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>'),
      apps: I('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),
      shares: I('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/>'),
      users: I('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>'),
      storage: I('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
      settings: I('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>')
    };

    /* One place that defines the surfaces. Each view is a first slice of the
     * v0.2 "Flint" milestone; the data-heavy parts (file explorer, snapshot
     * timeline) fill in behind these shells. */
    var VIEWS = [
      { id: 'dashboard', label: 'Dashboard', icon: ICONS.dashboard, section: 'Home' },
      { id: 'files',     label: 'Files',     icon: ICONS.files,     section: 'Data' },
      { id: 'storage',   label: 'Storage',   icon: ICONS.storage,   section: 'Data' },
      { id: 'snapshots', label: 'Snapshots', icon: ICONS.snapshots, section: 'Data', badge: '0' },
      { id: 'backups',   label: 'Backups',   icon: ICONS.backups,   section: 'Data' },
      { id: 'scrub',     label: 'Scrub',     icon: ICONS.settings,  section: 'Data' },
      { id: 'apps',      label: 'Apps',      icon: ICONS.apps,      section: 'Platform' },
      { id: 'vms',       label: 'VMs',       icon: ICONS.storage,   section: 'Platform' },
      { id: 'objects',   label: 'Objects',   icon: ICONS.files,     section: 'Platform' },
      { id: 'shares',    label: 'Shares',    icon: ICONS.shares,    section: 'Platform', badge: '0' },
      { id: 'users',     label: 'Users',     icon: ICONS.users,     section: 'Platform' },
      { id: 'settings',  label: 'Settings',  icon: ICONS.settings,  section: 'Platform' }
    ];

    var API = window.ONYX_API_BASE || (function () {
      var host = window.location.hostname;
      if (host === 'app.onyx.innotel.us') return 'https://api.onyx.innotel.us/api/v1';
      return '/api/v1';
    })();

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ── nav ──────────────────────────────────────────────────────────── */
    function renderNav(active) {
      var html = '';
      var seen = '';
      VIEWS.forEach(function (v) {
        if (v.section !== seen) {
          seen = v.section;
          html += '<div class="section">' + esc(v.section) + '</div>';
        }
        html += '<a href="#/' + v.id + '"' + (v.id === active ? ' aria-current="page"' : '') + ' title="' + esc(v.label) + '">' +
          v.icon + '<span class="label">' + esc(v.label) + '</span>' +
          (v.badge ? '<span class="badge">' + esc(v.badge) + '</span>' : '') +
          '</a>';
      });
      document.getElementById('nav').innerHTML = html;
    }

    /* ── views ────────────────────────────────────────────────────────── */
    function card(title, body) { return '<div class="card"><h3>' + title + '</h3>' + body + '</div>'; }
    function stat(value, label) { return '<div class="stat">' + esc(value) + '</div><div class="sub">' + esc(label) + '</div>'; }
    function reserved(title, note) { return '<div class="card reserved"><h3>' + title + '</h3><div class="stat">' + esc(note) + '</div></div>'; }

    function viewDashboard() {
      return '<div class="page-head"><div><h1>Dashboard</h1><p>Health and capacity at a glance.</p></div>' +
        '<button class="btn primary" onclick="location.hash=\'#/files\'">Browse files</button></div>' +
        '<div class="grid">' +
        '<div class="card"><h3>Pools</h3><div class="stat" id="stat-pools">—</div><div class="sub">storage pools online</div></div>' +
        '<div class="card"><h3>Capacity</h3><div class="stat" id="stat-capacity">—</div><div class="sub">used of total</div></div>' +
        '<div class="card"><h3>Health</h3><div class="stat" id="stat-health">—</div><div class="sub">scrub &amp; device status</div></div>' +
        '<div class="card"><h3>Version</h3><div class="stat" id="stat-version">—</div><div class="sub">onyx-api</div></div>' +
        '</div>' +
        '<div class="grid" style="margin-top:16px">' +
        card('Safety plane', stat('Obsidian', 'snapshots · backups · scrub scheduling · device health')) +
        '</div>';
    }

    function viewFiles() {

    function viewStorage() {

        '<div class="card" id="storage-pools"><div class="empty"><b>Loading pools…</b>Checking mounted storage.</div></div>' +
        '<div class="card" style="margin-top:16px" id="storage-devices"><div class="empty"><b>Loading devices…</b>Scanning block devices.</div></div>' +
        '<div class="card" style="margin-top:16px" id="storage-pool-setup"><h3>Create an Onyx storage pool</h3><p class="sub">Format a whole disk, then mount it automatically under /mnt/onyx. The defaults below — label <b>main-pool</b>, Btrfs, mounted at /mnt/onyx/main-pool, force unmount and erase — are ready to use; change any option before creating. Any whole disk can be pooled — internal disks included — and a disk Onyx already mounted is re-created in place.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end"><label>Disk<select id="pool-device" class="search" style="width:100%;max-width:none"><option value="">Loading safe disks…</option></select></label><label>Pool label<input id="pool-name" class="search" style="width:100%;max-width:none" value="main-pool" placeholder="main-pool"></label><label>Filesystem<select id="pool-fs" class="search" style="width:100%;max-width:none"><option value="btrfs">Btrfs</option><option value="ext4">ext4</option></select></label><label>Mount directory<input id="pool-mount-name" class="search" style="width:100%;max-width:none" placeholder="Defaults to pool label"></label><label style="display:flex;gap:8px;align-items:center"><input id="pool-auto-mount" type="checkbox" checked> Auto-mount after format</label><label style="display:flex;gap:8px;align-items:center"><input id="pool-force" type="checkbox" checked> Force unmount &amp; erase</label><button class="btn" id="pool-preview">Review destructive operation</button><button class="btn" id="pool-defaults">Use defaults</button></div><div id="pool-warning" class="sub" style="margin-top:12px">A verified backup and final confirmation are required before any erase operation.</div></div>';

    // protojson serializes protocol enums as names ("SHARE_PROTOCOL_SMB");
    // render them the way users see them in the API and CLI ("smb, nfs").
    function friendlyProtocols(list) {
      return (list || []).map(function (p) {
        return String(p).replace(/^SHARE_PROTOCOL_/, '').toLowerCase();
      }).join(', ');
    }

    function formatBytes(value) {
      var n = Number(value || 0);
      if (!n) return '0 MB';
      // Terabytes matter here: a pool is routinely 1-20 TB, and "2048.00 GB"
      // makes an operator do arithmetic to read a capacity headline.
      if (n >= 1024 * 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024 * 1024)).toFixed(2) + ' TB';
      if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
      if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(2) + ' MB';
      if (n >= 1024) return (n / 1024).toFixed(2) + ' KB';
      return n + ' B';
    }

    function deviceRole(device) {
      if (device.mountpoint && device.mountpoint.indexOf('/mnt/onyx') !== 0) return 'Mounted outside Onyx — likely an OS or system volume';
      if (device.type === 'disk') return device.removable ? 'Removable disk (USB/SD)' : 'Whole disk';
      if (device.type === 'part') return device.removable ? 'Removable partition' : 'Partition';
      return device.type || 'Block device';
    }

    // `nodePresent` is answered by the data plane about its own /dev: a disk can
    // be listed from /sys and still have no device node in the container's mount
    // namespace, in which case nothing can be formatted or mounted on it. Saying
    // so is the difference between "not visible to Onyx" and a failed erase.
    function deviceNodeNote(device) {
      if (device.nodePresent === false) return 'Not visible to Onyx: ' + (device.path || '/dev/' + device.kname) + ' does not exist in the data plane, so this disk can be listed but not formatted or mounted (bind /dev into onyx-privd and onyx-storaged).';
      return '';
    }

    function deviceWarning(device) {
      if (device.nodePresent === false) return deviceNodeNote(device);
      if (device.mountpoint && device.mountpoint.indexOf('/mnt/onyx') !== 0) return 'Already mounted by the host; Onyx will not touch it.';
      if (!device.fsType) return 'No filesystem signature detected. It may be unused, encrypted, RAID/LVM metadata, or an unformatted partition.';
      if (['vfat', 'fat32', 'exfat', 'ntfs', 'ext2', 'ext3', 'ext4', 'xfs', 'btrfs', 'hfsplus', 'apfs'].indexOf(String(device.fsType).toLowerCase()) < 0) return 'Filesystem detected. Attach will ask the Linux kernel to mount it; support depends on the host kernel/tools.';
      return 'Readable filesystem detected; attaching does not format or erase it.';
    }

    // True for a partition kname belonging directly to a disk kname: "sdc1"
    // belongs to "sdc", "nvme0n1p1" to "nvme0n1". Mirrors the data plane's
    // own mapping so the Storage page reasons about a disk and its partitions
    // the same way the backend does.
    function isPartitionOf(diskKname, candidate) {
      var disk = String(diskKname || '');
      var s = String(candidate || '');
      if (!disk || s === disk || s.indexOf(disk) !== 0) return false;
      var suffix = s.slice(disk.length);
      return /^[0-9]+$/.test(suffix) || /^p[0-9]+$/.test(suffix);
    }

    // Every mount of a disk: the disk itself plus any of its partitions.
    function diskMounts(disk, devices) {
      return (devices || []).filter(function (d) {
        return (d.kname === disk.kname || isPartitionOf(disk.kname, d.kname)) && d.mountpoint;
      });
    }

    // "onyx" when the disk (or one of its partitions) is mounted under
    // /mnt/onyx, "host" when anything of it is mounted elsewhere, else "none".
    // Host mounts are the boundary Onyx never crosses.
    function diskMountState(disk, devices) {
      var mounts = diskMounts(disk, devices);
      if (mounts.some(function (m) { return String(m.mountpoint).indexOf('/mnt/onyx') !== 0; })) return 'host';
      return mounts.length ? 'onyx' : 'none';
    }

    function loadStorage() {

        }).join('') + '</div>' : '<div class="empty"><b>No storage pools mounted</b>Attach a readable device below or connect a pool on the host.</div>';
        devices.innerHTML = '<h3>Devices</h3><p class="sub">Onyx identifies disks by label, UUID, filesystem, size, mountpoint, and removable status. It never formats a device from this screen.</p>' + (deviceRows.length ? '<div style="display:grid;gap:10px">' + deviceRows.map(function (device) {
          var attached = device.state === 'mounted' || !!device.mountpoint;
          var outside = device.mountpoint && device.mountpoint.indexOf('/mnt/onyx') !== 0;
          var visible = device.nodePresent !== false;
          var attachable = !!device.fsType && !outside && visible;
          var action = attached ? (outside ? '<button class="btn" disabled title="Mounted outside Onyx">Host mounted</button>' : '<button class="btn" data-device-detach="' + esc(device.name) + '">Detach</button>') : (attachable ? '<button class="btn primary" data-device-attach="' + esc(device.name) + '">Attach</button>' : '<button class="btn" disabled title="' + (visible ? 'No filesystem signature; formatting is intentionally not offered here' : 'This device has no node in the data plane container') + '">' + (visible ? 'Needs filesystem' : 'Not visible') + '</button>');
          var identity = [device.path || device.kname, device.fsType || 'no filesystem signature', formatBytes(device.sizeBytes), device.uuid ? 'UUID ' + device.uuid : 'no UUID'].join(' · ');
          return '<div class="event" style="justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--onyx-border);padding:12px 0"><div style="min-width:0"><b>' + esc(device.label || device.name) + '</b><div class="sub">' + esc(deviceRole(device)) + ' · ' + esc(identity) + '</div><div class="sub">' + esc(deviceWarning(device)) + (device.mountpoint ? ' · ' + esc(device.mountpoint) : '') + '</div></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="tag">' + esc(device.state || 'unknown') + '</span>' + action + '</div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No devices detected</b>Connect a disk or USB drive to make it available to Onyx.</div>');
        Array.prototype.forEach.call(devices.querySelectorAll('[data-device-attach]'), function (button) {
          button.addEventListener('click', function () { button.disabled = true; apiJSON('/devices/' + encodeURIComponent(button.dataset.deviceAttach) + '/attach', { method: 'POST' }).then(loadStorage).catch(showError); });
        });
        Array.prototype.forEach.call(devices.querySelectorAll('[data-device-detach]'), function (button) {
          button.addEventListener('click', function () { if (!confirm('Detach this device and its shares?')) return; button.disabled = true; apiJSON('/devices/' + encodeURIComponent(button.dataset.deviceDetach) + '/detach', { method: 'POST' }).then(loadStorage).catch(showError); });
        });
      }).catch(showError);
    }

    // refreshStorage re-reads the whole storage view. The device read carries a
    // live rescan on the data plane, so a drive or pool that appeared since the

    // something even when nothing has changed.
    function refreshStorage() {

          button.addEventListener('click', function () {
            if (!confirm('Rollback this snapshot? The source subvolume must not be mounted.')) return;
            apiJSON('/snapshots/' + encodeURIComponent(button.dataset.rollback) + '/rollback', { method: 'POST' }).then(loadSnapshots).catch(showError);
          });
        });
      }).catch(showError);
    }

    function loadBackups() {
      var list = document.getElementById('backup-list');
      if (!list) return;
      Promise.all([apiJSON('/backup-jobs'), apiJSON('/backup-report')]).then(function (parts) {
        var jobs = parts[0].jobs || [], report = parts[1];
        var health = Math.round((report.overallHealth || 0) * 100);
        var summary = document.getElementById('backup-summary');
        if (summary) summary.innerHTML = '<div class="card"><h3>Recovery health</h3><div class="stat">' + health + '%</div><div class="sub">across ' + (report.jobs || []).length + ' configured jobs</div></div>';
        list.innerHTML = jobs.length ? '<div style="display:grid;gap:10px">' + jobs.map(function (j) {
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(j.name) + '</b><div class="sub">' + esc(j.source + ' → ' + j.target + ' · ' + (j.schedule || 'manual')) + '</div></div><div style="display:flex;gap:8px"><button class="btn" data-restore-job="' + esc(j.id) + '">Restore</button><button class="btn" data-run="' + esc(j.id) + '">Run now</button><button class="btn" data-delete-job="' + esc(j.id) + '">Remove</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No backup jobs yet</b>Create a job to protect a share or snapshot.</div>';
        Array.prototype.forEach.call(list.querySelectorAll('[data-run]'), function (button) {
          button.addEventListener('click', function () { apiJSON('/backup-jobs/' + encodeURIComponent(button.dataset.run) + '/run', { method: 'POST' }).then(loadBackups).catch(showError); });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-delete-job]'), function (button) {
          button.addEventListener('click', function () {
            if (!confirm('Remove this backup job and its recorded history? Existing backup files are not deleted.')) return;
            apiJSON('/backup-jobs/' + encodeURIComponent(button.dataset.deleteJob), { method: 'DELETE' }).then(loadBackups).catch(showError);
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-restore-job]'), function (button) {
          button.addEventListener('click', function () {
            apiJSON('/backup-jobs/' + encodeURIComponent(button.dataset.restoreJob) + '/history').then(function (data) {
              var runs = (data.runs || []).filter(function (run) { return run.status === 'succeeded'; });
              if (!runs.length) throw { error: { message: 'No successful backup run is available to restore.' } };
              var destination = prompt('Restore destination (future pool path)', '/mnt/onyx/restore');
              if (!destination) return;
              return apiJSON('/backups/' + encodeURIComponent(runs[runs.length - 1].id) + '/restore', { method: 'POST', body: JSON.stringify({ destination: destination }) });
            }).then(function (result) { if (result) alert('Restore started.'); }).catch(showError);
          });
        });
      }).catch(showError);
    }

    function showError(err) {
      var message = err && err.error && err.error.message ? err.error.message : 'The API request failed.';
      var target = document.getElementById('content');
      if (target) target.insertAdjacentHTML('afterbegin', '<div class="card" style="border-color:var(--onyx-danger);color:var(--onyx-danger)">' + esc(message) + '</div>');
    }

    // --- Apps (v0.4 "Jade"): the app store and container lifecycle ----------
    // The store and the installed list are one catalog filtered by status, so
    // the page shows both sides of the same data: what can be installed, what
    // is installed, and the containers the installed apps are running.

    function viewApps() {
      return '<div class="page-head"><div><h1>Apps</h1><p>Self-hosted applications from the app store, running as containers on this host.</p></div>' +
        '<button class="btn" id="apps-refresh">Refresh</button></div>' +
        '<div class="card" id="app-catalog"><div class="empty"><b>Loading the app store…</b>Reading the signed catalog.</div></div>' +
        '<div class="card" style="margin-top:16px" id="app-installed"><div class="empty"><b>Loading installed apps…</b>Reading the install records.</div></div>' +
        '<div class="card" style="margin-top:16px" id="app-containers"><div class="empty"><b>Loading containers…</b>Asking the container runtime.</div></div>';
    }

    // statusTag colours an app or container state. A running container and an
    // installed app are the healthy states; error is the only red one.
    function stateTag(state) {
      var s = String(state || 'unknown');
      var tone = s === 'running' || s === 'installed' ? 'var(--onyx-success)' : (s === 'error' ? 'var(--onyx-danger)' : 'var(--onyx-muted,#888)');
      return '<span class="tag" style="border-color:' + tone + ';color:' + tone + '">' + esc(s.replace(/_/g, ' ')) + '</span>';
    }

    function loadApps() {
      var catalog = document.getElementById('app-catalog');
      var installed = document.getElementById('app-installed');
      if (!catalog) return Promise.resolve();
      return Promise.all([apiJSON('/apps'), apiJSON('/apps?status=installed')]).then(function (parts) {
        var all = parts[0].apps || [], have = parts[1].apps || [];
        var installedIDs = {};
        have.forEach(function (a) { installedIDs[a.id] = true; });

        catalog.innerHTML = '<h3>App store</h3>' + (all.length ? '<div style="display:grid;gap:10px">' + all.map(function (app) {
          var done = installedIDs[app.id];
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(app.name) + '</b>' + stateTag(app.status) + '<div class="sub">' + esc(app.id) + ' · v' + esc(app.version) + ' · ' + esc(app.description || 'no description') + '</div></div>' +
            (done ? '<span class="sub">installed</span>' : '<button class="btn primary" data-app-install="' + esc(app.id) + '" data-app-version="' + esc(app.version) + '">Install</button>') + '</div>';
        }).join('') + '</div>' : '<div class="empty"><b>The catalog is empty</b>onyx-appd reported no apps. Check that onyx-appd is deployed and its catalog is mounted.</div>');

        installed.innerHTML = '<h3>Installed</h3>' + (have.length ? '<div style="display:grid;gap:10px">' + have.map(function (app) {
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(app.name) + '</b>' + stateTag(app.status) + '<div class="sub">' + esc(app.id) + ' · v' + esc(app.version) + (app.installedAt ? ' · installed ' + esc(app.installedAt) : '') + '</div></div>' +
            '<div><button class="btn" data-app-uninstall="' + esc(app.id) + '">Uninstall</button> <button class="btn" data-app-purge="' + esc(app.id) + '">Uninstall &amp; erase data</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No apps installed</b>Install one from the catalog above.</div>');

        Array.prototype.forEach.call(catalog.querySelectorAll('[data-app-install]'), function (button) {
          button.addEventListener('click', function () {
            button.disabled = true; button.textContent = 'Installing…';
            apiJSON('/apps', { method: 'POST', body: JSON.stringify({ app_id: button.dataset.appInstall, version: button.dataset.appVersion }) })
              .then(function () { return refreshApps(); })
              .catch(function (err) { button.disabled = false; button.textContent = 'Install'; showError(err); });
          });
        });
        Array.prototype.forEach.call(installed.querySelectorAll('[data-app-uninstall]'), function (button) {
          button.addEventListener('click', function () { uninstallApp(button.dataset.appUninstall, false, button); });
        });
        Array.prototype.forEach.call(installed.querySelectorAll('[data-app-purge]'), function (button) {
          button.addEventListener('click', function () {
            if (!window.confirm('Uninstall ' + button.dataset.appPurge + ' and permanently erase its data volumes? This cannot be undone.')) return;
            uninstallApp(button.dataset.appPurge, true, button);
          });
        });
      }).catch(function (err) {
        if (catalog) catalog.innerHTML = '<h3>App store</h3><div class="empty"><b>onyx-appd is unavailable</b>' + esc(err && err.error && err.error.message ? err.error.message : 'The app service did not answer.') + '</div>';
      });
    }

    function uninstallApp(appID, purge, button) {
      button.disabled = true; button.textContent = 'Removing…';
      apiJSON('/apps/' + encodeURIComponent(appID) + '?purge_data=' + (purge ? 'true' : 'false') + '&force=true', { method: 'DELETE' })
        .then(function () { return refreshApps(); })
        .catch(function (err) { button.disabled = false; button.textContent = purge ? 'Uninstall & erase data' : 'Uninstall'; showError(err); });
    }

    function loadContainers() {
      var card = document.getElementById('app-containers');
      if (!card) return Promise.resolve();
      return apiJSON('/containers').then(function (data) {
        var rows = data.containers || [];
        card.innerHTML = '<h3>Containers</h3>' + (rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (ct) {
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(ct.service || ct.name) + '</b>' + stateTag(ct.status) + '<div class="sub">' + esc(ct.id) + ' · ' + esc(ct.image) + (ct.appId ? ' · app ' + esc(ct.appId) : '') + '</div></div>' +
            '<div><button class="btn" data-container-start="' + esc(ct.id) + '">Start</button> <button class="btn" data-container-stop="' + esc(ct.id) + '">Stop</button> <button class="btn" data-container-restart="' + esc(ct.id) + '">Restart</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No containers</b>Installing an app brings its containers up here.</div>');
        ['start', 'stop', 'restart'].forEach(function (action) {
          Array.prototype.forEach.call(card.querySelectorAll('[data-container-' + action + ']'), function (button) {
            button.addEventListener('click', function () {
              button.disabled = true;
              apiJSON('/containers/' + encodeURIComponent(button.dataset['container' + action.charAt(0).toUpperCase() + action.slice(1)]) + '/' + action, { method: 'POST' })
                .then(function () { return loadContainers(); })
                .catch(function (err) { button.disabled = false; showError(err); });
            });
          });
        });
      }).catch(function (err) {
        card.innerHTML = '<h3>Containers</h3><div class="empty"><b>The container runtime is unavailable</b>' + esc(err && err.error && err.error.message ? err.error.message : 'onyx-appd did not answer.') + '</div>';
      });
    }

    function refreshApps() {
      var button = document.getElementById('apps-refresh');
      if (button) { button.disabled = true; button.textContent = 'Refreshing…'; }
      return Promise.all([loadApps(), loadContainers()]).catch(function () {}).then(function () {
        if (button) { button.disabled = false; button.textContent = 'Refresh'; }
      });
    }

    // --- VMs (v0.4 "Jade"): libvirt/QEMU machines on the pool ---------------

    function viewVMs() {
      return '<div class="page-head"><div><h1>Virtual machines</h1><p>Machines run on KVM through libvirt; their disk images live on the pool, so snapshots and backups cover them too.</p></div>' +
        '<button class="btn" id="vms-refresh">Refresh</button></div>' +
        '<div class="card" style="margin-bottom:16px"><h3>Create a virtual machine</h3><p class="sub">A machine is defined stopped: review it, then boot it. The disk image is created on the pool and is never overwritten.</p>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end">' +
        '<label>Name<input id="vm-name" class="search" style="width:100%;max-width:none" placeholder="debian"></label>' +
        '<label>vCPUs<input id="vm-vcpus" class="search" style="width:100%;max-width:none" type="number" min="1" value="2"></label>' +
        '<label>Memory (MiB)<input id="vm-memory" class="search" style="width:100%;max-width:none" type="number" min="64" value="2048"></label>' +
        '<label>Disk (MiB)<input id="vm-disk" class="search" style="width:100%;max-width:none" type="number" min="1024" value="20480"></label>' +
        '<label>OS label<input id="vm-os" class="search" style="width:100%;max-width:none" placeholder="debian-12"></label>' +
        '<label>Install ISO (optional)<input id="vm-iso" class="search" style="width:100%;max-width:none" placeholder="/mnt/onyx/main-pool/@apps/iso/debian.iso"></label>' +
        '<button class="btn primary" id="vm-create">Create machine</button></div><div id="vm-warning" class="sub" style="margin-top:12px"></div></div>' +
        '<div class="card" id="vm-list"><div class="empty"><b>Loading virtual machines…</b>Asking the hypervisor.</div></div>';
    }

    function loadVMs() {
      var list = document.getElementById('vm-list');
      if (!list) return Promise.resolve();
      return apiJSON('/vms').then(function (data) {
        var rows = data.vms || [];
        list.innerHTML = '<h3>Machines</h3>' + (rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (vm) {
          var running = vm.status === 'running';
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(vm.name) + '</b>' + stateTag(vm.status) + '<div class="sub">' + esc(vm.id) + ' · ' + vm.vcpus + ' vCPU · ' + formatBytes(vm.memoryMb * 1024 * 1024) + ' RAM' + (vm.disk ? ' · ' + esc(vm.disk) : '') + '</div></div>' +
            '<div><button class="btn" data-vm-start="' + esc(vm.id) + '"' + (running ? ' disabled' : '') + '>Start</button> <button class="btn" data-vm-stop="' + esc(vm.id) + '"' + (running ? '' : ' disabled') + '>Stop</button> <button class="btn" data-vm-delete="' + esc(vm.id) + '"' + (running ? ' disabled' : '') + '>Delete</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No virtual machines</b>Create one above. The machine is defined stopped and stays that way until you start it.</div>');

        ['start', 'stop'].forEach(function (action) {
          Array.prototype.forEach.call(list.querySelectorAll('[data-vm-' + action + ']'), function (button) {
            button.addEventListener('click', function () {
              button.disabled = true;
              var id = button.dataset['vm' + action.charAt(0).toUpperCase() + action.slice(1)];
              var request = action === 'stop'
                ? apiJSON('/vms/' + encodeURIComponent(id) + '/stop', { method: 'POST', body: JSON.stringify({ graceful: true }) })
                : apiJSON('/vms/' + encodeURIComponent(id) + '/start', { method: 'POST' });
              request.then(function () { return loadVMs(); }).catch(function (err) { button.disabled = false; showError(err); });
            });
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-vm-delete]'), function (button) {
          button.addEventListener('click', function () {
            var id = button.dataset.vmDelete;
            // The disk image is deleted too: this is the one irreversible VM
            // action, so it is spelled out in the confirmation.
            if (!window.confirm('Delete ' + id + ' and its disk image? Everything on the machine is lost and cannot be recovered.')) return;
            button.disabled = true;
            apiJSON('/vms/' + encodeURIComponent(id) + '?delete_disk=true', { method: 'DELETE' })
              .then(function () { return loadVMs(); })
              .catch(function (err) { button.disabled = false; showError(err); });
          });
        });
      }).catch(function (err) {
        list.innerHTML = '<h3>Machines</h3><div class="empty"><b>onyx-vmm is unavailable</b>' + esc(err && err.error && err.error.message ? err.error.message : 'The virtualization service did not answer.') + '</div>';
      });
    }

    function refreshVMs() {
      var button = document.getElementById('vms-refresh');
      if (button) { button.disabled = true; button.textContent = 'Refreshing…'; }
      return loadVMs().catch(function () {}).then(function () {
        if (button) { button.disabled = false; button.textContent = 'Refresh'; }
      });
    }

    // --- Objects (v0.4 "Jade"): S3 buckets and hybrid-cloud tiering --------

    function viewObjects() {
      return '<div class="page-head"><div><h1>Objects</h1><p>S3-compatible buckets for application data — local, cloud-primary, or tiered with the pool as the hot copy and a remote as the cold tier.</p></div>' +
        '<button class="btn" id="objects-refresh">Refresh</button></div>' +
        '<div class="card" style="margin-bottom:16px"><h3>Create a bucket</h3><p class="sub">A <b>local</b> bucket stays on the pool. A <b>cloud</b> or <b>tiered</b> bucket targets a remote configured on the Shares page (for example <code>b2-archive:</code>); tiered buckets mirror to it on sync and can release local copies once the cloud copy is verified.</p>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end">' +
        '<label>Bucket name<input id="bucket-name" class="search" style="width:100%;max-width:none" placeholder="documents"></label>' +
        '<label>Tier<select id="bucket-tier" class="search" style="width:100%;max-width:none"><option value="local">Local (pool only)</option><option value="tiered">Tiered (hot pool, cold cloud)</option><option value="cloud">Cloud-primary</option></select></label>' +
        '<label>Cloud target<input id="bucket-target" class="search" style="width:100%;max-width:none" list="bucket-remotes" placeholder="b2-archive:"></label>' +
        '<label>Evict local copies after (days)<input id="bucket-evict" class="search" style="width:100%;max-width:none" type="number" min="0" value="0"></label>' +
        '<button class="btn primary" id="bucket-create">Create bucket</button></div>' +
        '<datalist id="bucket-remotes"></datalist><div id="bucket-warning" class="sub" style="margin-top:12px"></div></div>' +
        '<div class="card" id="bucket-list"><div class="empty"><b>Loading buckets…</b>Reading the object store.</div></div>';
    }

    function loadBuckets() {
      var list = document.getElementById('bucket-list');
      var remotes = document.getElementById('bucket-remotes');
      if (!list) return Promise.resolve();
      if (remotes) {
        apiJSON('/storage/remotes').then(function (data) {
          remotes.innerHTML = (data.remotes || []).map(function (name) {
            return '<option value="' + esc(name) + ':"></option>';
          }).join('');
        }).catch(function () {});
      }
      return apiJSON('/buckets').then(function (data) {
        var rows = data.buckets || [];
        list.innerHTML = '<h3>Buckets</h3>' + (rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (b) {
          var tier = String(b.tier || 'LOCAL').toLowerCase();
          var cloudTier = tier === 'cloud' || tier === 'tiered';
          var last = b.lastSyncAt ? ' · last sync ' + esc(b.lastSyncAt) : '';
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(b.name) + '</b><span class="tag">' + esc(tier) + '</span><div class="sub">' + (cloudTier ? esc(b.cloudTarget) + ' · ' : '') + nObjects(b.localObjects) + ' local' + (cloudTier ? ' · ' + nObjects(b.cloudObjects) + ' in the cloud' + (b.evictAfterDays ? ' · evict after ' + b.evictAfterDays + ' days' : '') : '') + last + '</div>' +
            (b.syncError ? '<div class="sub" style="color:var(--onyx-danger)">' + esc(b.syncError) + '</div>' : '') + '</div>' +
            '<div>' + (cloudTier ? '<button class="btn" data-bucket-sync="' + esc(b.name) + '">Sync</button> <button class="btn" data-bucket-evict="' + esc(b.name) + '">Sync &amp; evict</button> ' : '') + '<button class="btn" data-bucket-delete="' + esc(b.name) + '">Delete</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No buckets</b>Create one above. Anything S3-compatible can then use the endpoint with the storage access key.</div>');

        Array.prototype.forEach.call(list.querySelectorAll('[data-bucket-sync]'), function (button) {
          button.addEventListener('click', function () { syncBucket(button.dataset.bucketSync, false, button); });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-bucket-evict]'), function (button) {
          button.addEventListener('click', function () {
            if (!window.confirm('Sync ' + button.dataset.bucketEvict + ' and release local copies the cloud has verified? Local reads will refetch from the cloud afterwards.')) return;
            syncBucket(button.dataset.bucketEvict, true, button);
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-bucket-delete]'), function (button) {
          button.addEventListener('click', function () {
            var name = button.dataset.bucketDelete;
            if (!window.confirm('Delete bucket ' + name + ' and everything in it (including its cloud target)? This cannot be undone.')) return;
            button.disabled = true;
            apiJSON('/buckets/' + encodeURIComponent(name) + '?force=true', { method: 'DELETE' })
              .then(function () { return loadBuckets(); })
              .catch(function (err) { button.disabled = false; showError(err); });
          });
        });
      }).catch(function (err) {
        list.innerHTML = '<h3>Buckets</h3><div class="empty"><b>onyx-objectstore is unavailable</b>' + esc(err && err.error && err.error.message ? err.error.message : 'The object store did not answer.') + '</div>';
      });
    }

    // nObjects renders an object count without pretending an unknown one is
    // zero: before a bucket has been synced its cloud count is genuinely
    // unknown, not empty.
    function nObjects(count) {
      var n = Number(count || 0);
      return n + (n === 1 ? ' object' : ' objects');
    }

    function syncBucket(name, evict, button) {
      button.disabled = true; button.textContent = evict ? 'Syncing & evicting…' : 'Syncing…';
      var stamp = document.getElementById('bucket-warning');
      if (stamp) stamp.textContent = 'Syncing ' + name + '…';
      apiJSON('/buckets/' + encodeURIComponent(name) + '/sync?evict=' + (evict ? 'true' : 'false'), { method: 'POST' })
        .then(function (result) {
          if (stamp) {
            var warnings = (result.warnings || []).join(' ');
            stamp.textContent = 'Synced ' + name + ': ' + result.uploaded + ' uploaded, ' + result.evicted + ' evicted.' + (warnings ? ' ' + warnings : '');
          }
          return loadBuckets();
        })
        .catch(function (err) { button.disabled = false; button.textContent = evict ? 'Sync & evict' : 'Sync'; showError(err); });
    }

    function refreshObjects() {
      var button = document.getElementById('objects-refresh');
      if (button) { button.disabled = true; button.textContent = 'Refreshing…'; }
      return loadBuckets().catch(function () {}).then(function () {
        if (button) { button.disabled = false; button.textContent = 'Refresh'; }
      });
    }

    function viewShares() {
      return '<div class="page-head"><div><h1>Shares</h1><p>Pick a storage folder, choose protocols, and publish it safely.</p></div></div>' +
        '<div class="card" style="margin-bottom:16px"><h3>Create a share</h3>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end">' +
        '<label>Name<input id="share-name" class="search" style="width:100%;max-width:none" placeholder="media" autocomplete="off"></label>' +
        '<label>Storage folder<div id="share-browser" class="search" style="width:100%;max-width:none;min-height:38px">Loading folders…</div><input type="hidden" id="share-path"></label>' +
        '<label>Comment<input id="share-comment" class="search" style="width:100%;max-width:none" placeholder="Family media" autocomplete="off"></label>' +
        '</div>' +
        '<div style="display:flex;gap:16px;align-items:center;margin-top:16px;flex-wrap:wrap">' +
        '<label><input type="checkbox" id="share-smb" checked> SMB</label>' +
        '<label><input type="checkbox" id="share-nfs" checked> NFS</label>' +
        // Every extra protocol is off until the operator opts in (docs/design/05#6).
        '<label><input type="checkbox" id="share-ftp"> FTP</label>' +
        '<label><input type="checkbox" id="share-sftp"> SFTP</label>' +
        '<label><input type="checkbox" id="share-webdav"> WebDAV</label>' +
        '<label><input type="checkbox" id="share-rsync"> Rsync</label>' +
        '<label><input type="checkbox" id="share-readonly"> Read-only</label>' +
        '<button class="btn primary" id="share-create">Create share</button>' +
        '</div><p class="sub" style="margin-bottom:0">Only folders under the mounted Onyx storage root can be shared. No disk formatting is performed here.</p></div>' +
        // Cloud/remote storage (docs/design/05#6): configure a provider once,
        // then clone a storage folder to it or use it as a backup target. The
        // remote catalog is the shared rclone config the API writes and
        // backupd reads. It sits directly under the create-share form because

    // copyText writes a connection string to the clipboard, falling back to a
    // selectable prompt on browsers without the async clipboard API (or on a
    // non-HTTPS origin, where it is unavailable).
    function copyText(text, button) {
      function done() {
        if (!button) return;
        var previous = button.textContent;
        button.textContent = 'Copied';
        setTimeout(function () { button.textContent = previous; }, 1200);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { window.prompt('Copy this connection string', text); });
        return;
      }
      window.prompt('Copy this connection string', text);
    }

    // shareConnections renders the client-side address for every protocol a
    // share is published over, using the address the browser reached Onyx on.
    function shareConnections(share) {
      var host = location.hostname || 'localhost';
      var protocols = (share.protocols || []).map(function (p) {
        return String(p).replace(/^SHARE_PROTOCOL_/, '').toLowerCase();
      });
      var lines = [];
      if (protocols.indexOf('smb') >= 0) {
        lines.push(['SMB (Windows)', '\\\\' + host + '\\' + share.name]);
        lines.push(['SMB (macOS / Linux)', 'smb://' + host + '/' + share.name]);
      }
      if (protocols.indexOf('nfs') >= 0) lines.push(['NFS', host + ':' + share.path]);
      if (protocols.indexOf('ftp') >= 0) lines.push(['FTP', 'ftp://' + host + '/']);
      // The SFTP instance chroots one Onyx user per share (onyx-<share>).
      if (protocols.indexOf('sftp') >= 0) lines.push(['SFTP', 'sftp://onyx-' + share.name + '@' + host + ':2222/']);
      if (protocols.indexOf('webdav') >= 0) lines.push(['WebDAV', 'https://' + host + '/webdav/' + share.name]);
      if (protocols.indexOf('rsync') >= 0) lines.push(['Rsync', 'rsync://' + host + '/' + share.name]);
      return lines;
    }

    // loadRemoteProviders fills the provider picker and swaps the credential
    // fields when the selection changes. Field names are rclone's own option
    // names, so they are passed straight through to the target config.
    function loadRemoteProviders() {
      var select = document.getElementById('remote-provider');
      if (!select) return;
      apiJSON('/storage/providers').then(function (data) {
        var providers = data.providers || [];
        select.innerHTML = '<option value="">Choose a provider…</option>' + providers.map(function (p) {
          return '<option value="' + esc(p.type) + '">' + esc(p.label) + (p.oauth ? ' (OAuth)' : '') + '</option>';
        }).join('');
        select.addEventListener('change', function () { renderRemoteFields(providers); });
      }).catch(function () { select.innerHTML = '<option value="">Providers unavailable</option>'; });
    }

    function renderRemoteFields(providers) {
      var select = document.getElementById('remote-provider');
      var fields = document.getElementById('remote-fields');
      var hint = document.getElementById('remote-hint');
      if (!select || !fields) return;
      var provider = (providers || []).filter(function (p) { return p.type === select.value; })[0];
      if (!provider) {
        fields.innerHTML = '';
        if (hint) hint.textContent = '';
        return;
      }
      var required = provider.required || [];
      fields.innerHTML = (provider.fields || []).map(function (field) {
        var label = field.replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
        if (required.indexOf(field) >= 0) label += ' *';
        var secret = /pass|secret|key$/.test(field);
        return '<label>' + esc(label) + '<input class="search" data-remote-field="' + esc(field) + '" style="width:100%;max-width:none"' + (secret ? ' type="password"' : '') + ' autocomplete="off"></label>';
      }).join('');
      if (hint) hint.textContent = provider.oauth
        ? 'Saved with no credentials: ' + (provider.hint || 'approve access in a browser afterwards.')
        : (provider.hint || '');
    }

        }).join('') + '</div>' : '<div class="empty"><b>No shares yet</b>Create a share to expose a dataset over SMB or NFS.</div>';
        Array.prototype.forEach.call(list.querySelectorAll('[data-share-delete]'), function (button) { button.addEventListener('click', function () { if (!confirm('Remove this share? Files will remain unchanged.')) return; apiJSON('/shares/' + encodeURIComponent(button.dataset.shareDelete), { method: 'DELETE' }).then(loadShares).catch(showError); }); });
