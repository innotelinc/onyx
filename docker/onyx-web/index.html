<!doctype html>
<html lang="en" data-scheme="operations">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ONYX — Online Storage System</title>
  <meta name="description" content="ONYX — the self-hosted storage and infrastructure console. Pools, files, snapshots, backups, apps, virtual machines, objects and shares.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23100c22'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='none' stroke='%239b83ff' stroke-width='2'/%3E%3C/svg%3E">
  <!-- Unity: the shared family theme. The palette and the switch are served as
       byte-identical copies of the canonical theme beside this page. The stored
       mode is applied before the first paint, so a dark screen never flashes
       white while the stylesheet arrives. ONYX wears the operations scheme. -->
  <script>
    (function () {
      var root = document.documentElement;
      root.setAttribute('data-scheme', 'operations');
      try {
        var mode = localStorage.getItem('ontrak.mode');
        if (mode === 'light' || mode === 'dark') root.setAttribute('data-mode', mode);
      } catch (error) { /* a blocked origin still gets a working default */ }
    })();
  </script>
  <link rel="stylesheet" href="/unity-theme.css">
  <script>window.UNITY_DEFAULT_SCHEME = 'operations';</script>
  <script src="/unity-theme.js"></script>
  <style>
    /* ── the shell ──────────────────────────────────────────────────────────
       One canvas, one rail, one workspace. The left rail is the only navigation
       and the only collapse control: it folds to icons (or the button in the
       rail, or Ctrl/Cmd+B). The old right-hand activity rail is gone — activity
       belongs on the overview, where it can be read in context. */
    :root {
      --rail-w: 252px;
      --topbar-h: 64px;
      --app-gap: 14px;
      /* Aliases for the feature views written before Unity. They keep the old
         inline styles reading the shared palette instead of a private one. */
      --onyx-border: var(--line);
      --onyx-text: var(--ink);
      --onyx-text-secondary: var(--ink-soft);
      --onyx-text-muted: var(--ink-faint);
      --onyx-surface: var(--surface);
      --onyx-surface-hover: var(--surface-muted);
      --onyx-accent: var(--brand);
      --onyx-success: var(--ok);
      --onyx-warning: var(--attention);
      --onyx-danger: var(--bad);
      --onyx-info: var(--info);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font: 14px/1.55 var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(1100px 720px at 8% -14%, color-mix(in srgb, var(--brand) 15%, transparent), transparent 66%),
        radial-gradient(900px 640px at 106% 110%, color-mix(in srgb, var(--tone-unity) 11%, transparent), transparent 70%),
        var(--canvas);
    }
    body.no-scroll { overflow: hidden; }
    h1, h2, h3, h4 { margin: 0; letter-spacing: -0.015em; }
    p { margin: 0; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, .mono { font-family: var(--mono); font-size: 12px; }
    .sub { color: var(--ink-soft); font-size: 12px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    .skip-link {
      position: fixed; left: 12px; top: -60px; z-index: 100;
      background: var(--brand); color: var(--brand-ink);
      padding: 8px 12px; border-radius: var(--radius-sm);
    }
    .skip-link:focus { top: 12px; }

    /* A pane is light rather than paint: the shared liquid-glass tokens give it
       a translucent tint, a hairline rim and a soft shadow. */
    .glass {
      background: var(--glass-tint);
      border: 1px solid var(--glass-line);
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    }

    .app {
      display: grid;
      grid-template-columns: var(--rail-w) minmax(0, 1fr);
      gap: var(--app-gap);
      padding: var(--app-gap);
      min-height: 100vh;
      transition: grid-template-columns 170ms var(--ease, ease);
    }
    .app.rail-collapsed { --rail-w: 76px; }
    .scrim { display: none; }

    /* ── the rail ─────────────────────────────────────────────────────────── */
    .rail {
      position: sticky; top: var(--app-gap); align-self: start;
      height: calc(100vh - var(--app-gap) * 2);
      display: flex; flex-direction: column; gap: 6px;
      padding: 10px;
      border-radius: var(--radius-lg);
      overflow: hidden auto;
      z-index: 30;
    }
    .rail__brand {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 8px 14px; min-width: 0; color: var(--ink);
    }
    .rail__mark {
      width: 34px; height: 34px; flex: none;
      display: grid; place-items: center;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--brand), color-mix(in srgb, var(--brand) 45%, var(--tone-unity)));
      color: var(--brand-ink);
      font-weight: 750; font-size: 15px; letter-spacing: .04em;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 8%, transparent), 0 10px 24px -12px color-mix(in srgb, var(--brand) 70%, transparent);
    }
    .rail__brandtext { min-width: 0; }
    .rail__brandtext strong { display: block; font-size: 15px; font-weight: 720; letter-spacing: .01em; }
    .rail__brandtext span {
      display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--ink-faint); white-space: nowrap;
    }
    .rail__group {
      padding: 9px 10px 4px; font-size: 10px; font-weight: 650;
      letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint);
      white-space: nowrap;
    }
    .rail__nav { display: flex; flex-direction: column; gap: 2px; }
    .rail__item {
      position: relative; display: flex; align-items: center; gap: 11px;
      width: 100%; padding: 8px 10px;
      border: 1px solid transparent; border-radius: var(--radius-sm);
      background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 13.5px; font-weight: 540;
      text-align: left; cursor: pointer; white-space: nowrap;
      text-decoration: none;
    }
    .rail__item:hover { background: color-mix(in srgb, var(--surface) 62%, transparent); color: var(--ink); text-decoration: none; }
    .rail__item[aria-current="page"] {
      background: var(--brand-soft);
      border-color: color-mix(in srgb, var(--brand) 30%, transparent);
      color: var(--ink);
    }
    .rail__item[aria-current="page"] .rail__icon { color: var(--brand); }
    .rail__icon { width: 18px; height: 18px; flex: none; display: grid; place-items: center; color: var(--ink-faint); }
    .rail__icon svg { width: 18px; height: 18px; }
    .rail__label { overflow: hidden; text-overflow: ellipsis; }
    .rail__foot {
      margin-top: auto; padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 8px;
    }
    .rail__who { display: flex; align-items: center; gap: 9px; padding: 5px 8px; min-width: 0; }
    .rail__who-text { min-width: 0; }
    .rail__who-text b { display: block; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rail__who-text span { display: block; font-size: 10.5px; color: var(--ink-faint); }
    .rail__toggle {
      display: flex; align-items: center; gap: 9px;
      width: 100%; padding: 7px 9px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: transparent; color: var(--ink-faint);
      font: inherit; font-size: 12px; cursor: pointer;
    }
    .rail__toggle:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface-muted); }
    .rail__toggle svg { width: 16px; height: 16px; flex: none; }
    .app.rail-collapsed .rail__brand { justify-content: center; padding-inline: 0; }
    .app.rail-collapsed .rail__brandtext,
    .app.rail-collapsed .rail__group,
    .app.rail-collapsed .rail__label,
    .app.rail-collapsed .rail__who-text,
    .app.rail-collapsed .rail__toggle span { display: none; }
    .app.rail-collapsed .rail__item,
    .app.rail-collapsed .rail__toggle,
    .app.rail-collapsed .rail__who { justify-content: center; padding-inline: 0; }

    .avatar {
      width: 32px; height: 32px; flex: none; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--brand-soft); color: var(--brand);
      border: 1px solid color-mix(in srgb, var(--brand) 26%, transparent);
      font-size: 11px; font-weight: 700; letter-spacing: .03em;
    }

    /* ── workspace + masthead ─────────────────────────────────────────────── */
    .workspace { min-width: 0; display: flex; flex-direction: column; gap: var(--app-gap); }
    .topbar {
      position: sticky; top: var(--app-gap); z-index: 20;
      display: flex; align-items: center; gap: 12px;
      min-height: var(--topbar-h); padding: 9px 12px 9px 16px;
      border-radius: var(--radius-lg);
    }
    .topbar__title { min-width: 0; }
    .topbar__title h1 { font-size: 17px; font-weight: 700; line-height: 1.2; }
    .topbar__title p {
      margin-top: 2px; font-size: 11.5px; color: var(--ink-soft);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw;
    }
    .topbar__tools { margin-left: auto; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .command-trigger {
      display: flex; align-items: center; gap: 8px;
      width: clamp(190px, 24vw, 330px); height: 36px; padding: 0 10px;
      border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
      background: var(--surface-sunken); color: var(--ink-faint);
      font: inherit; font-size: 12.5px; cursor: text;
    }
    .command-trigger:hover { border-color: var(--brand); color: var(--ink-soft); }
    .command-trigger svg { width: 15px; height: 15px; flex: none; }
    .command-trigger span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .icon-btn {
      width: 36px; height: 36px; flex: none;
      display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: transparent; color: var(--ink-soft); cursor: pointer;
    }
    .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface-muted); }
    .icon-btn svg { width: 18px; height: 18px; }
    .menu-toggle { display: none; }
    kbd {
      font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px;
      border: 1px solid var(--line-strong); color: var(--ink-faint); background: var(--surface-muted);
      white-space: nowrap;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 7px;
      height: 36px; padding: 0 11px; border-radius: var(--radius-pill);
      border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-soft); font-size: 11.5px; white-space: nowrap;
    }
    .status-pill:hover { border-color: var(--line-strong); }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--unknown); }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
    .dot.warn { background: var(--attention); box-shadow: 0 0 0 3px var(--attention-soft); }
    .dot.err { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }

    main.content { min-width: 0; display: block; padding-bottom: 10px; }
    main.content:focus { outline: none; }

    /* ── page heads, panels, grids ────────────────────────────────────────── */
    .page-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 14px; flex-wrap: wrap; margin: 2px 2px 16px;
    }
    /* The page title lives in the masthead, so a view repeats only its lede and
       its actions. One heading per screen, not two. */
    .page-head p { color: var(--ink-soft); font-size: 12.8px; max-width: 74ch; }
    .page-head > div:first-child { min-width: 0; }
    .page-head > div:last-child { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; gap: var(--app-gap); grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
    .card {
      padding: 16px;
      border-radius: var(--radius-lg);
      background: var(--glass-tint);
      border: 1px solid var(--glass-line);
      box-shadow: var(--shadow-card);
      min-width: 0;
    }
    .card > h3 { margin: 0 0 10px; font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); }
    .card > h3 + .sub { margin-top: -4px; }
    .card h4 { font-size: 13.5px; }
    .card .stat { font-size: 27px; font-weight: 720; font-variant-numeric: tabular-nums; letter-spacing: -0.025em; line-height: 1.18; }
    .card .stat.sm { font-size: 18px; }
    .card .sub { margin-top: 3px; }
    .card.reserved { border-style: dashed; background: transparent; box-shadow: none; }
    .empty {
      border: 1px dashed var(--line-strong); border-radius: var(--radius);
      padding: 28px 18px; text-align: center; color: var(--ink-faint); font-size: 12.8px;
    }
    .empty b { display: block; color: var(--ink); margin-bottom: 5px; font-size: 13.5px; }

    /* ── forms ────────────────────────────────────────────────────────────── */
    .search {
      background: var(--surface-sunken);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      color: var(--ink); padding: 8px 10px;
      font: inherit; font-size: 13px;
    }
    input.search, select.search, textarea.search { height: 38px; max-width: 100%; }
    textarea.search { height: auto; }
    div.search { padding: 10px; }
    .search::placeholder { color: var(--ink-faint); }
    .search:focus { outline: 2px solid var(--brand-ring); outline-offset: 1px; border-color: var(--brand); }
    .grid > label {
      display: flex; flex-direction: column; gap: 5px;
      font-size: 11.5px; color: var(--ink-soft); min-width: 0;
    }
    .grid > label[style*="align-items:center"] { flex-direction: row; font-size: 12.5px; }
    label > input[type="checkbox"] { accent-color: var(--brand); width: 15px; height: 15px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 34px; padding: 0 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong);
      background: var(--surface); color: var(--ink);
      font: inherit; font-size: 12.5px; font-weight: 540;
      cursor: pointer; white-space: nowrap; text-decoration: none;
    }
    .btn:hover { background: var(--surface-muted); border-color: var(--brand); text-decoration: none; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 620; }
    .btn.primary:hover { filter: brightness(1.06); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn:focus-visible, .icon-btn:focus-visible, .rail__item:focus-visible, .rail__toggle:focus-visible, .command-trigger:focus-visible {
      outline: 2px solid var(--brand-ring); outline-offset: 2px;
    }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
      padding: 2px 8px; border-radius: var(--radius-pill);
      background: var(--brand-soft); color: var(--brand);
      border: 1px solid color-mix(in srgb, var(--brand) 22%, transparent);
      white-space: nowrap;
    }
    .badge {
      display: inline-flex; min-width: 22px; justify-content: center;
      padding: 1px 7px; border-radius: var(--radius-pill);
      background: var(--surface-muted); color: var(--ink-soft);
      font-size: 11px; font-variant-numeric: tabular-nums;
    }

    /* Feature rows (the views predate the shell and share this vocabulary). */
    .event { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .event > div { min-width: 0; }
    .event b { font-weight: 620; overflow-wrap: anywhere; }
    .event .sub { overflow-wrap: anywhere; }

    /* ── overview ─────────────────────────────────────────────────────────── */
    .overview-top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--app-gap); margin-bottom: var(--app-gap); }
    .capacity-panel { display: flex; gap: 22px; align-items: center; padding: 20px; }
    .capacity-ring {
      --used: 0;
      width: 132px; height: 132px; flex: none; border-radius: 50%;
      background: conic-gradient(var(--brand) calc(var(--used) * 1%), color-mix(in srgb, var(--line) 70%, transparent) 0);
      display: grid; place-items: center; position: relative;
    }
    .capacity-ring::after {
      content: ""; position: absolute; inset: 11px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--line);
    }
    .capacity-ring__text { position: relative; z-index: 1; text-align: center; }
    .capacity-ring__text b { display: block; font-size: 24px; font-weight: 720; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .capacity-ring__text span { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
    .capacity-copy { min-width: 0; flex: 1; }
    .capacity-copy h2 { font-size: 17px; }
    .capacity-copy .sub { font-size: 12.3px; }
    .capacity-facts { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; }
    .capacity-facts div { min-width: 82px; }
    .capacity-facts span { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
    .capacity-facts b { display: block; margin-top: 2px; font-size: 15px; font-variant-numeric: tabular-nums; }
    .health-panel { padding: 18px; }
    .health-panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); margin-bottom: 12px; }
    .health-list { display: flex; flex-direction: column; gap: 6px; max-height: 174px; overflow: auto; }
    .health-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .health-row span:last-child { margin-left: auto; color: var(--ink-faint); font-size: 10.5px; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--app-gap); margin-bottom: var(--app-gap); }
    .kpi {
      padding: 14px 16px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card);
    }
    .kpi__label { display: block; font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
    .kpi strong { display: block; margin-top: 5px; font-size: 24px; font-weight: 720; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
    .kpi__hint { display: block; margin-top: 2px; font-size: 11.5px; color: var(--ink-faint); }
    .kpi--brand strong { color: var(--brand); }
    .overview-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--app-gap); margin-bottom: var(--app-gap); }
    .attention-list, .activity-list { display: flex; flex-direction: column; gap: 7px; }
    .attention {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface-muted); color: var(--ink); text-align: left;
      font: inherit; cursor: pointer; text-decoration: none;
    }
    .attention:hover { border-color: var(--line-strong); text-decoration: none; }
    .attention__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--unknown); }
    .attention--bad .attention__dot { background: var(--bad); }
    .attention--attention .attention__dot { background: var(--attention); }
    .attention--info .attention__dot { background: var(--info); }
    .attention b { display: block; font-size: 12.5px; font-weight: 600; }
    .attention small { display: block; color: var(--ink-faint); font-size: 11.3px; }
    .attention__go { margin-left: auto; color: var(--brand); font-size: 11.5px; white-space: nowrap; }
    .activity-row { display: flex; gap: 9px; align-items: flex-start; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 12.3px; }
    .activity-row:last-child { border-bottom: 0; }
    .activity-row time { margin-left: auto; color: var(--ink-faint); font-size: 10.5px; white-space: nowrap; }
    .pool-strip { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .pool-strip:last-child { border-bottom: 0; }
    .pool-strip .grow { flex: 1; min-width: 0; }
    .pool-strip b { display: block; font-size: 12.8px; }
    .pool-strip small { display: block; color: var(--ink-faint); font-size: 11.3px; }
    .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick-actions .btn { height: 36px; }

    /* ── palette ──────────────────────────────────────────────────────────── */
    .palette {
      position: fixed; inset: 0; z-index: 80; display: none;
      justify-content: center; align-items: flex-start;
      padding: 12vh 16px 16px;
      background: color-mix(in srgb, var(--canvas) 58%, transparent);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    }
    .palette[data-open="true"] { display: flex; }
    .palette .sheet {
      width: min(620px, 100%); max-height: 64vh; display: flex; flex-direction: column;
      border-radius: var(--radius-lg); overflow: hidden;
      background: var(--glass-tint-strong);
      border: 1px solid var(--line-strong);
      box-shadow: var(--glass-shadow-pop);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    }
    .palette .sheet input {
      width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink);
      padding: 14px 16px; border-bottom: 1px solid var(--line); font: inherit; font-size: 15px;
    }
    .palette ul { list-style: none; margin: 0; padding: 8px; overflow-y: auto; }
    .palette li {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 11px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid transparent; font-size: 13px;
    }
    .palette li[data-active="true"], .palette li:hover { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 26%, transparent); }
    .palette li .hint { color: var(--ink-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
    .palette .foot { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: 10.8px; display: flex; gap: 14px; flex-wrap: wrap; }

    /* ── toast ────────────────────────────────────────────────────────────── */
    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 90;
      max-width: min(420px, calc(100vw - 40px));
      padding: 11px 14px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--ok); color: var(--ink);
      box-shadow: var(--shadow-pop); font-size: 12.8px;
      display: none;
    }
    .toast[data-show="true"] { display: block; }
    .toast.bad { border-color: var(--bad); }
    .toast.warn { border-color: var(--attention); }

    /* ── responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 1180px) {
      .overview-top, .overview-pair { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .app, .app.rail-collapsed { grid-template-columns: minmax(0, 1fr); }
      .rail {
        position: fixed; left: var(--app-gap); top: var(--app-gap); bottom: var(--app-gap);
        width: 268px; height: auto;
        transform: translateX(calc(-100% - var(--app-gap) * 2));
        transition: transform 180ms ease; box-shadow: var(--shadow-pop);
      }
      .app:not(.rail-collapsed) .rail { transform: none; }
      .app.rail-collapsed .rail__brandtext,
      .app.rail-collapsed .rail__group,
      .app.rail-collapsed .rail__label,
      .app.rail-collapsed .rail__who-text,
      .app.rail-collapsed .rail__toggle span { display: block; }
      .app.rail-collapsed .rail__item,
      .app.rail-collapsed .rail__toggle,
      .app.rail-collapsed .rail__brand,
      .app.rail-collapsed .rail__who { justify-content: flex-start; padding-inline: 8px; }
      .scrim {
        display: none; position: fixed; inset: 0; z-index: 25;
        background: color-mix(in srgb, var(--canvas) 62%, transparent);
        -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
      }
      .app:not(.rail-collapsed) .scrim { display: block; }
      .menu-toggle { display: grid; }
      .topbar { flex-wrap: wrap; }
      .topbar__title p { display: none; }
      .command-trigger { width: 180px; }
      .app { padding: 8px; }
      .rail { left: 8px; top: 8px; bottom: 8px; }
    }
    @media (max-width: 680px) {
      .topbar { gap: 8px; padding: 8px; }
      .topbar__title { order: 2; flex: 1 1 100%; padding: 0 2px 2px; }
      .topbar__title h1 { font-size: 15.5px; }
      .topbar__tools { margin-left: 0; flex: 1; }
      .command-trigger { flex: 1; width: auto; }
      .command-trigger kbd { display: none; }
      .command-trigger span { text-align: left; }
      .status-pill span:last-child { display: none; }
      .status-pill { width: 36px; padding: 0; justify-content: center; }
      .kpis { grid-template-columns: 1fr 1fr; }
      .capacity-panel { flex-direction: column; align-items: flex-start; }
      .capacity-ring { width: 112px; height: 112px; }
      .page-head > div:last-child { width: 100%; }
      .card { padding: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
  </style>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<div class="app" id="app">
  <aside class="rail glass" id="sidebar" aria-label="Primary navigation">
    <div class="rail__brand">
      <span class="rail__mark" aria-hidden="true">O</span>
      <span class="rail__brandtext"><strong>ONYX</strong><span>Storage platform</span></span>
    </div>
    <nav class="rail__nav" id="nav" aria-label="Sections"></nav>
    <div class="rail__foot">
      <button class="rail__toggle" id="rail-toggle" type="button" aria-controls="sidebar" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
        <span>Collapse rail</span>
      </button>
      <div class="rail__who">
        <span class="avatar" aria-hidden="true">ON</span>
        <span class="rail__who-text"><b>Operator</b><span>Cerulean identity</span></span>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="workspace">
    <header class="topbar glass">
      <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="topbar__title">
        <h1 id="page-title">Overview</h1>
        <p id="page-sub">Health, capacity and what needs attention.</p>
      </div>
      <div class="topbar__tools">
        <button class="command-trigger" id="command-trigger" type="button" aria-label="Search files or run a command">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
          <span>Search or jump to…</span>
          <kbd>⌘K</kbd>
        </button>
        <span class="status-pill" id="status" title="System status">
          <span class="dot" id="status-dot"></span><span id="status-text">Checking…</span>
        </span>
        <button class="icon-btn" id="theme" type="button" title="Theme: system" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <span class="avatar" title="Signed in via Cerulean Authentik" aria-label="Signed in via Cerulean Authentik">ON</span>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<div class="palette" id="palette" data-open="false" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="sheet">
    <input id="palette-input" placeholder="Search files, pages and actions…" autocomplete="off" spellcheck="false" aria-label="Search commands">
    <ul id="palette-list" role="listbox" aria-label="Commands"></ul>
    <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  (function () {
    'use strict';


    var I = function (d, extra) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '>' + d + '</svg>';
    };
    var ICONS = {
      overview: I('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
      files: I('<path d="M4 4h5l2 2h9v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>'),
      search: I('<circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/>'),
      storage: I('<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
      snapshots: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      backups: I('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>'),
      apps: I('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
      vms: I('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),
      objects: I('<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>'),
      shares: I('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/>'),
      users: I('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'),
      audit: I('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>'),
      advisor: I('<path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/>'),
      settings: I('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'),
      scrub: I('<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="4"/>'),
      arrow: I('<path d="M5 12h14M13 6l6 6-6 6"/>'),
      plus: I('<path d="M12 5v14M5 12h14"/>')
    };

    /* One place that defines the surfaces. Overview is the landing page: what is
     * healthy, what is full, and what needs a decision. Scrub is no longer a
     * top-level destination of its own — it is a storage maintenance action, and
     * lives on the Storage page where the pool it applies to is chosen. */
    var VIEWS = [
      { id: 'overview',  label: 'Overview',  icon: ICONS.overview, section: 'Workspace', sub: 'Health, capacity and what needs attention.' },
      { id: 'files',     label: 'Files',     icon: ICONS.files,    section: 'Workspace', sub: 'Browse, import and protect what is on the pool.' },
      { id: 'search',    label: 'Search',    icon: ICONS.search,   section: 'Workspace', sub: 'Find a file by name, size, kind or age across the pool.' },
      { id: 'storage',   label: 'Storage',   icon: ICONS.storage,  section: 'Storage',   sub: 'Pools, devices and scrub maintenance.' },
      { id: 'snapshots', label: 'Snapshots', icon: ICONS.snapshots, section: 'Storage',  sub: 'Point-in-time copies with a safe rollback.' },
      { id: 'backups',   label: 'Backups',   icon: ICONS.backups,  section: 'Storage',   sub: 'Jobs, recovery health and restore points.' },
      { id: 'apps',      label: 'Apps',      icon: ICONS.apps,     section: 'Platform',  sub: 'The app store and the containers it runs.' },
      { id: 'vms',       label: 'Virtual machines', icon: ICONS.vms, section: 'Platform', sub: 'KVM machines whose disks live on the pool.' },
      { id: 'objects',   label: 'Objects',   icon: ICONS.objects,  section: 'Platform',  sub: 'S3 buckets: local, cloud-primary or tiered.' },
      { id: 'shares',    label: 'Shares',    icon: ICONS.shares,   section: 'Platform',  sub: 'Publish a folder over SMB, NFS, FTP, SFTP, WebDAV or rsync.' },
      { id: 'users',     label: 'Users',     icon: ICONS.users,    section: 'Platform',  sub: 'Authentik identities mirrored with an ONYX role.' },
      { id: 'audit',     label: 'Audit',     icon: ICONS.audit,    section: 'Platform',  sub: 'Grants, revocations and refusals in the access trail.' },
      { id: 'advisor',   label: 'Advisor',   icon: ICONS.advisor,  section: 'Platform',  sub: 'What the AI advisor makes of pool health and backup reliability.' },
      { id: 'settings',  label: 'Settings',  icon: ICONS.settings, section: 'Platform',  sub: 'Identity, cloud accounts and appearance.' }
    ];

    var API = window.ONYX_API_BASE || (function () {
      var host = window.location.hostname;
      if (host === 'onyx.innotel.us') return 'https://api.onyx.innotel.us/api/v1';
      return '/api/v1';
    })();

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* A toast is for the answer to an action ("Saved", "Copy failed"); a page
     * that could not load gets an inline notice where the missing content would
     * have been. Both exist because one is transient and the other is not. */
    var toastTimer = 0;
    function toast(message, kind) {
      var box = document.getElementById('toast');
      if (!box) return;
      box.textContent = message;
      box.className = 'toast' + (kind ? ' ' + kind : '');
      box.dataset.show = 'true';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { box.dataset.show = 'false'; }, kind === 'bad' ? 8000 : 3800);
    }

    function viewDashboard() {
      return '<div class="page-head"><div><p>One screen for the state of the box: capacity, services, pools, and the things that will need you soon.</p></div>' +
        '<div><span class="sub" id="dashboard-updated">Loading…</span><button class="btn" id="dashboard-refresh">Refresh</button><button class="btn primary" id="overview-browse">Browse files</button></div></div>' +
        '<section class="capacity-panel card">' +
          '<div class="capacity-ring" id="overview-capacity-ring" style="--used:0" role="img" aria-label="Storage capacity"><div class="capacity-ring__text"><b id="overview-capacity-pct">—</b><span>used</span></div></div>' +
          '<div class="capacity-copy"><h2 id="overview-capacity-title">Storage capacity</h2><p class="sub" id="stat-capacity-sub">Reading the mounted pool…</p>' +
            '<div class="capacity-facts">' +
              '<div><span>Used</span><b id="stat-capacity">—</b></div>' +
              '<div><span>Free</span><b id="overview-free">—</b></div>' +
              '<div><span>Pools</span><b id="stat-pools">—</b></div>' +
              '<div><span>Services</span><b id="stat-health">—</b></div>' +
            '</div>' +
            '<div class="quick-actions" style="margin-top:16px">' +
              '<a class="btn" href="#/files">Files</a><a class="btn" href="#/snapshots">New snapshot</a><a class="btn" href="#/shares">Shares</a><a class="btn" href="#/audit">Audit trail</a>' +
            '</div>' +
          '</div>' +
        '</section>' +
        '<div class="kpis">' +
          '<div class="kpi"><span class="kpi__label">Pools online</span><strong id="stat-pools-kpi">—</strong><span class="kpi__hint" id="stat-pools-sub">storage pools</span></div>' +
          '<div class="kpi"><span class="kpi__label">Mounted capacity</span><strong id="stat-capacity-kpi">—</strong><span class="kpi__hint">across visible pools</span></div>' +
          '<div class="kpi"><span class="kpi__label">Service health</span><strong id="stat-health-kpi">—</strong><span class="kpi__hint">daemons reporting</span></div>' +
          '<div class="kpi kpi--brand"><span class="kpi__label">Platform</span><strong id="stat-version">—</strong><span class="kpi__hint">ONYX release</span></div>' +
        '</div>' +
        '<div class="overview-pair">' +
          '<section class="card"><h3>Needs attention</h3><div class="attention-list" id="overview-attention"><div class="sub">Checking pools, services and storage notices…</div></div></section>' +
          '<section class="card"><h3>Recent access activity</h3><div class="activity-list" id="overview-activity"><div class="sub">Reading the access trail…</div></div></section>' +
        '</div>' +
        '<section class="card"><h3>Pools</h3><div id="overview-pools"><div class="sub">Reading mounted pools…</div></div></section>' +
        '<section class="card" style="margin-top:14px"><h3>Service detail</h3><div class="health-list" id="overview-services"><div class="sub">Asking every daemon…</div></div><div class="sub" id="overview-version" style="margin-top:10px"></div></section>';
    }

    function renderNav(active) {
      var html = '';
      var seen = '';
      VIEWS.forEach(function (v) {
        if (v.section !== seen) {
          seen = v.section;
          html += '<div class="rail__group">' + esc(v.section) + '</div>';
        }
        html += '<a class="rail__item" href="#/' + v.id + '"' + (v.id === active ? ' aria-current="page"' : '') + ' title="' + esc(v.label) + '">' +
          '<span class="rail__icon">' + v.icon + '</span><span class="rail__label">' + esc(v.label) + '</span></a>';
      });
      document.getElementById('nav').innerHTML = html;
    }

    function viewFiles() {
      return '<div class="page-head"><div><div id="file-breadcrumb" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn" type="button" data-file-nav="">Storage root</button></div></div>' +
        '<div><button class="btn" id="folder-create">New folder</button> <button class="btn" id="trash-empty">Empty trash</button> <button class="btn" id="backup-drive">Backup drive</button> <button class="btn primary" id="file-upload-button">Import file</button><input id="file-upload-input" type="file" hidden></div></div>' +
        '<div id="file-storage-warning"></div>' +
        '<div class="grid" id="file-storage-summary" style="margin-bottom:16px"><div class="card" id="storage-card"><h3>Storage</h3><div class="stat">—</div><div class="sub">Loading pool capacity…</div></div><div class="card" id="trash-card"><h3>Trash</h3><div class="stat">—</div><div class="sub">Loading trash usage…</div></div></div>' +
        '<div class="card" id="file-list"><div class="empty"><b>Loading files…</b>Reading the storage root.</div></div>';
    }

    // loadStorageOverview renders the capacity headline and the storage notice
    // from GET /storage/overview. Capacity is the *pool's*, reported by the
    // backend from the mounted filesystem — never the host disk the storage
    // root happens to live on — and a pool the data plane has mounted but this
    // container cannot reach is called out instead of being shown as "no
    // storage".
    function loadStorageOverview() {
      var card = document.getElementById('storage-card');
      var warn = document.getElementById('file-storage-warning') || document.getElementById('storage-warning');
      if (!card && !warn) return Promise.resolve(null);
      return apiJSON('/storage/overview').then(function (data) {
        var entries = data.entries || [];
        var visible = entries.filter(function (e) { return e.visible; });
        if (card) {
          var body;
          var primary = data.primary;
          if (primary) {
            body = '<div class="stat">' + formatBytes(primary.total_bytes) + '</div><div class="sub">' +
              esc(primary.name) + ' · ' + formatBytes(primary.free_bytes) + ' free' +
              (visible.length > 1 ? ' · ' + visible.length + ' pools mounted' : '') + '</div>';
          } else if (entries.length) {
            body = '<div class="stat">Mounted</div><div class="sub">' + entries.length +
              ' pool(s) mounted by the data plane but not reachable from onyx-api — see the notice above.</div>';
          } else {
            body = '<div class="stat">No pool mounted</div><div class="sub">Create a pool on the Storage page to start using Files.</div>';
          }
          card.innerHTML = '<h3>Storage</h3>' + body;
        }
        if (warn) {
          warn.innerHTML = (data.warnings && data.warnings.length)
            ? '<div class="card" style="border-color:var(--onyx-danger);margin-bottom:16px"><h3>Storage notice</h3>' +
              data.warnings.map(function (w) { return '<div class="sub">' + esc(w) + '</div>'; }).join('') + '</div>'
            : '';
        }
        return data;
      }).catch(function (err) {
        if (card) card.innerHTML = '<h3>Storage</h3><div class="stat">Unavailable</div><div class="sub">onyx-api could not read the storage view.</div>';
        throw err;
      });
    }

    function loadTrash() {
      var card = document.getElementById('trash-card');
      var empty = document.getElementById('trash-empty');
      if (!card) return;
      apiJSON('/files/trash').then(function (data) {
        card.innerHTML = '<h3>Trash</h3><div class="stat">' + formatBytes(data.size_bytes) + '</div><div class="sub">' + data.items + ' item(s) across mounted storage</div>';
      }).catch(showError);
      if (empty) empty.addEventListener('click', function () {
        apiJSON('/files/trash').then(function (data) {
          if (!data.items) { toast('Trash is already empty.'); return; }
          if (!confirm('Permanently delete ' + data.items + ' trash item(s) using ' + formatBytes(data.size_bytes) + '?')) return;
          apiJSON('/files/trash', { method: 'DELETE' }).then(loadTrash).catch(showError);
        }).catch(showError);
      });
    }

    function createBackup(path) {
      try { localStorage.setItem('onyx.backupSource', '/mnt/onyx/' + path); } catch (e) {}
      location.hash = '#/backups';
    }

    function loadBackupLocations() {
      var select = document.getElementById('backup-target');
      var download = document.getElementById('backup-download-option');
      if (!select) return;
      var source = '';
      try { source = localStorage.getItem('onyx.backupSource') || ''; } catch (e) {}
      Promise.all([apiJSON('/devices'), apiJSON('/storage/remotes')]).then(function (parts) {
        var options = (parts[0].devices || []).filter(function (device) {
          return device.mountpoint && device.state === 'mounted' && (!source || source.indexOf(device.mountpoint) !== 0);
        }).map(function (device) {
          return '<option value="local|' + esc(device.mountpoint + '/backups') + '">' + esc((device.label || device.name) + ' — ' + device.mountpoint + ' (local)') + '</option>';
        });
        (parts[1].remotes || []).forEach(function (remote) {
          options.push('<option value="rclone|' + esc(remote + ':onyx-backups') + '">' + esc(remote + ' — rclone remote') + '</option>');
        });
        if (options.length) {
          select.innerHTML = '<option value="">Choose a location…</option>' + options.join('');
          if (download) download.style.display = 'none';
        } else {
          select.innerHTML = '<option value="">No backup location configured</option>';
          if (download) download.style.display = 'block';
        }
      }).catch(function () { select.innerHTML = '<option value="">Locations unavailable</option>'; if (download) download.style.display = 'block'; });
      if (download) download.addEventListener('click', function () {
        if (!source || source.indexOf('/mnt/onyx/') !== 0) { showError({ error: { message: 'Choose a file or folder from Files first.' } }); return; }
        window.open(API + '/files/archive?path=' + encodeURIComponent(source.slice('/mnt/onyx/'.length)), '_blank', 'noopener');
      });
    }

    function loadFiles(path) {
      window.__onyxFilePath = path || '';
      var list = document.getElementById('file-list');
      if (!list) return;
      var query = path ? '?path=' + encodeURIComponent(path) : '';
      apiJSON('/files' + query).then(function (data) {
        var crumb = document.getElementById('file-breadcrumb');

    function viewStorage() {
      return '<div class="page-head"><div><p>Attach a device, inspect pools and make storage available to Files.</p></div>' +
        '<div><span class="sub" id="storage-updated"></span><button class="btn" id="storage-scrub">Scrub schedule</button><button class="btn" id="storage-refresh">Refresh</button></div></div>' +
        '<div id="storage-warning"></div>' +
        '<div class="grid" style="margin-bottom:16px"><div class="card" id="storage-card"><h3>Storage</h3><div class="stat">—</div><div class="sub">Loading pool capacity…</div></div></div>' +
        '<div class="card" id="storage-pools"><div class="empty"><b>Loading pools…</b>Checking mounted storage.</div></div>' +
        '<div class="card" style="margin-top:16px" id="storage-devices"><div class="empty"><b>Loading devices…</b>Scanning block devices.</div></div>' +
        '<div class="card" style="margin-top:16px" id="storage-pool-setup"><h3>Create an Onyx storage pool</h3><p class="sub">Format a whole disk, then mount it automatically under /mnt/onyx. The defaults below — label <b>main-pool</b>, Btrfs, mounted at /mnt/onyx/main-pool, force unmount and erase — are ready to use; change any option before creating. Any whole disk can be pooled — internal disks included — and a disk Onyx already mounted is re-created in place.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end"><label>Disk<select id="pool-device" class="search" style="width:100%;max-width:none"><option value="">Loading safe disks…</option></select></label><label>Pool label<input id="pool-name" class="search" style="width:100%;max-width:none" value="main-pool" placeholder="main-pool"></label><label>Filesystem<select id="pool-fs" class="search" style="width:100%;max-width:none"><option value="btrfs">Btrfs</option><option value="ext4">ext4</option></select></label><label>Mount directory<input id="pool-mount-name" class="search" style="width:100%;max-width:none" placeholder="Defaults to pool label"></label><label style="display:flex;gap:8px;align-items:center"><input id="pool-auto-mount" type="checkbox" checked> Auto-mount after format</label><label style="display:flex;gap:8px;align-items:center"><input id="pool-force" type="checkbox" checked> Force unmount &amp; erase</label><button class="btn" id="pool-preview">Review destructive operation</button><button class="btn" id="pool-defaults">Use defaults</button></div><div id="pool-warning" class="sub" style="margin-top:12px">A verified backup and final confirmation are required before any erase operation.</div></div>';
    }

    // protojson serializes protocol enums as names ("SHARE_PROTOCOL_SMB");
    // render them the way users see them in the API and CLI ("smb, nfs").
    function friendlyProtocols(list) {
      return (list || []).map(function (p) {
        return String(p).replace(/^SHARE_PROTOCOL_/, '').toLowerCase();
      }).join(', ');
    }

    function formatBytes(value) {
      var n = Number(value || 0);
      if (!n) return '0 MB';
      // Terabytes matter here: a pool is routinely 1-20 TB, and "2048.00 GB"
      // makes an operator do arithmetic to read a capacity headline.
      if (n >= 1024 * 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024 * 1024)).toFixed(2) + ' TB';
      if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
      if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(2) + ' MB';
      if (n >= 1024) return (n / 1024).toFixed(2) + ' KB';
      return n + ' B';
    }

    function deviceRole(device) {
      if (device.mountpoint && device.mountpoint.indexOf('/mnt/onyx') !== 0) return 'Mounted outside Onyx — likely an OS or system volume';
      if (device.type === 'disk') return device.removable ? 'Removable disk (USB/SD)' : 'Whole disk';
      if (device.type === 'part') return device.removable ? 'Removable partition' : 'Partition';
      return device.type || 'Block device';
    }

    // `nodePresent` is answered by the data plane about its own /dev: a disk can
    // be listed from /sys and still have no device node in the container's mount
    // namespace, in which case nothing can be formatted or mounted on it. Saying
    // so is the difference between "not visible to Onyx" and a failed erase.
    function deviceNodeNote(device) {
      if (device.nodePresent === false) return 'Not visible to Onyx: ' + (device.path || '/dev/' + device.kname) + ' does not exist in the data plane, so this disk can be listed but not formatted or mounted (bind /dev into onyx-privd and onyx-storaged).';
      return '';
    }

    function deviceWarning(device) {
      if (device.nodePresent === false) return deviceNodeNote(device);
      if (device.mountpoint && device.mountpoint.indexOf('/mnt/onyx') !== 0) return 'Already mounted by the host; Onyx will not touch it.';
      if (!device.fsType) return 'No filesystem signature detected. It may be unused, encrypted, RAID/LVM metadata, or an unformatted partition.';
      if (['vfat', 'fat32', 'exfat', 'ntfs', 'ext2', 'ext3', 'ext4', 'xfs', 'btrfs', 'hfsplus', 'apfs'].indexOf(String(device.fsType).toLowerCase()) < 0) return 'Filesystem detected. Attach will ask the Linux kernel to mount it; support depends on the host kernel/tools.';
      return 'Readable filesystem detected; attaching does not format or erase it.';
    }

    // True for a partition kname belonging directly to a disk kname: "sdc1"
    // belongs to "sdc", "nvme0n1p1" to "nvme0n1". Mirrors the data plane's
    // own mapping so the Storage page reasons about a disk and its partitions
    // the same way the backend does.
    function isPartitionOf(diskKname, candidate) {
      var disk = String(diskKname || '');
      var s = String(candidate || '');
      if (!disk || s === disk || s.indexOf(disk) !== 0) return false;
      var suffix = s.slice(disk.length);
      return /^[0-9]+$/.test(suffix) || /^p[0-9]+$/.test(suffix);
    }

    // Every mount of a disk: the disk itself plus any of its partitions.
    function diskMounts(disk, devices) {
      return (devices || []).filter(function (d) {
        return (d.kname === disk.kname || isPartitionOf(disk.kname, d.kname)) && d.mountpoint;
      });
    }

    // The device backing a pool: its filesystem uuid is the stable identity, so
    // that is tried first (a relabel must not lose the disk), then the label and
    // the display name. The API reports both lists, so the join happens here
    // rather than in a second endpoint.
    function poolDevice(pool, devices) {
      var rows = devices || [];
      if (pool.uuid) {
        var byUuid = rows.filter(function (d) { return d.uuid === pool.uuid; })[0];
        if (byUuid) return byUuid;
      }
      return rows.filter(function (d) { return d.label === pool.name || d.name === pool.name; })[0];
    }

    // "onyx" when the disk (or one of its partitions) is mounted under
    // /mnt/onyx, "host" when anything of it is mounted elsewhere, else "none".
    // Host mounts are the boundary Onyx never crosses.
    function diskMountState(disk, devices) {
      var mounts = diskMounts(disk, devices);
      if (mounts.some(function (m) { return String(m.mountpoint).indexOf('/mnt/onyx') !== 0; })) return 'host';
      return mounts.length ? 'onyx' : 'none';
    }

    function loadStorage() {
      var pools = document.getElementById('storage-pools');
      var devices = document.getElementById('storage-devices');

        var poolRows = parts[0].pools || [], deviceRows = parts[1].devices || [];
        // A pool row says where the pool actually is: its backing device, the
        // mount the kernel reports, and — when it is not mounted — the path its
        // record remembers (what the data plane restores after a restart) and
        // whether the device is still present. A record with no device at all is

        pools.innerHTML = poolRows.length ? '<h3>Mounted pools</h3><div style="display:grid;gap:10px">' + poolRows.map(function (pool) {
          var offline = String(pool.state || '').toLowerCase() === 'offline';
          var dev = poolDevice(pool, deviceRows);
          var live = dev && dev.mountpoint ? dev.mountpoint : '';
          var remembered = pool.mountpoint || '';
          var identity = (dev ? esc(dev.path || ('/dev/' + dev.kname)) + ' · ' : '') + esc(pool.fsType || 'unknown') + ' · ' + formatBytes(pool.usedBytes) + ' used of ' + formatBytes(pool.totalBytes);
          var where = live ? 'mounted at ' + esc(live)
            : dev ? 'device present, not mounted' + (remembered ? ' — mounted again at ' + esc(remembered) : '')
            : 'no backing device' + (remembered ? ' — its filesystem was last mounted at ' + esc(remembered) : '');
          return '<div class="event" style="justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--onyx-border);padding:10px 0"><div style="min-width:0"><b>' + esc(pool.name) + '</b><div class="sub">' + identity + '</div><div class="sub">' + where + (offline ? ' · offline' : '') + '</div></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="tag">' + esc(pool.state || 'unknown') + '</span><button class="btn" data-pool-remove="' + esc(pool.name) + '">Remove</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No storage pools mounted</b>Attach a readable device below or connect a pool on the host.</div>';
        Array.prototype.forEach.call(pools.querySelectorAll('[data-pool-remove]'), function (button) {
          button.addEventListener('click', function () {
            if (!confirm('Remove pool "' + button.dataset.poolRemove + '"? Its mount is released and Onyx forgets the pool. The filesystem on the disk is not erased.')) return;
            button.disabled = true;

          });
        });
        devices.innerHTML = '<h3>Devices</h3><p class="sub">Onyx identifies disks by label, UUID, filesystem, size, mountpoint, and removable status. It never formats a device from this screen.</p>' + (deviceRows.length ? '<div style="display:grid;gap:10px">' + deviceRows.map(function (device) {
          var attached = device.state === 'mounted' || !!device.mountpoint;
          var outside = device.mountpoint && device.mountpoint.indexOf('/mnt/onyx') !== 0;

          var attachable = !!device.fsType && !outside && visible;

          // Onyx pools whole disks, so the useful action is to point at the disk
          // that owns the partition rather than leave a disabled "Needs
          // filesystem" button with no way forward.
          var parentDisk = device.type === 'part' ? deviceRows.filter(function (d) {
            return (d.type === 'disk' || d.type === 'loop') && isPartitionOf(d.kname, device.kname);
          })[0] : null;
          var poolableParent = parentDisk && parentDisk.nodePresent !== false && diskMountState(parentDisk, deviceRows) !== 'host';
          var action;
          if (attached) {
            action = outside ? '<button class="btn" disabled title="Mounted outside Onyx">Host mounted</button>' : '<button class="btn" data-device-detach="' + esc(device.name) + '">Detach</button>';
          } else if (attachable) {
            action = '<button class="btn primary" data-device-attach="' + esc(device.name) + '">Attach</button>';
          } else if (poolableParent) {
            action = '<button class="btn" data-pool-use="' + esc(parentDisk.name) + '" title="Onyx creates pools on whole disks, not partitions">Create pool on ' + esc(parentDisk.path || '/dev/' + parentDisk.kname) + '</button>';
          } else {
            action = '<button class="btn" disabled title="' + (visible ? 'No filesystem signature; formatting is intentionally not offered here' : 'This device has no node in the data plane container') + '">' + (visible ? 'Needs filesystem' : 'Not visible') + '</button>';
          }

        }).join('') + '</div>' : '<div class="empty"><b>No devices detected</b>Connect a disk or USB drive to make it available to Onyx.</div>');
        Array.prototype.forEach.call(devices.querySelectorAll('[data-device-attach]'), function (button) {
          button.addEventListener('click', function () { button.disabled = true; apiJSON('/devices/' + encodeURIComponent(button.dataset.deviceAttach) + '/attach', { method: 'POST' }).then(loadStorage).catch(showError); });
        });
        Array.prototype.forEach.call(devices.querySelectorAll('[data-device-detach]'), function (button) {
          button.addEventListener('click', function () { if (!confirm('Detach this device and its shares?')) return; button.disabled = true; apiJSON('/devices/' + encodeURIComponent(button.dataset.deviceDetach) + '/detach', { method: 'POST' }).then(loadStorage).catch(showError); });
        });
        // A filesystem-less partition offers the whole disk that owns it: this
        // selects that disk in the create-pool form and brings the form into
        // view, so the row leads somewhere instead of stopping at "Needs
        // filesystem". A disk that is not offered (host-mounted, or with no node
        // in the data plane) is named rather than silently ignored.
        Array.prototype.forEach.call(devices.querySelectorAll('[data-pool-use]'), function (button) {

            }

      });
    }

    // refreshStorage re-reads the whole storage view. The device read carries a
    // live rescan on the data plane, so a drive or pool that appeared since the
    // last look shows up here; the timestamp makes the button visibly do
    // something even when nothing has changed.
    //
    // `full` re-renders the page as well as re-fetching, which is what the
    // Refresh button asks for: the create-pool disk picker is built from the

    // look has to show up there too, or Refresh looks like it did nothing. Errors

    // why instead of sitting silent.
    function refreshStorage(full) {

        var summary = document.getElementById('backup-summary');
        if (summary) summary.innerHTML = '<div class="card"><h3>Recovery health</h3><div class="stat">' + health + '%</div><div class="sub">across ' + (report.jobs || []).length + ' configured jobs</div></div>';
        list.innerHTML = jobs.length ? '<div style="display:grid;gap:10px">' + jobs.map(function (j) {
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(j.name) + '</b><div class="sub">' + esc(j.source + ' → ' + j.target + ' · ' + (j.schedule || 'manual')) + '</div></div><div style="display:flex;gap:8px"><button class="btn" data-restore-job="' + esc(j.id) + '">Restore</button><button class="btn" data-run="' + esc(j.id) + '">Run now</button><button class="btn" data-delete-job="' + esc(j.id) + '">Remove</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No backup jobs yet</b>Create a job to protect a share or snapshot.</div>';
        Array.prototype.forEach.call(list.querySelectorAll('[data-run]'), function (button) {
          button.addEventListener('click', function () { apiJSON('/backup-jobs/' + encodeURIComponent(button.dataset.run) + '/run', { method: 'POST' }).then(loadBackups).catch(showError); });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-delete-job]'), function (button) {
          button.addEventListener('click', function () {
            if (!confirm('Remove this backup job and its recorded history? Existing backup files are not deleted.')) return;
            apiJSON('/backup-jobs/' + encodeURIComponent(button.dataset.deleteJob), { method: 'DELETE' }).then(loadBackups).catch(showError);
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-restore-job]'), function (button) {
          button.addEventListener('click', function () {
            apiJSON('/backup-jobs/' + encodeURIComponent(button.dataset.restoreJob) + '/history').then(function (data) {
              var runs = (data.runs || []).filter(function (run) { return run.status === 'succeeded'; });
              if (!runs.length) throw { error: { message: 'No successful backup run is available to restore.' } };
              var destination = prompt('Restore destination (future pool path)', '/mnt/onyx/restore');
              if (!destination) return;
              return apiJSON('/backups/' + encodeURIComponent(runs[runs.length - 1].id) + '/restore', { method: 'POST', body: JSON.stringify({ destination: destination }) });
            }).then(function (result) { if (result) toast('Restore started.'); }).catch(showError);
          });
        });
      }).catch(showError);
    }

    function showError(err) {
      var message = err && err.error && err.error.message ? err.error.message : (err && err.message ? err.message : 'The API request failed.');
      toast(message, 'bad');
      var target = document.getElementById('content');
      if (target) target.insertAdjacentHTML('afterbegin', '<div class="card" role="alert" style="border-color:var(--bad);color:var(--bad);background:var(--bad-soft)">' + esc(message) + '</div>');
    }

    // --- Apps (v0.4 "Jade"): the app store and container lifecycle ----------
    // The store and the installed list are one catalog filtered by status, so
    // the page shows both sides of the same data: what can be installed, what
    // is installed, and the containers the installed apps are running.

    function viewApps() {
      return '<div class="page-head"><div><p>Self-hosted applications from the app store, running as containers on this host.</p></div>' +
        '<button class="btn" id="apps-refresh">Refresh</button></div>' +
        '<div class="card" id="app-catalog"><div class="empty"><b>Loading the app store…</b>Reading the signed catalog.</div></div>' +
        '<div class="card" style="margin-top:16px" id="app-installed"><div class="empty"><b>Loading installed apps…</b>Reading the install records.</div></div>' +
        '<div class="card" style="margin-top:16px" id="app-containers"><div class="empty"><b>Loading containers…</b>Asking the container runtime.</div></div>';
    }

    // statusTag colours an app or container state. A running container and an
    // installed app are the healthy states; error is the only red one.
    function stateTag(state) {
      var s = String(state || 'unknown');
      var tone = s === 'running' || s === 'installed' ? 'var(--ok)' : (s === 'error' ? 'var(--bad)' : 'var(--ink-faint)');
      return '<span class="tag" style="border-color:' + tone + ';color:' + tone + '">' + esc(s.replace(/_/g, ' ')) + '</span>';
    }

    function loadApps() {
      var catalog = document.getElementById('app-catalog');
      var installed = document.getElementById('app-installed');
      if (!catalog) return Promise.resolve();
      return Promise.all([apiJSON('/apps'), apiJSON('/apps?status=installed')]).then(function (parts) {
        var all = parts[0].apps || [], have = parts[1].apps || [];
        var installedIDs = {};
        have.forEach(function (a) { installedIDs[a.id] = true; });

        catalog.innerHTML = '<h3>App store</h3>' + (all.length ? '<div style="display:grid;gap:10px">' + all.map(function (app) {
          var done = installedIDs[app.id];
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(app.name) + '</b>' + stateTag(app.status) + '<div class="sub">' + esc(app.id) + ' · v' + esc(app.version) + ' · ' + esc(app.description || 'no description') + '</div></div>' +
            (done ? '<span class="sub">installed</span>' : '<button class="btn primary" data-app-install="' + esc(app.id) + '" data-app-version="' + esc(app.version) + '">Install</button>') + '</div>';
        }).join('') + '</div>' : '<div class="empty"><b>The catalog is empty</b>onyx-appd reported no apps. Check that onyx-appd is deployed and its catalog is mounted.</div>');

        installed.innerHTML = '<h3>Installed</h3>' + (have.length ? '<div style="display:grid;gap:10px">' + have.map(function (app) {
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(app.name) + '</b>' + stateTag(app.status) + '<div class="sub">' + esc(app.id) + ' · v' + esc(app.version) + (app.installedAt ? ' · installed ' + esc(app.installedAt) : '') + '</div></div>' +
            '<div><button class="btn" data-app-uninstall="' + esc(app.id) + '">Uninstall</button> <button class="btn" data-app-purge="' + esc(app.id) + '">Uninstall &amp; erase data</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No apps installed</b>Install one from the catalog above.</div>');

        Array.prototype.forEach.call(catalog.querySelectorAll('[data-app-install]'), function (button) {
          button.addEventListener('click', function () {
            button.disabled = true; button.textContent = 'Installing…';
            apiJSON('/apps', { method: 'POST', body: JSON.stringify({ app_id: button.dataset.appInstall, version: button.dataset.appVersion }) })
              .then(function () { return refreshApps(); })
              .catch(function (err) { button.disabled = false; button.textContent = 'Install'; showError(err); });
          });
        });
        Array.prototype.forEach.call(installed.querySelectorAll('[data-app-uninstall]'), function (button) {
          button.addEventListener('click', function () { uninstallApp(button.dataset.appUninstall, false, button); });
        });
        Array.prototype.forEach.call(installed.querySelectorAll('[data-app-purge]'), function (button) {
          button.addEventListener('click', function () {
            if (!window.confirm('Uninstall ' + button.dataset.appPurge + ' and permanently erase its data volumes? This cannot be undone.')) return;
            uninstallApp(button.dataset.appPurge, true, button);
          });
        });
      }).catch(function (err) {
        if (catalog) catalog.innerHTML = '<h3>App store</h3><div class="empty"><b>onyx-appd is unavailable</b>' + esc(err && err.error && err.error.message ? err.error.message : 'The app service did not answer.') + '</div>';
      });
    }

    function uninstallApp(appID, purge, button) {
      button.disabled = true; button.textContent = 'Removing…';
      apiJSON('/apps/' + encodeURIComponent(appID) + '?purge_data=' + (purge ? 'true' : 'false') + '&force=true', { method: 'DELETE' })
        .then(function () { return refreshApps(); })
        .catch(function (err) { button.disabled = false; button.textContent = purge ? 'Uninstall & erase data' : 'Uninstall'; showError(err); });
    }

    function loadContainers() {
      var card = document.getElementById('app-containers');
      if (!card) return Promise.resolve();
      return apiJSON('/containers').then(function (data) {
        var rows = data.containers || [];
        card.innerHTML = '<h3>Containers</h3>' + (rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (ct) {
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(ct.service || ct.name) + '</b>' + stateTag(ct.status) + '<div class="sub">' + esc(ct.id) + ' · ' + esc(ct.image) + (ct.appId ? ' · app ' + esc(ct.appId) : '') + '</div></div>' +
            '<div><button class="btn" data-container-start="' + esc(ct.id) + '">Start</button> <button class="btn" data-container-stop="' + esc(ct.id) + '">Stop</button> <button class="btn" data-container-restart="' + esc(ct.id) + '">Restart</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No containers</b>Installing an app brings its containers up here.</div>');
        ['start', 'stop', 'restart'].forEach(function (action) {
          Array.prototype.forEach.call(card.querySelectorAll('[data-container-' + action + ']'), function (button) {
            button.addEventListener('click', function () {
              button.disabled = true;
              apiJSON('/containers/' + encodeURIComponent(button.dataset['container' + action.charAt(0).toUpperCase() + action.slice(1)]) + '/' + action, { method: 'POST' })
                .then(function () { return loadContainers(); })
                .catch(function (err) { button.disabled = false; showError(err); });
            });
          });
        });
      }).catch(function (err) {
        card.innerHTML = '<h3>Containers</h3><div class="empty"><b>The container runtime is unavailable</b>' + esc(err && err.error && err.error.message ? err.error.message : 'onyx-appd did not answer.') + '</div>';
      });
    }

    function refreshApps() {
      var button = document.getElementById('apps-refresh');
      if (button) { button.disabled = true; button.textContent = 'Refreshing…'; }
      return Promise.all([loadApps(), loadContainers()]).catch(function () {}).then(function () {
        if (button) { button.disabled = false; button.textContent = 'Refresh'; }
      });
    }

    // --- VMs (v0.4 "Jade"): libvirt/QEMU machines on the pool ---------------

    function viewVMs() {
      return '<div class="page-head"><div><p>Machines run on KVM through libvirt; their disk images live on the pool, so snapshots and backups cover them too.</p></div>' +
        '<button class="btn" id="vms-refresh">Refresh</button></div>' +
        '<div class="card" style="margin-bottom:16px"><h3>Create a virtual machine</h3><p class="sub">A machine is defined stopped: review it, then boot it. The disk image is created on the pool and is never overwritten.</p>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end">' +
        '<label>Name<input id="vm-name" class="search" style="width:100%;max-width:none" placeholder="debian"></label>' +
        '<label>vCPUs<input id="vm-vcpus" class="search" style="width:100%;max-width:none" type="number" min="1" value="2"></label>' +
        '<label>Memory (MiB)<input id="vm-memory" class="search" style="width:100%;max-width:none" type="number" min="64" value="2048"></label>' +
        '<label>Disk (MiB)<input id="vm-disk" class="search" style="width:100%;max-width:none" type="number" min="1024" value="20480"></label>' +
        '<label>OS label<input id="vm-os" class="search" style="width:100%;max-width:none" placeholder="debian-12"></label>' +
        '<label>Install ISO (optional)<input id="vm-iso" class="search" style="width:100%;max-width:none" placeholder="/mnt/onyx/main-pool/@apps/iso/debian.iso"></label>' +
        '<button class="btn primary" id="vm-create">Create machine</button></div><div id="vm-warning" class="sub" style="margin-top:12px"></div></div>' +
        '<div class="card" id="vm-list"><div class="empty"><b>Loading virtual machines…</b>Asking the hypervisor.</div></div>';
    }

    function loadVMs() {
      var list = document.getElementById('vm-list');
      if (!list) return Promise.resolve();
      return apiJSON('/vms').then(function (data) {
        var rows = data.vms || [];
        list.innerHTML = '<h3>Machines</h3>' + (rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (vm) {
          var running = vm.status === 'running';
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(vm.name) + '</b>' + stateTag(vm.status) + '<div class="sub">' + esc(vm.id) + ' · ' + vm.vcpus + ' vCPU · ' + formatBytes(vm.memoryMb * 1024 * 1024) + ' RAM' + (vm.disk ? ' · ' + esc(vm.disk) : '') + '</div></div>' +
            '<div><button class="btn" data-vm-start="' + esc(vm.id) + '"' + (running ? ' disabled' : '') + '>Start</button> <button class="btn" data-vm-stop="' + esc(vm.id) + '"' + (running ? '' : ' disabled') + '>Stop</button> <button class="btn" data-vm-delete="' + esc(vm.id) + '"' + (running ? ' disabled' : '') + '>Delete</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No virtual machines</b>Create one above. The machine is defined stopped and stays that way until you start it.</div>');

        ['start', 'stop'].forEach(function (action) {
          Array.prototype.forEach.call(list.querySelectorAll('[data-vm-' + action + ']'), function (button) {
            button.addEventListener('click', function () {
              button.disabled = true;
              var id = button.dataset['vm' + action.charAt(0).toUpperCase() + action.slice(1)];
              var request = action === 'stop'
                ? apiJSON('/vms/' + encodeURIComponent(id) + '/stop', { method: 'POST', body: JSON.stringify({ graceful: true }) })
                : apiJSON('/vms/' + encodeURIComponent(id) + '/start', { method: 'POST' });
              request.then(function () { return loadVMs(); }).catch(function (err) { button.disabled = false; showError(err); });
            });
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-vm-delete]'), function (button) {
          button.addEventListener('click', function () {
            var id = button.dataset.vmDelete;
            // The disk image is deleted too: this is the one irreversible VM
            // action, so it is spelled out in the confirmation.
            if (!window.confirm('Delete ' + id + ' and its disk image? Everything on the machine is lost and cannot be recovered.')) return;
            button.disabled = true;
            apiJSON('/vms/' + encodeURIComponent(id) + '?delete_disk=true', { method: 'DELETE' })
              .then(function () { return loadVMs(); })
              .catch(function (err) { button.disabled = false; showError(err); });
          });
        });
      }).catch(function (err) {
        list.innerHTML = '<h3>Machines</h3><div class="empty"><b>onyx-vmm is unavailable</b>' + esc(err && err.error && err.error.message ? err.error.message : 'The virtualization service did not answer.') + '</div>';
      });
    }

    function refreshVMs() {
      var button = document.getElementById('vms-refresh');
      if (button) { button.disabled = true; button.textContent = 'Refreshing…'; }
      return loadVMs().catch(function () {}).then(function () {
        if (button) { button.disabled = false; button.textContent = 'Refresh'; }
      });
    }

    // --- Objects (v0.4 "Jade"): S3 buckets and hybrid-cloud tiering --------

    function viewObjects() {
      return '<div class="page-head"><div><p>S3-compatible buckets for application data — local, cloud-primary, or tiered with the pool as the hot copy and a remote as the cold tier.</p></div>' +
        '<button class="btn" id="objects-refresh">Refresh</button></div>' +
        '<div class="card" style="margin-bottom:16px"><h3>Create a bucket</h3><p class="sub">A <b>local</b> bucket stays on the pool. A <b>cloud</b> or <b>tiered</b> bucket targets a remote configured on the Shares page (for example <code>b2-archive:</code>); tiered buckets mirror to it on sync and can release local copies once the cloud copy is verified.</p>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end">' +
        '<label>Bucket name<input id="bucket-name" class="search" style="width:100%;max-width:none" placeholder="documents"></label>' +
        '<label>Tier<select id="bucket-tier" class="search" style="width:100%;max-width:none"><option value="local">Local (pool only)</option><option value="tiered">Tiered (hot pool, cold cloud)</option><option value="cloud">Cloud-primary</option></select></label>' +
        '<label>Cloud target<input id="bucket-target" class="search" style="width:100%;max-width:none" list="bucket-remotes" placeholder="b2-archive:"></label>' +
        '<label>Evict local copies after (days)<input id="bucket-evict" class="search" style="width:100%;max-width:none" type="number" min="0" value="0"></label>' +
        '<button class="btn primary" id="bucket-create">Create bucket</button></div>' +
        '<datalist id="bucket-remotes"></datalist><div id="bucket-warning" class="sub" style="margin-top:12px"></div></div>' +
        '<div class="card" id="bucket-list"><div class="empty"><b>Loading buckets…</b>Reading the object store.</div></div>';
    }

    function loadBuckets() {
      var list = document.getElementById('bucket-list');
      var remotes = document.getElementById('bucket-remotes');
      if (!list) return Promise.resolve();
      if (remotes) {
        apiJSON('/storage/remotes').then(function (data) {
          remotes.innerHTML = (data.remotes || []).map(function (name) {
            return '<option value="' + esc(name) + ':"></option>';
          }).join('');
        }).catch(function () {});
      }
      return apiJSON('/buckets').then(function (data) {
        var rows = data.buckets || [];
        list.innerHTML = '<h3>Buckets</h3>' + (rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (b) {
          var tier = String(b.tier || 'LOCAL').toLowerCase();
          var cloudTier = tier === 'cloud' || tier === 'tiered';
          var last = b.lastSyncAt ? ' · last sync ' + esc(b.lastSyncAt) : '';
