<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ONYX — Online Storage System</title>
  <meta name="description" content="ONYX — Self-hosted online storage system. Manage pools, files, snapshots and shares.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d10'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='none' stroke='%233b9dff' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    /* ── Prism tokens (docs/design/03 §2). Dark-first; light is supported. ── */
    :root {
      --onyx-bg: #0b0d10;
      --onyx-bg-elevated: #12151a;
      --onyx-bg-glass: rgba(24, 28, 34, 0.72);
      --onyx-surface: #181c22;
      --onyx-surface-hover: #1f242c;
      --onyx-border: #262c35;
      --onyx-text: #e6e9ee;
      --onyx-text-secondary: #b3bcc8;
      --onyx-text-muted: #8f98a6;
      --onyx-accent: #3b9dff;
      --onyx-accent-hover: #6cb6ff;
      --onyx-accent-tint: rgba(59, 157, 255, 0.12);
      --onyx-success: #3ddc84;
      --onyx-warning: #f5b544;
      --onyx-danger: #f25f5f;
      --onyx-info: #5ac8fa;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
      --sidebar-w: 240px;
      --sidebar-rail: 64px;
      --rail-w: 300px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --dur-micro: 150ms;
      --dur-std: 220ms;
    }
    [data-theme="light"] {
      --onyx-bg: #f6f7f9;
      --onyx-bg-elevated: #ffffff;
      --onyx-bg-glass: rgba(255, 255, 255, 0.78);
      --onyx-surface: #ffffff;
      --onyx-surface-hover: #eef1f5;
      --onyx-border: #dde2e9;
      --onyx-text: #10131a;
      --onyx-text-secondary: #3d4550;
      --onyx-text-muted: #5b6470;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      letter-spacing: -0.011em;
      background: var(--onyx-bg);
      color: var(--onyx-text);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    a { color: var(--onyx-accent); text-decoration: none; }
    a:hover { color: var(--onyx-accent-hover); }
    :focus-visible { outline: 2px solid var(--onyx-accent); outline-offset: 2px; border-radius: var(--radius-sm); }

    /* ── Shell ─────────────────────────────────────────────────────────── */
    .app { display: grid; grid-template-columns: auto 1fr auto; height: 100vh; }

    /* ── Sidebar (Arc-style, collapsible to a 64px rail) ───────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--onyx-surface);
      border-right: 1px solid var(--onyx-border);
      display: flex; flex-direction: column;
      transition: width var(--dur-std) var(--ease);
      overflow: hidden;
    }
    .app[data-collapsed="true"] .sidebar { width: var(--sidebar-rail); }
    .brand { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); }
    .brand .mark {
      width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center;
      border-radius: var(--radius-md);
      background: linear-gradient(140deg, var(--onyx-accent), #1b6fd0);
      color: #fff; font-weight: 700;
    }
    .brand .name { font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
    .app[data-collapsed="true"] .brand .name { display: none; }

    .nav { flex: 1; overflow-y: auto; padding: var(--space-2); display: flex; flex-direction: column; gap: 2px; }
    .nav .section {
      padding: var(--space-3) var(--space-3) var(--space-1);
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--onyx-text-muted);
    }
    .app[data-collapsed="true"] .nav .section { display: none; }
    .nav a {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      color: var(--onyx-text-secondary); white-space: nowrap;
      transition: background var(--dur-micro) var(--ease), color var(--dur-micro) var(--ease);
    }
    .nav a:hover { background: var(--onyx-surface-hover); color: var(--onyx-text); }
    .nav a[aria-current="page"] { background: var(--onyx-accent-tint); color: var(--onyx-accent); }
    .nav a svg { width: 18px; height: 18px; flex: 0 0 18px; }
    .nav a .label { flex: 1; }
    .nav a .badge {
      font-size: 11px; font-variant-numeric: tabular-nums;
      padding: 1px 7px; border-radius: 999px;
      background: var(--onyx-surface-hover); color: var(--onyx-text-secondary);
    }
    .app[data-collapsed="true"] .nav a .label,
    .app[data-collapsed="true"] .nav a .badge { display: none; }
    .app[data-collapsed="true"] .nav a { justify-content: center; padding: var(--space-2); }

    .sidebar-foot { padding: var(--space-3); border-top: 1px solid var(--onyx-border); }
    .ghost-btn {
      width: 100%; display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: transparent; border: 1px solid transparent; border-radius: var(--radius-md);
      color: var(--onyx-text-muted); cursor: pointer;
      transition: background var(--dur-micro) var(--ease), color var(--dur-micro) var(--ease);
    }
    .ghost-btn:hover { background: var(--onyx-surface-hover); color: var(--onyx-text); }
    .app[data-collapsed="true"] .ghost-btn .label { display: none; }
    .app[data-collapsed="true"] .ghost-btn { justify-content: center; }

    /* ── Main ──────────────────────────────────────────────────────────── */
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 56px; flex: 0 0 56px;
      display: flex; align-items: center; gap: var(--space-4);
      padding: 0 var(--space-5);
      border-bottom: 1px solid var(--onyx-border);
      background: var(--onyx-bg-glass);
      backdrop-filter: blur(24px);
    }
    .crumbs { display: flex; align-items: center; gap: var(--space-2); color: var(--onyx-text-muted); white-space: nowrap; }
    .crumbs b { color: var(--onyx-text); font-weight: 600; }
    .search {
      flex: 1; max-width: 460px; display: flex; align-items: center; gap: var(--space-2);
      height: 34px; padding: 0 var(--space-3);
      background: var(--onyx-surface); border: 1px solid var(--onyx-border);
      border-radius: var(--radius-md); color: var(--onyx-text-muted); cursor: text;
    }
    .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--onyx-text); }
    .search kbd, kbd {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
      padding: 2px 6px; border: 1px solid var(--onyx-border); border-radius: var(--radius-sm);
      background: var(--onyx-bg-elevated); color: var(--onyx-text-muted);
    }
    .topbar .spacer { flex: 1; }
    .pill {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: 4px 10px; border-radius: 999px; font-size: 12px;
      border: 1px solid var(--onyx-border); background: var(--onyx-surface);
      color: var(--onyx-text-secondary);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--onyx-text-muted); }
    .dot.ok { background: var(--onyx-success); }
    .dot.warn { background: var(--onyx-warning); }
    .dot.err { background: var(--onyx-danger); }
    .icon-btn {
      width: 34px; height: 34px; display: grid; place-items: center;
      background: transparent; border: 1px solid transparent; border-radius: var(--radius-md);
      color: var(--onyx-text-secondary); cursor: pointer;
      transition: background var(--dur-micro) var(--ease);
    }
    .icon-btn:hover { background: var(--onyx-surface-hover); color: var(--onyx-text); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(140deg, var(--onyx-accent), #1b6fd0); color: #fff;
      font-size: 12px; font-weight: 600;
    }

    .content { flex: 1; overflow-y: auto; padding: var(--space-6); }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); }
    .page-head h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    .page-head p { margin: var(--space-1) 0 0; color: var(--onyx-text-muted); }

    .grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card {
      background: var(--onyx-bg-elevated); border: 1px solid var(--onyx-border);
      border-radius: var(--radius-lg); padding: var(--space-5);
    }
    .card h3 { margin: 0 0 var(--space-2); font-size: 14px; }
    .card .stat { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .card .sub { color: var(--onyx-text-muted); font-size: 12px; }
    .empty {
      border: 1px dashed var(--onyx-border); border-radius: var(--radius-lg);
      padding: var(--space-10); text-align: center; color: var(--onyx-text-muted);
    }
    .empty b { display: block; color: var(--onyx-text); margin-bottom: var(--space-2); font-size: 15px; }
    .btn {
      display: inline-flex; align-items: center; gap: var(--space-2);
      height: 34px; padding: 0 var(--space-4); border-radius: var(--radius-md);
      border: 1px solid var(--onyx-border); background: var(--onyx-surface);
      color: var(--onyx-text); cursor: pointer;
      transition: background var(--dur-micro) var(--ease), border-color var(--dur-micro) var(--ease);
    }
    .btn:hover { background: var(--onyx-surface-hover); border-color: var(--onyx-accent); }
    .btn.primary { background: var(--onyx-accent); border-color: var(--onyx-accent); color: #fff; }
    .btn.primary:hover { background: var(--onyx-accent-hover); }
    .reserved { border-style: dashed; background: transparent; }
    .reserved .stat { color: var(--onyx-text-muted); font-size: 15px; font-weight: 600; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--onyx-accent-tint); color: var(--onyx-accent); }

    /* ── Activity rail ─────────────────────────────────────────────────── */
    .rail {
      width: var(--rail-w); background: var(--onyx-surface);
      border-left: 1px solid var(--onyx-border); display: flex; flex-direction: column;
      transition: width var(--dur-std) var(--ease);
      overflow: hidden;
    }
    .app[data-rail="closed"] .rail { width: 0; border-left: 0; }
    .rail h2 { margin: 0; padding: var(--space-4); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--onyx-text-muted); white-space: nowrap; }
    .rail .events { padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); overflow-y: auto; }
    .event { display: flex; gap: var(--space-3); font-size: 13px; }
    .event time { color: var(--onyx-text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    /* ── Command palette ───────────────────────────────────────────────── */
    .palette {
      position: fixed; inset: 0; z-index: 50; display: none;
      background: rgba(6, 8, 11, 0.55); backdrop-filter: blur(4px);
      padding-top: 14vh; justify-content: center;
    }
    .palette[data-open="true"] { display: flex; }
    .palette .sheet {
      width: min(640px, 92vw); max-height: 60vh; overflow: hidden;
      background: var(--onyx-bg-elevated); border: 1px solid var(--onyx-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 48px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .03);
      display: flex; flex-direction: column;
    }
    .palette .sheet input {
      border: 0; outline: 0; background: transparent; color: var(--onyx-text);
      padding: var(--space-4); border-bottom: 1px solid var(--onyx-border); font-size: 15px;
    }
    .palette ul { list-style: none; margin: 0; padding: var(--space-2); overflow-y: auto; }
    .palette li {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
      padding: var(--space-3); border-radius: var(--radius-md); cursor: pointer;
    }
    .palette li[data-active="true"], .palette li:hover { background: var(--onyx-surface-hover); }
    .palette li .hint { color: var(--onyx-text-muted); font-size: 12px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
    @media (max-width: 1100px) { .rail { display: none; } }
    @media (max-width: 820px) { .app[data-collapsed="false"] .sidebar { width: var(--sidebar-rail); } }
  </style>
</head>
<body>
  <div class="app" id="app" data-collapsed="false" data-rail="open">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">O</span>
        <span class="name">ONYX</span>
      </div>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="collapse" type="button" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
          <span class="label">Collapse</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"><b>Dashboard</b></div>
        <button class="search" id="search" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span style="flex:1;text-align:left">Search files, shares, actions…</span>
          <kbd>⌘K</kbd>
        </button>
        <span class="spacer"></span>
        <span class="pill" id="status" title="System status"><span class="dot" id="status-dot"></span><span id="status-text">Checking…</span></span>
        <button class="icon-btn" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" id="rail-toggle" type="button" title="Toggle activity rail" aria-label="Toggle activity rail">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <span class="avatar" title="Signed in via Cerulean" aria-label="Account">O</span>
      </header>
      <main class="content" id="content"></main>
    </div>

    <!-- Activity rail -->
    <aside class="rail" aria-label="Activity">
      <h2>Activity</h2>
      <div class="events" id="events">
        <div class="event"><span class="dot ok" style="margin-top:5px"></span><div><div>System status endpoint connected</div><time id="ev-time">now</time></div></div>
        <div class="event"><span class="dot" style="margin-top:5px"></span><div><div>Snapshot, backup and app events stream here in v0.3</div><time>planned</time></div></div>
      </div>
    </aside>
  </div>

  <!-- Command palette -->
  <div class="palette" id="palette" data-open="false" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="sheet">
      <input id="palette-input" placeholder="Type a command…" autocomplete="off" spellcheck="false">
      <ul id="palette-list"></ul>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var I = function (d) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
    };
    var ICONS = {
      dashboard: I('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),
      files: I('<path d="M4 4h5l2 2h9v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>'),
      snapshots: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      backups: I('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>'),
      apps: I('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),
      shares: I('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/>'),
      users: I('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>'),
      settings: I('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>')
    };

    /* One place that defines the surfaces. Each view is a first slice of the
     * v0.2 "Flint" milestone; the data-heavy parts (file explorer, snapshot
     * timeline) fill in behind these shells. */
    var VIEWS = [
      { id: 'dashboard', label: 'Dashboard', icon: ICONS.dashboard, section: 'Home' },
      { id: 'files',     label: 'Files',     icon: ICONS.files,     section: 'Data' },
      { id: 'snapshots', label: 'Snapshots', icon: ICONS.snapshots, section: 'Data', badge: '0' },
      { id: 'backups',   label: 'Backups',   icon: ICONS.backups,   section: 'Data' },
      { id: 'apps',      label: 'Apps',      icon: ICONS.apps,      section: 'Platform' },
      { id: 'shares',    label: 'Shares',    icon: ICONS.shares,    section: 'Platform', badge: '0' },
      { id: 'users',     label: 'Users',     icon: ICONS.users,     section: 'Platform' },
      { id: 'settings',  label: 'Settings',  icon: ICONS.settings,  section: 'Platform' }
    ];

    var API = '/api/v1';

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ── nav ──────────────────────────────────────────────────────────── */
    function renderNav(active) {
      var html = '';
      var seen = '';
      VIEWS.forEach(function (v) {
        if (v.section !== seen) {
          seen = v.section;
          html += '<div class="section">' + esc(v.section) + '</div>';
        }
        html += '<a href="#/' + v.id + '"' + (v.id === active ? ' aria-current="page"' : '') + ' title="' + esc(v.label) + '">' +
          v.icon + '<span class="label">' + esc(v.label) + '</span>' +
          (v.badge ? '<span class="badge">' + esc(v.badge) + '</span>' : '') +
          '</a>';
      });
      document.getElementById('nav').innerHTML = html;
    }

    /* ── views ────────────────────────────────────────────────────────── */
    function card(title, body) { return '<div class="card"><h3>' + title + '</h3>' + body + '</div>'; }
    function stat(value, label) { return '<div class="stat">' + esc(value) + '</div><div class="sub">' + esc(label) + '</div>'; }
    function reserved(title, note) { return '<div class="card reserved"><h3>' + title + '</h3><div class="stat">' + esc(note) + '</div></div>'; }

    function viewDashboard() {
      return '<div class="page-head"><div><h1>Dashboard</h1><p>Health and capacity at a glance.</p></div>' +
        '<button class="btn primary" onclick="location.hash=\'#/files\'">Browse files</button></div>' +
        '<div class="grid">' +
        '<div class="card"><h3>Pools</h3><div class="stat" id="stat-pools">—</div><div class="sub">storage pools online</div></div>' +
        '<div class="card"><h3>Capacity</h3><div class="stat" id="stat-capacity">—</div><div class="sub">used of total</div></div>' +
        '<div class="card"><h3>Health</h3><div class="stat" id="stat-health">—</div><div class="sub">scrub &amp; device status</div></div>' +
        '<div class="card"><h3>Version</h3><div class="stat" id="stat-version">—</div><div class="sub">onyx-api</div></div>' +
        '</div>' +
        '<div class="grid" style="margin-top:16px">' +
        card('Next milestone', stat('v0.2 “Flint”', 'file explorer · SMB/NFS shares · users &amp; permissions')) +
        '</div>';
    }

    function viewFiles() {
      return '<div class="page-head"><div><h1>Files</h1><p>Browse pools, upload and share.</p></div>' +
        '<button class="btn primary" disabled title="Lands with the file explorer slice">Upload</button></div>' +
        '<div class="empty"><b>No pools mounted yet</b>Create a pool, then the file tree and explorer appear here.</div>';
    }

    function viewSimple(title, blurb, action) {
      return '<div class="page-head"><div><h1>' + esc(title) + '</h1><p>' + blurb + '</p></div></div>' +
        '<div class="empty"><b>' + esc(title) + '</b>' + esc(action) + '</div>';
    }

    function render(route) {
      var v = VIEWS.filter(function (x) { return x.id === route; })[0] || VIEWS[0];
      renderNav(v.id);
      document.getElementById('crumbs').innerHTML = '<span>ONYX</span><span>›</span><b>' + esc(v.label) + '</b>';

      var body;
      if (v.id === 'dashboard') body = viewDashboard();
      else if (v.id === 'files') body = viewFiles();
      else if (v.id === 'snapshots') body = viewSimple('Snapshots', 'Point-in-time copies with rollback.', 'Snapshot timeline and rollback land in v0.3 “Obsidian”.');
      else if (v.id === 'backups') body = viewSimple('Backups', 'Scheduled jobs to other stores.', 'Backup jobs and restore points land in v0.3 “Obsidian”.');
      else if (v.id === 'apps') body = viewSimple('Apps', 'Self-hosted apps on this host.', 'The app store and sandboxing land in v0.4 “Jade”.');
      else if (v.id === 'shares') body = viewSimple('Shares', 'SMB, NFS, WebDAV and SFTP shares.', 'Share management is part of the v0.2 “Flint” milestone.');
      else if (v.id === 'users') body = viewSimple('Users', 'Accounts and permissions.', 'User and permission management lands with v0.2 “Flint”.');
      else body = viewSimple('Settings', 'Theme, density and system preferences.', 'Preferences persist per user in v0.2.');
      document.getElementById('content').innerHTML = body;
      if (v.id === 'dashboard') loadStatusStats();
      document.title = 'ONYX — ' + v.label;
    }

    /* ── live status ──────────────────────────────────────────────────── */
    function setStatus(kind, text) {
      document.getElementById('status-dot').className = 'dot ' + kind;
      document.getElementById('status-text').textContent = text;
    }
    function loadStatus() {
      fetch(API + '/system/status', { headers: { accept: 'application/json' }, credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (s) {
          var healthy = (s.status || s.health || 'ok') + '';
          setStatus(/ok|healthy|degraded/i.test(healthy) ? 'ok' : 'warn', 'Operational');
          window.__onyxStatus = s;
          loadStatusStats();
        })
        .catch(function () { setStatus('err', 'API unreachable'); });
    }
    function loadStatusStats() {
      var s = window.__onyxStatus;
      if (!s) return;
      var set = function (id, val) { var el = document.getElementById(id); if (el && val != null) el.textContent = val; };
      set('stat-pools', s.pools != null ? s.pools : (s.poolCount != null ? s.poolCount : '—'));
      set('stat-capacity', s.capacity || s.used || '—');
      set('stat-health', s.status || s.health || '—');
      set('stat-version', s.version || '—');
    }

    /* ── command palette ──────────────────────────────────────────────── */
    var palette = document.getElementById('palette');
    var paletteInput = document.getElementById('palette-input');
    var paletteList = document.getElementById('palette-list');
    var paletteIndex = 0;

    function commands() {
      return VIEWS.map(function (v) {
        return { label: 'Go to ' + v.label, hint: v.section, run: function () { location.hash = '#/' + v.id; } };
      }).concat([
        { label: 'Toggle theme', hint: 'Appearance', run: toggleTheme },
        { label: 'Toggle activity rail', hint: 'Layout', run: function () {
          var app = document.getElementById('app');
          app.dataset.rail = app.dataset.rail === 'open' ? 'closed' : 'open';
        } }
      ]);
    }
    function renderPalette(query) {
      var q = query.trim().toLowerCase();
      var items = commands().filter(function (c) { return !q || c.label.toLowerCase().indexOf(q) !== -1; });
      paletteIndex = 0;
      paletteList.innerHTML = items.length ? items.map(function (c, i) {
        return '<li data-i="' + i + '"' + (i === 0 ? ' data-active="true"' : '') + '><span>' + esc(c.label) + '</span><span class="hint">' + esc(c.hint) + '</span></li>';
      }).join('') : '<li class="hint" style="justify-content:center">No matching commands</li>';
      paletteList.__items = items;
      Array.prototype.forEach.call(paletteList.querySelectorAll('li[data-i]'), function (li) {
        li.addEventListener('click', function () { runCommand(Number(li.dataset.i)); });
      });
    }
    function runCommand(i) {
      var items = paletteList.__items || [];
      if (!items[i]) return;
      closePalette();
      items[i].run();
    }
    function openPalette() { palette.dataset.open = 'true'; paletteInput.value = ''; renderPalette(''); paletteInput.focus(); }
    function closePalette() { palette.dataset.open = 'false'; }
    function movePalette(delta) {
      var lis = paletteList.querySelectorAll('li[data-i]');
      if (!lis.length) return;
      paletteIndex = (paletteIndex + delta + lis.length) % lis.length;
      Array.prototype.forEach.call(lis, function (li, i) { li.toggleAttribute('data-active', i === paletteIndex); });
    }

    /* ── theme ────────────────────────────────────────────────────────── */
    function toggleTheme() {
      var root = document.documentElement;
      var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('onyx.theme', next); } catch (e) {}
    }

    /* ── wiring ───────────────────────────────────────────────────────── */
    function route() {
      var id = (location.hash || '#/dashboard').replace(/^#\/?/, '');
      render(id || 'dashboard');
    }

    try {
      var saved = localStorage.getItem('onyx.theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      var collapsed = localStorage.getItem('onyx.sidebar');
      if (collapsed != null) document.getElementById('app').dataset.collapsed = collapsed;
    } catch (e) {}

    document.getElementById('collapse').addEventListener('click', function () {
      var app = document.getElementById('app');
      var next = app.dataset.collapsed === 'true' ? 'false' : 'true';
      app.dataset.collapsed = next;
      try { localStorage.setItem('onyx.sidebar', next); } catch (e) {}
    });
    document.getElementById('theme').addEventListener('click', toggleTheme);
    document.getElementById('rail-toggle').addEventListener('click', function () {
      var app = document.getElementById('app');
      app.dataset.rail = app.dataset.rail === 'open' ? 'closed' : 'open';
    });
    document.getElementById('search').addEventListener('click', openPalette);
    palette.addEventListener('click', function (e) { if (e.target === palette) closePalette(); });
    paletteInput.addEventListener('input', function () { renderPalette(paletteInput.value); });
    paletteInput.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); runCommand(paletteIndex); }
      else if (e.key === 'Escape') { closePalette(); }
    });
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); }
      else if (e.key === 'Escape' && palette.dataset.open === 'true') closePalette();
    });
    window.addEventListener('hashchange', route);

    route();
    loadStatus();
    setInterval(loadStatus, 30000);
  })();
  </script>
</body>
</html>
