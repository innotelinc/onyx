          var hidden = poolDevices.filter(function (device) {
            return (device.type === 'disk' || device.type === 'loop') && device.nodePresent === false;
          });
          poolDisks = poolDevices.filter(function (device) {
            if (device.type !== 'disk' && device.type !== 'loop') return false;
            if (device.state === 'detached') return false;
            if (device.nodePresent === false) return false;
            return diskMountState(device, poolDevices) !== 'host';
          });
          select.innerHTML = poolDisks.length ? '<option value="">Choose a disk…</option>' + poolDisks.map(function (device) {
            var mounts = diskMountState(device, poolDevices);
            var note = mounts === 'onyx' ? ' · mounted by Onyx — will be erased and re-mounted'
              : (device.type === 'loop' ? ' · loop device (file-backed scratch)'
                : (device.removable ? '' : ' · internal disk'));
            return '<option value="' + esc(device.name) + '">' + esc(device.path + ' · ' + formatBytes(device.sizeBytes) + (device.label ? ' · ' + device.label : '') + note) + '</option>';
          }).join('') : '<option value="">No poolable disks detected</option>';
          if (hidden.length) {
            var hiddenWarning = document.getElementById('pool-warning');
            if (hiddenWarning) hiddenWarning.textContent = hidden.length + ' disk(s) are hidden because Onyx cannot open them: ' + hidden.map(function (d) { return d.path || '/dev/' + d.kname; }).join(', ') + '. Device nodes are missing from the data plane containers — bind /dev into onyx-privd and onyx-storaged, then refresh.';
          }
        }).catch(showError);
        document.getElementById('pool-defaults').addEventListener('click', function () {
          document.getElementById('pool-name').value = 'main-pool';
          document.getElementById('pool-mount-name').value = '';
          document.getElementById('pool-fs').value = 'btrfs';
          document.getElementById('pool-auto-mount').checked = true;
          document.getElementById('pool-force').checked = true;
          var warning = document.getElementById('pool-warning');
          if (warning) warning.textContent = 'Defaults restored: label main-pool, Btrfs, mounted at /mnt/onyx/main-pool, force unmount and erase enabled.';
        });
        document.getElementById('pool-preview').addEventListener('click', function () {
          var device = document.getElementById('pool-device').value;
          var name = document.getElementById('pool-name').value.trim() || 'main-pool';
          var fsType = document.getElementById('pool-fs').value;
          var mountName = document.getElementById('pool-mount-name').value.trim() || name;
          var autoMount = document.getElementById('pool-auto-mount').checked;
          var force = document.getElementById('pool-force').checked;
          var warning = document.getElementById('pool-warning');
          if (!device) { warning.textContent = 'Choose a whole disk first.'; return; }
          var selected = poolDisks.filter(function (d) { return d.name === device; })[0];
          var path = selected ? selected.path : '/dev/' + device;
          var remountNote = selected && diskMountState(selected, poolDevices) === 'onyx' ? ' It is mounted by Onyx right now and will be unmounted first (forced if busy).' : '';
          warning.innerHTML = '<b>Destructive preview:</b> format ' + esc(path) + ' as ' + esc(fsType) + ' with label ' + esc(name) + (force ? ' (force enabled)' : '') + '. ' + (autoMount ? 'It will be mounted at /mnt/onyx/' + esc(mountName) + '.' : 'It will remain unmounted after formatting.') + remountNote + ' Existing partitions and files will be erased. Click <b>Create pool</b> only after verifying the disk and backup.';
          var button = document.getElementById('pool-preview');
          button.textContent = 'Create pool';
          button.classList.add('primary');
          button.onclick = function () {
            if (!confirm('Format ' + path + ' as ' + fsType + ' and erase all existing data? This cannot be undone.')) return;
            button.disabled = true;
            button.textContent = 'Creating…';              apiJSON('/pools', { method: 'POST', body: JSON.stringify({ device: device, name: name, fs_type: fsType, force: force, auto_mount: autoMount, mount_name: mountName }) })
              .then(function (pool) {
                warning.innerHTML = '<b>Pool created:</b> ' + esc(pool.name || name) + '. It is mounted at /mnt/onyx/' + esc(mountName) + ' and ready for Files.';
                button.textContent = 'Pool created';
                refreshStorage();
              })
              .catch(function (err) {
                button.disabled = false;
                button.textContent = 'Create pool';
                showError(err);
              });
          };
        });
      }
      if (v.id === 'files') {
        document.getElementById('folder-create').addEventListener('click', function () { var name = prompt('New folder name'); if (!name) return; var parent = window.__onyxFilePath || ''; var next = parent ? parent + '/' + name : name; apiJSON('/files/mkdir', { method: 'POST', body: JSON.stringify({ path: next }) }).then(function () { loadFiles(parent); }).catch(showError); });
        document.getElementById('backup-drive').addEventListener('click', function () { createBackup(window.__onyxFilePath || ''); });
        document.getElementById('file-upload-button').addEventListener('click', function () { document.getElementById('file-upload-input').click(); });
        document.getElementById('file-upload-input').addEventListener('change', function (event) { var file = event.target.files[0]; if (!file) return; var form = new FormData(); form.append('file', file); var path = window.__onyxFilePath || ''; fetch(API + '/files/upload' + (path ? '?path=' + encodeURIComponent(path) : ''), { method: 'POST', body: form, credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : r.json().then(function (e) { return Promise.reject(e); }); }).then(function () { loadFiles(path); event.target.value = ''; }).catch(showError); });
        loadFiles('');
        loadStorageOverview().catch(function () {});
        loadTrash();
      }
      if (v.id === 'snapshots') {
        document.getElementById('snapshot-create').addEventListener('click', function () {
          var button = this;
          var note = document.getElementById('snapshot-note');
          var pool = document.getElementById('snapshot-pool').value;
          var subvolume = document.getElementById('snapshot-subvolume').value.trim();
          if (!pool || !subvolume) {
            if (note) { note.textContent = 'Choose a pool and name the subvolume to snapshot.'; note.style.color = 'var(--bad)'; }
            return;
          }
          button.disabled = true;
          button.textContent = 'Creating…';
          apiJSON('/snapshots', { method: 'POST', body: JSON.stringify({ pool: pool, subvolume: subvolume }) })
            .then(function () {
              toast('Snapshot created on ' + pool);
              document.getElementById('snapshot-subvolume').value = '';
              button.disabled = false;
              button.textContent = 'Create snapshot';
              return loadSnapshots();
            })
            .catch(function (err) { button.disabled = false; button.textContent = 'Create snapshot'; showError(err); });
        });
        loadSnapshotPools();
        loadSnapshots();
      }
      if (id === 'scrub') {
        loadScrub();
        var scrubRefresh = document.getElementById('scrub-refresh');
        if (scrubRefresh) scrubRefresh.addEventListener('click', function () {
          scrubRefresh.disabled = true;
          scrubRefresh.textContent = 'Refreshing…';
          loadScrub().then(function () { scrubRefresh.disabled = false; scrubRefresh.textContent = 'Refresh'; });
        });
      }
      if (v.id === 'shares') {
        loadSharePaths();
        document.getElementById('share-create').addEventListener('click', function () {
          var name = document.getElementById('share-name').value.trim();
          var relativePath = document.getElementById('share-path').value;
          var protocols = [];
          if (document.getElementById('share-smb').checked) protocols.push('smb');
          if (document.getElementById('share-nfs').checked) protocols.push('nfs');
          if (document.getElementById('share-ftp').checked) protocols.push('ftp');
          if (document.getElementById('share-sftp').checked) protocols.push('sftp');
          if (document.getElementById('share-webdav').checked) protocols.push('webdav');
          if (document.getElementById('share-rsync').checked) protocols.push('rsync');
          if (!name || !relativePath || !protocols.length) {
            showError({ error: { message: 'Choose a name, storage folder, and at least one protocol.' } });
            return;
          }

            .then(function (bucket) {

              button.disabled = false; button.textContent = 'Create bucket';

      if (v.id === 'users') {

      if (v.id === 'settings') {

        if (themeSelect) {

    /* ── live status ──────────────────────────────────────────────────── */
    function setStatus(kind, text) {
      var dot = document.getElementById('status-dot');
      var label = document.getElementById('status-text');
      if (dot) dot.className = 'dot ' + kind;
      if (label) label.textContent = text;
      var pill = document.getElementById('status');
      if (pill) pill.title = 'System status: ' + text;
    }
    function loadStatus() {
      return fetch(API + '/system/status', { headers: { accept: 'application/json' }, credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (s) {
          var services = Array.isArray(s.services) ? s.services : [];
          var serving = services.filter(function (service) { return service.status === 'SERVING'; }).length;
          var healthy = services.length > 0 && serving === services.length;
          setStatus(healthy ? 'ok' : 'warn', services.length ? serving + '/' + services.length + ' services' : 'Checking services');
          window.__onyxStatus = s;
          window.__onyxServiceHealth = { serving: serving, total: services.length };
          return loadStatusStats();
        })
        .catch(function () {
          setStatus('err', 'API unreachable');
          var attention = document.getElementById('overview-attention');
          if (attention) attention.innerHTML = '<div class="attention attention--bad"><span class="attention__dot"></span><span><b>The gateway did not answer</b><small>Capacity and pool state cannot be trusted until it does.</small></span><a class="attention__go" href="#/settings">Settings</a></div>';
        });
    }

    function whenLabel(ts) {
      if (!ts) return 'unknown';
      var t = new Date(String(ts).includes('T') ? ts : String(ts).replace(' ', 'T') + 'Z');
      if (isNaN(t.getTime())) return String(ts);
      var seconds = Math.max(0, (Date.now() - t.getTime()) / 1000);
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
      if (seconds < 7 * 86400) return Math.floor(seconds / 86400) + 'd ago';
      return t.toLocaleDateString();
    }

    // Pools and capacity are the *data plane's* answer, not the control plane's:
    // /system/status only reports the daemons. Asking the same two endpoints the
    // Storage and Files pages use is what keeps the overview from contradicting
    // either of them. The access trail is read beside them so "needs attention"
    // can include a share that is refusing people, not just a disk that is full.
    function loadStatusStats() {
      var s = window.__onyxStatus || {};
      var set = function (id, val) {
        if (val == null) return;
        var el = document.getElementById(id);
        if (el) el.textContent = val;
      };
      var health = window.__onyxServiceHealth || { serving: 0, total: 0 };
      set('stat-health', health.total ? health.serving + '/' + health.total : '—');
      set('stat-health-kpi', health.total ? health.serving + ' / ' + health.total : '—');
      // `version` is the gateway release; `coreVersion` is what the core daemon
      // reported. Prefer the former so a partial rollout still names the platform
      // release the operator deployed.
      var version = s.version || s.coreVersion || '—';
      set('stat-version', version);
      set('overview-version', s.codename ? 'ONYX ' + version + ' · ' + s.codename + (s.commit ? ' · ' + String(s.commit).slice(0, 8) : '') : 'ONYX ' + version);

      var servicesBox = document.getElementById('overview-services');
      if (servicesBox) {
        var services = Array.isArray(s.services) ? s.services : [];
        servicesBox.innerHTML = services.length ? services.map(function (service) {
          var ok = service.status === 'SERVING';
          return '<div class="health-row"><span class="dot ' + (ok ? 'ok' : 'warn') + '"></span><b>' + esc(service.name || 'service') + '</b><span>' + esc(service.version || service.status || '') + '</span></div>';
        }).join('') : '<div class="sub">No daemon reported a status.</div>';
      }

      var pools = apiJSON('/pools').catch(function () { return {}; });
      var overview = apiJSON('/storage/overview').catch(function () { return {}; });
      var trail = apiJSON('/audit/access?limit=8').catch(function () { return { events: [] }; });
      return Promise.all([pools, overview, trail]).then(function (parts) {
        var rows = parts[0].pools || [];
        var ov = parts[1] || {};
        var events = parts[2].events || [];
        // /pools already reports a mounted pool as online: the API reconciles the
        // registry snapshot against the live mount before it answers. Counting
        // that served state directly — rather than re-joining the overview here —
        // is what keeps this card, the Storage page and Files from drifting.
        var online = rows.filter(function (p) {
          return String(p.state || '').toLowerCase() !== 'offline';
        });
        var total = Number(ov.total_bytes || 0), free = Number(ov.free_bytes || 0);
        var used = Math.max(0, total - free);
        set('stat-pools', String(online.length));
        set('stat-pools-kpi', online.length + ' / ' + rows.length);
        set('stat-pools-sub', rows.length
          ? online.length + ' online · ' + (rows.length - online.length) + ' offline'
          : 'no pools configured');
        if (total > 0) {
          var pct = Math.round((used / total) * 100);
          set('stat-capacity', formatBytes(used));
          set('stat-capacity-kpi', formatBytes(used));
          set('stat-capacity-sub', (ov.primary ? 'Mounted on ' + ov.primary.name + '. ' : '') + formatBytes(free) + ' free of ' + formatBytes(total) + '.');
          set('overview-free', formatBytes(free));
          set('overview-capacity-pct', pct + '%');
          set('overview-capacity-title', (ov.primary ? ov.primary.name : 'Storage') + ' is ' + pct + '% full');
          var ring = document.getElementById('overview-capacity-ring');
          if (ring) {
            ring.style.setProperty('--used', String(pct));
            ring.setAttribute('aria-label', pct + '% of ' + formatBytes(total) + ' used, ' + formatBytes(free) + ' free');
          }
        } else {
          set('stat-capacity', 'None');
          set('stat-capacity-kpi', 'None');
          set('stat-capacity-sub', 'No pool is mounted. Create one on the Storage page to start using Files.');
          set('overview-free', '—');
          set('overview-capacity-pct', '—');
          set('overview-capacity-title', 'No storage mounted');
        }

        var poolsBox = document.getElementById('overview-pools');
        if (poolsBox) {
          poolsBox.innerHTML = rows.length ? rows.map(function (pool) {
            var ptotal = Number(pool.totalBytes || 0), pused = Number(pool.usedBytes || 0);
            var ppct = ptotal > 0 ? Math.min(100, Math.round((pused / ptotal) * 100)) : 0;
            var offline = String(pool.state || '').toLowerCase() === 'offline';
            return '<div class="pool-strip"><span class="dot ' + (offline ? 'err' : 'ok') + '"></span><span class="grow"><b>' + esc(pool.name) + '</b><small>' + formatBytes(pused) + ' of ' + formatBytes(ptotal) + ' · ' + esc(pool.fsType || 'unknown') + ' · ' + esc(pool.state || 'unknown') + '</small></span>' +
              '<span class="badge">' + ppct + '%</span><a class="btn" href="#/storage">Inspect</a></div>';
          }).join('') : '<div class="empty"><b>No pools yet</b>Attach a disk or create a pool on the Storage page.</div>';
        }

        var attention = [];
        if (!health.total) attention.push(['attention', 'No service status', 'The gateway answered but reported no daemons.', '#/settings']);
        else if (health.serving < health.total) attention.push(['bad', (health.total - health.serving) + ' service(s) not serving', 'Open the service detail below for names and versions.', '#/settings']);
        rows.filter(function (p) { return String(p.state || '').toLowerCase() === 'offline'; }).forEach(function (p) {
          attention.push(['bad', p.name + ' is offline', 'Its mount is missing; the pool cannot serve files until it is back.', '#/storage']);
        });
        (ov.warnings || []).forEach(function (warning) {
          attention.push(['attention', 'Storage notice', warning, '#/storage']);
        });
        if (!rows.length && total === 0) attention.push(['attention', 'No storage mounted', 'Create a pool or attach a device to start using Files.', '#/storage']);
        if (total > 0 && used / total > 0.85) attention.push(['attention', 'Capacity above 85%', 'Free space or add a pool before writes start failing.', '#/storage']);
        var denied = events.filter(function (event) { return event.kind === 'denied'; }).length;
        if (denied > 0) attention.push(['info', denied + ' refused request(s) in the recent trail', 'A share is being reached without permission; the audit page names who.', '#/audit']);
        var attentionBox = document.getElementById('overview-attention');
        if (attentionBox) {
          attentionBox.innerHTML = attention.length ? attention.slice(0, 6).map(function (row) {
            return '<a class="attention attention--' + row[0] + '" href="' + esc(row[3]) + '"><span class="attention__dot"></span><span><b>' + esc(row[1]) + '</b><small>' + esc(row[2]) + '</small></span><span class="attention__go">Open</span></a>';
          }).join('') : '<div class="attention attention--info" style="background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)"><span class="attention__dot" style="background:var(--ok)"></span><span><b>Nothing needs attention</b><small>Every daemon is serving, every pool is online and the recent trail has no refusals.</small></span></div>';
        }

        var activityBox = document.getElementById('overview-activity');
        if (activityBox) {
          activityBox.innerHTML = events.length ? events.map(function (event) {
            var verb = event.kind === 'denied' ? 'was refused' : (event.kind === 'revoke' ? 'lost access to' : 'was granted');
            var subject = event.share ? ' ' + esc(event.share) : '';
            var detail = event.mode || event.method || '';
            return '<div class="activity-row"><span class="dot ' + (event.kind === 'denied' ? 'err' : 'ok') + '" style="margin-top:5px"></span><span><b>' + esc(event.username || 'unknown') + '</b> ' + esc(verb) + subject + (detail ? ' <span class="tag">' + esc(String(detail)) + '</span>' : '') + '</span><time>' + esc(whenLabel(event.ts)) + '</time></div>';
          }).join('') : '<div class="empty"><b>No access events yet</b>Grant changes and refused requests appear here as they happen.</div>';
        }

        var stamp = document.getElementById('dashboard-updated');
        if (stamp) stamp.textContent = 'Updated ' + new Date().toLocaleTimeString();
      });
    }

    /* ── command palette ──────────────────────────────────────────────── */
    var palette = document.getElementById('palette');
    var paletteInput = document.getElementById('palette-input');
    var paletteList = document.getElementById('palette-list');
    var paletteIndex = 0;

    // The palette is one entry point for three kinds of thing: a page, an
    // action, and — once there is a query — a search of the pool. Keeping them
    // together is what makes Cmd/Ctrl+K useful: the operator does not have to
    // decide first which of the three they want.
    function commands(query) {
      var q = String(query || '').trim();
      var items = VIEWS.map(function (v) {
        return { label: 'Go to ' + v.label, hint: v.section, terms: v.sub || '', run: function () { location.hash = '#/' + v.id; } };
      });
      items.push({ label: 'Scrub scheduling', hint: 'Storage', terms: 'checksum scrub pool', run: function () { location.hash = '#/scrub'; } });
      items.push({ label: 'Collapse or expand the rail', hint: 'Layout', terms: 'sidebar navigation', run: function () { setRail(!railCollapsed(), true); } });
      items.push({ label: 'Switch light / dark / system theme', hint: 'Appearance', terms: 'mode dark light system', run: toggleTheme });
      items.push({ label: 'Open Cerulean Authentik', hint: 'Identity', terms: 'users sso identity', run: function () { window.open('https://auth.onyx.innotel.us/if/admin/', '_blank', 'noopener'); } });
      if (q) {
        items.push({ label: 'Search files for "' + q + '"', hint: 'Search', terms: 'find pool file', run: function () {
          try { sessionStorage.setItem('onyx.searchQuery', q); } catch (e) {}
          // Setting the hash fires `hashchange`, which renders once. Rendering
          // here as well consumed the pending query and then reset the page.
          var already = (location.hash || '').replace(/^#\/?/, '') === 'search';
          location.hash = '#/search';
          if (already) render('search');
        } });
      }
      return items;
    }

    function renderPalette(query) {
      var q = query.trim().toLowerCase();
      var items = commands(query).filter(function (c) {
        return !q || (c.label + ' ' + c.hint + ' ' + (c.terms || '')).toLowerCase().indexOf(q) !== -1;
      });
      paletteIndex = 0;
      paletteList.innerHTML = items.length ? items.map(function (c, i) {
        return '<li data-i="' + i + '" role="option" aria-selected="' + (i === 0 ? 'true' : 'false') + '"' + (i === 0 ? ' data-active="true"' : '') + '><span>' + esc(c.label) + '</span><span class="hint">' + esc(c.hint) + '</span></li>';
      }).join('') : '<li class="hint" style="justify-content:center">No matching commands</li>';
      paletteList.__items = items;
      Array.prototype.forEach.call(paletteList.querySelectorAll('li[data-i]'), function (li) {
        li.addEventListener('click', function () { runCommand(Number(li.dataset.i)); });
      });
    }
    function runCommand(i) {
      var items = paletteList.__items || [];
      if (!items[i]) return;
      closePalette();
      items[i].run();
    }
    function openPalette() {
      palette.dataset.open = 'true';
      document.body.classList.add('no-scroll');
      paletteInput.value = '';
      renderPalette('');
      paletteInput.focus();
    }
    function closePalette() {
      palette.dataset.open = 'false';
      document.body.classList.remove('no-scroll');
    }
    function movePalette(delta) {
      var lis = paletteList.querySelectorAll('li[data-i]');
      if (!lis.length) return;
      paletteIndex = (paletteIndex + delta + lis.length) % lis.length;
      Array.prototype.forEach.call(lis, function (li, i) {
        li.toggleAttribute('data-active', i === paletteIndex);
        li.setAttribute('aria-selected', i === paletteIndex ? 'true' : 'false');
      });
      lis[paletteIndex].scrollIntoView({ block: 'nearest' });
    }

    /* ── theme ────────────────────────────────────────────────────────── */
    // UnityTheme owns the stored mode and the <html> attributes; the console
    // only cycles it and keeps its own button honest about which mode is next.
    function syncThemeButton() {
      var button = document.getElementById('theme');
      if (!button) return;
      var mode = window.UnityTheme ? window.UnityTheme.mode() : 'system';
      button.title = 'Theme: ' + mode + ' (click for ' + (mode === 'system' ? 'light' : mode === 'light' ? 'dark' : 'system') + ')';
      button.setAttribute('aria-label', button.title);
      button.dataset.mode = mode;
    }
    function toggleTheme() {
      if (window.UnityTheme) window.UnityTheme.cycle();
      else {
        var root = document.documentElement;
        var next = root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-mode', next);
      }
      syncThemeButton();
      toast('Theme: ' + (window.UnityTheme ? window.UnityTheme.mode() : document.documentElement.getAttribute('data-mode')));
    }

    /* ── rail ─────────────────────────────────────────────────────────── */
    // The left rail is the only navigation and the only collapse control. On a
    // phone it is an off-canvas drawer; on a desktop it folds to icons. The
    // preference is per browser and survives a reload.
    function railCollapsed() {
      return document.getElementById('app').classList.contains('rail-collapsed');
    }
    function setRail(collapsed, persist) {
      var app = document.getElementById('app');
      app.classList.toggle('rail-collapsed', !!collapsed);
      var toggle = document.getElementById('rail-toggle');
      if (toggle) {
        toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        var label = toggle.querySelector('span');
        if (label) label.textContent = collapsed ? 'Expand rail' : 'Collapse rail';
      }
      var menu = document.getElementById('menu-toggle');
      if (menu) menu.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      if (persist) {
        try { localStorage.setItem('onyx.rail', collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      }
    }

    function route() {
      var id = (location.hash || '#/overview').replace(/^#\/?/, '');
      if (!id) id = 'overview';
      if (window.innerWidth <= 900 && !railCollapsed()) setRail(true, false);
      render(id);
    }

    try {
      var storedRail = localStorage.getItem('onyx.rail');
      if (storedRail === 'collapsed') setRail(true, false);
      else if (storedRail === 'expanded') setRail(false, false);
      else if (window.innerWidth <= 900) setRail(true, false);
    } catch (e) {}
    syncThemeButton();

    document.getElementById('rail-toggle').addEventListener('click', function () { setRail(!railCollapsed(), true); });
    document.getElementById('menu-toggle').addEventListener('click', function () { setRail(!railCollapsed(), false); });
    document.getElementById('scrim').addEventListener('click', function () { setRail(true, false); });
    document.getElementById('theme').addEventListener('click', toggleTheme);
    document.getElementById('command-trigger').addEventListener('click', openPalette);
    palette.addEventListener('click', function (e) { if (e.target === palette) closePalette(); });
    paletteInput.addEventListener('input', function () { renderPalette(paletteInput.value); });
    paletteInput.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); runCommand(paletteIndex); }
      else if (e.key === 'Escape') { closePalette(); }
    });
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); }
      else if ((e.metaKey || e.ctrlKey) && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); setRail(!railCollapsed(), true); }
      else if (e.key === 'Escape' && palette.dataset.open === 'true') closePalette();
      else if (e.key === 'Escape' && window.innerWidth <= 900 && !railCollapsed()) setRail(true, false);
    });
    window.addEventListener('hashchange', route);
    window.addEventListener('unity:theme', syncThemeButton);

    route();
    loadStatus();
    setInterval(loadStatus, 30000);
  })();
  </script>
</body>
</html>
