    function render(route) {
      var v = VIEWS.filter(function (x) { return x.id === route; })[0] || VIEWS[0];
      renderNav(v.id);
      document.getElementById('crumbs').innerHTML = '<span>ONYX</span><span>›</span><b>' + esc(v.label) + '</b>';

      var body;
      if (v.id === 'dashboard') body = viewDashboard();
      else if (v.id === 'files') body = viewFiles();
      else if (v.id === 'storage') body = viewStorage();
      else if (v.id === 'snapshots') body = viewSnapshots();
      else if (v.id === 'backups') body = viewBackups();
      else if (v.id === 'scrub') body = viewScrub();
      else if (v.id === 'apps') body = viewApps();
      else if (v.id === 'vms') body = viewVMs();
      else if (v.id === 'objects') body = viewObjects();
      else if (v.id === 'shares') body = viewShares();
      else if (v.id === 'users') body = viewUsers();
      else if (v.id === 'settings') body = viewSettings();
      else body = viewSimple('Settings', 'Theme, density and system preferences.', 'Preferences persist per user.');
      document.getElementById('content').innerHTML = body;
      if (v.id === 'dashboard') loadStatusStats();
      if (v.id === 'storage') {
        document.getElementById('storage-refresh').addEventListener('click', refreshStorage);
        refreshStorage();
        // Disks offered for pool creation: any whole device (a whole disk or a
        // loop device) plus disks Onyx already mounted — re-creating a pool
        // unmounts them, erases them and mounts them again in place. The one
        // hard exclusion is a device the host mounted outside /mnt/onyx: it
        // holds somebody else's data, and creating a pool would erase it.
        // Internal (non-removable) disks are offered and labelled, because on
        // most machines they are the only disks there are; the label is what
        // makes the destructive step deliberate.
        var poolDisks = [];
        var poolDevices = [];
        apiJSON('/devices').then(function (data) {
          var select = document.getElementById('pool-device');
          poolDevices = data.devices || [];
          // `nodePresent === false` means the data plane cannot open the device:
          // offering it would produce a failed erase after the confirmation, so
          // it is left out and explained instead.
          var hidden = poolDevices.filter(function (device) {
            return (device.type === 'disk' || device.type === 'loop') && device.nodePresent === false;
          });
          poolDisks = poolDevices.filter(function (device) {
            if (device.type !== 'disk' && device.type !== 'loop') return false;
            if (device.state === 'detached') return false;
            if (device.nodePresent === false) return false;
            return diskMountState(device, poolDevices) !== 'host';
          });
          select.innerHTML = poolDisks.length ? '<option value="">Choose a disk…</option>' + poolDisks.map(function (device) {
            var mounts = diskMountState(device, poolDevices);
            var note = mounts === 'onyx' ? ' · mounted by Onyx — will be erased and re-mounted'
              : (device.type === 'loop' ? ' · loop device (file-backed scratch)'
                : (device.removable ? '' : ' · internal disk'));
            return '<option value="' + esc(device.name) + '">' + esc(device.path + ' · ' + formatBytes(device.sizeBytes) + (device.label ? ' · ' + device.label : '') + note) + '</option>';
          }).join('') : '<option value="">No poolable disks detected</option>';
          if (hidden.length) {
            var hiddenWarning = document.getElementById('pool-warning');
            if (hiddenWarning) hiddenWarning.textContent = hidden.length + ' disk(s) are hidden because Onyx cannot open them: ' + hidden.map(function (d) { return d.path || '/dev/' + d.kname; }).join(', ') + '. Device nodes are missing from the data plane containers — bind /dev into onyx-privd and onyx-storaged, then refresh.';
          }
        }).catch(showError);
        document.getElementById('pool-defaults').addEventListener('click', function () {
          document.getElementById('pool-name').value = 'main-pool';
          document.getElementById('pool-mount-name').value = '';
          document.getElementById('pool-fs').value = 'btrfs';
          document.getElementById('pool-auto-mount').checked = true;
          document.getElementById('pool-force').checked = true;
          var warning = document.getElementById('pool-warning');
          if (warning) warning.textContent = 'Defaults restored: label main-pool, Btrfs, mounted at /mnt/onyx/main-pool, force unmount and erase enabled.';
        });
        document.getElementById('pool-preview').addEventListener('click', function () {
          var device = document.getElementById('pool-device').value;
          var name = document.getElementById('pool-name').value.trim() || 'main-pool';
          var fsType = document.getElementById('pool-fs').value;
          var mountName = document.getElementById('pool-mount-name').value.trim() || name;
          var autoMount = document.getElementById('pool-auto-mount').checked;
          var force = document.getElementById('pool-force').checked;
          var warning = document.getElementById('pool-warning');
          if (!device) { warning.textContent = 'Choose a whole disk first.'; return; }
          var selected = poolDisks.filter(function (d) { return d.name === device; })[0];
          var path = selected ? selected.path : '/dev/' + device;
          var remountNote = selected && diskMountState(selected, poolDevices) === 'onyx' ? ' It is mounted by Onyx right now and will be unmounted first (forced if busy).' : '';
          warning.innerHTML = '<b>Destructive preview:</b> format ' + esc(path) + ' as ' + esc(fsType) + ' with label ' + esc(name) + (force ? ' (force enabled)' : '') + '. ' + (autoMount ? 'It will be mounted at /mnt/onyx/' + esc(mountName) + '.' : 'It will remain unmounted after formatting.') + remountNote + ' Existing partitions and files will be erased. Click <b>Create pool</b> only after verifying the disk and backup.';
          var button = document.getElementById('pool-preview');
          button.textContent = 'Create pool';
          button.classList.add('primary');
          button.onclick = function () {
            if (!confirm('Format ' + path + ' as ' + fsType + ' and erase all existing data? This cannot be undone.')) return;
            button.disabled = true;
            button.textContent = 'Creating…';              apiJSON('/pools', { method: 'POST', body: JSON.stringify({ device: device, name: name, fs_type: fsType, force: force, auto_mount: autoMount, mount_name: mountName }) })
              .then(function (pool) {
                warning.innerHTML = '<b>Pool created:</b> ' + esc(pool.name || name) + '. It is mounted at /mnt/onyx/' + esc(mountName) + ' and ready for Files.';
                button.textContent = 'Pool created';
                refreshStorage();
              })
              .catch(function (err) {
                button.disabled = false;
                button.textContent = 'Create pool';
                showError(err);
              });
          };
        });
      }
      if (v.id === 'files') {
        document.getElementById('folder-create').addEventListener('click', function () { var name = prompt('New folder name'); if (!name) return; var parent = window.__onyxFilePath || ''; var next = parent ? parent + '/' + name : name; apiJSON('/files/mkdir', { method: 'POST', body: JSON.stringify({ path: next }) }).then(function () { loadFiles(parent); }).catch(showError); });
        document.getElementById('backup-drive').addEventListener('click', function () { createBackup(window.__onyxFilePath || ''); });
        document.getElementById('file-upload-button').addEventListener('click', function () { document.getElementById('file-upload-input').click(); });
        document.getElementById('file-upload-input').addEventListener('change', function (event) { var file = event.target.files[0]; if (!file) return; var form = new FormData(); form.append('file', file); var path = window.__onyxFilePath || ''; fetch(API + '/files/upload' + (path ? '?path=' + encodeURIComponent(path) : ''), { method: 'POST', body: form, credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : r.json().then(function (e) { return Promise.reject(e); }); }).then(function () { loadFiles(path); event.target.value = ''; }).catch(showError); });
        loadFiles('');
        loadStorageOverview().catch(function () {});
        loadTrash();
      }
      if (v.id === 'snapshots') {
        document.getElementById('snapshot-create').addEventListener('click', function () {
          var pool = prompt('Pool name');
          var subvolume = prompt('Source subvolume (for example @data/media)');
          if (!pool || !subvolume) return;
          apiJSON('/snapshots', { method: 'POST', body: JSON.stringify({ pool: pool, subvolume: subvolume }) }).then(loadSnapshots).catch(showError);
        });
        loadSnapshots();
      }
      if (v.id === 'scrub') {
        document.getElementById('scrub-configure').addEventListener('click', function () {
          var pool = prompt('Pool name');
          if (!pool) return;
          apiJSON('/pools/' + encodeURIComponent(pool) + '/scrub-schedule').then(function (schedule) {
            var frequency = prompt('Frequency: weekly or monthly', schedule.frequency || 'weekly');
            if (!frequency) return;
            apiJSON('/pools/' + encodeURIComponent(pool) + '/scrub-schedule', { method: 'PUT', body: JSON.stringify({ enabled: true, frequency: frequency, hour: 2 }) }).then(function (saved) {
              document.getElementById('scrub-status').innerHTML = '<h3>' + esc(saved.pool) + '</h3><p class="sub">' + esc(saved.frequency) + ' at ' + esc(String(saved.hour)) + ':00 UTC · next run ' + esc(saved.next_run || 'pending') + '</p><button class="btn" id="scrub-run">Run now</button>';
              document.getElementById('scrub-run').addEventListener('click', function () { apiJSON('/pools/' + encodeURIComponent(pool) + '/scrub', { method: 'POST' }).then(function () { alert('Scrub queued'); }).catch(showError); });
            }).catch(showError);
          }).catch(showError);
        });
      }
      if (v.id === 'shares') {
        loadSharePaths();
        document.getElementById('share-create').addEventListener('click', function () {
          var name = document.getElementById('share-name').value.trim();
          var relativePath = document.getElementById('share-path').value;
          var protocols = [];
          if (document.getElementById('share-smb').checked) protocols.push('smb');
          if (document.getElementById('share-nfs').checked) protocols.push('nfs');
          if (document.getElementById('share-ftp').checked) protocols.push('ftp');
          if (document.getElementById('share-sftp').checked) protocols.push('sftp');
          if (document.getElementById('share-webdav').checked) protocols.push('webdav');
          if (document.getElementById('share-rsync').checked) protocols.push('rsync');
          if (!name || !relativePath || !protocols.length) {
            showError({ error: { message: 'Choose a name, storage folder, and at least one protocol.' } });
            return;
          }
          apiJSON('/shares', { method: 'POST', body: JSON.stringify({ name: name, path: '/mnt/onyx/' + relativePath, comment: document.getElementById('share-comment').value.trim(), readonly: document.getElementById('share-readonly').checked, protocols: protocols }) }).then(loadShares).catch(showError);
        });
        loadShares();
        // Cloud/remote storage setup lives on this page too.
        loadRemoteProviders();
        loadRemoteTargets();
        document.getElementById('remote-save').addEventListener('click', function () {
          var status = document.getElementById('remote-status');
          var params = {};
          Array.prototype.forEach.call(document.querySelectorAll('[data-remote-field]'), function (input) {
            var value = input.value.trim();
            if (value) params[input.dataset.remoteField] = value;
          });
          var body = { name: document.getElementById('remote-name').value.trim(), type: document.getElementById('remote-provider').value, params: params };
          if (!body.name || !body.type) {
            showError({ error: { message: 'A target name and a provider are required.' } });
            return;
          }
          if (status) status.textContent = 'Saving target…';
          apiJSON('/storage/remotes', { method: 'POST', body: JSON.stringify(body) }).then(function (result) {
            if (status) status.textContent = 'Saved ' + result.name + ' (' + result.type + ').' + (result.next_step ? ' ' + result.next_step : '');
            document.getElementById('remote-name').value = '';
            loadRemoteTargets();
          }).catch(showError);
        });
        document.getElementById('remote-clone').addEventListener('click', function () {
          var status = document.getElementById('remote-status');
          var source = document.getElementById('remote-clone-source').value.trim().replace(/^\/+/, '');
          var remote = document.getElementById('remote-clone-target').value;
          if (!source || !remote) {
            showError({ error: { message: 'Choose a storage folder and a configured target.' } });
            return;
          }
          if (status) status.textContent = 'Cloning ' + source + ' to ' + remote + '…';
          apiJSON('/storage/clone', { method: 'POST', body: JSON.stringify({ source: source, remote: remote, dest: document.getElementById('remote-clone-dest').value.trim() }) }).then(function (result) {
            if (status) status.textContent = 'Cloned ' + result.source + ' to ' + result.target + '. ' + (result.detail || '');
          }).catch(showError);
        });
      }
      if (v.id === 'apps') {
        document.getElementById('apps-refresh').addEventListener('click', refreshApps);
        refreshApps();
      }
      if (v.id === 'vms') {
        document.getElementById('vms-refresh').addEventListener('click', refreshVMs);
        document.getElementById('vm-create').addEventListener('click', function () {
          var button = document.getElementById('vm-create');
          var warning = document.getElementById('vm-warning');
          var name = document.getElementById('vm-name').value.trim();
          if (!name) { warning.textContent = 'A machine name is required.'; return; }
          var payload = {
            name: name,
            vcpus: Number(document.getElementById('vm-vcpus').value) || 1,
            memory_mb: Number(document.getElementById('vm-memory').value) || 2048,
            disk_mb: Number(document.getElementById('vm-disk').value) || 0,
            os: document.getElementById('vm-os').value.trim(),
            iso: document.getElementById('vm-iso').value.trim()
          };
          button.disabled = true; button.textContent = 'Creating the image…';
          apiJSON('/vms', { method: 'POST', body: JSON.stringify(payload) })
            .then(function (vm) {
              warning.textContent = 'Created ' + (vm.name || name) + ' (' + (vm.status || 'stopped') + '). Start it when the install media is attached.';
              button.disabled = false; button.textContent = 'Create machine';
              return loadVMs();
            })
            .catch(function (err) { button.disabled = false; button.textContent = 'Create machine'; warning.textContent = ''; showError(err); });
        });
        refreshVMs();
      }
      if (v.id === 'objects') {
        document.getElementById('objects-refresh').addEventListener('click', refreshObjects);
        document.getElementById('bucket-create').addEventListener('click', function () {
          var button = document.getElementById('bucket-create');
          var warning = document.getElementById('bucket-warning');
          var name = document.getElementById('bucket-name').value.trim();
          var tier = document.getElementById('bucket-tier').value;
          var target = document.getElementById('bucket-target').value.trim();
          if (!name) { warning.textContent = 'A bucket name is required (3-63 lowercase characters).'; return; }
          if (tier !== 'local' && !target) { warning.textContent = 'A cloud target is required for a ' + tier + ' bucket — configure one on the Shares page first.'; return; }
          button.disabled = true; button.textContent = 'Creating…';
          apiJSON('/buckets', { method: 'POST', body: JSON.stringify({ name: name, tier: tier, cloud_target: target, evict_after_days: Number(document.getElementById('bucket-evict').value) || 0 }) })
            .then(function (bucket) {
              warning.textContent = 'Created ' + (bucket.name || name) + ' (' + String(bucket.tier || tier).toLowerCase() + ').' + (tier === 'local' ? '' : ' Run Sync to mirror it to ' + target + ' when your data is in place.');
              button.disabled = false; button.textContent = 'Create bucket';
              return loadBuckets();
            })
            .catch(function (err) { button.disabled = false; button.textContent = 'Create bucket'; warning.textContent = ''; showError(err); });
        });
        refreshObjects();
      }
      if (v.id === 'users') {
        document.getElementById('user-create').addEventListener('click', function () {
          var username = document.getElementById('user-username').value.trim();
          if (!username) { showError({ error: { message: 'Authentik username is required.' } }); return; }
          apiJSON('/users', { method: 'POST', body: JSON.stringify({ username: username, email: document.getElementById('user-email').value.trim(), role: document.getElementById('user-role').value, status: 'active' }) }).then(loadUsers).catch(showError);
        });
        loadUsers();
      }
      if (v.id === 'settings') {
        var themeSelect = document.getElementById('settings-theme');
        if (themeSelect) { themeSelect.value = document.documentElement.dataset.theme || 'dark'; themeSelect.addEventListener('change', function () { document.documentElement.dataset.theme = themeSelect.value; try { localStorage.setItem('onyx.theme', themeSelect.value); } catch (e) {} }); }
        document.getElementById('settings-refresh-remotes').addEventListener('click', function () { apiJSON('/storage/remotes').then(function (data) { document.getElementById('settings-remotes').textContent = data.remotes.length ? data.remotes.join(', ') : 'No rclone remotes configured'; }).catch(showError); });
      }
      if (v.id === 'backups') {
        document.getElementById('backup-source-files').addEventListener('click', function () { location.hash = '#/files'; });
        try { var selectedSource = localStorage.getItem('onyx.backupSource'); if (selectedSource) document.getElementById('backup-source').value = selectedSource; } catch (e) {}
        loadBackupLocations();
        document.getElementById('backup-create').addEventListener('click', function () {
          var name = document.getElementById('backup-name').value.trim();
          var source = document.getElementById('backup-source').value.trim();
          var targetChoice = document.getElementById('backup-target').value.trim();
          var targetParts = targetChoice.split('|');
          var targetKind = targetParts[0] || '';
          var target = targetParts.slice(1).join('|');
          var retention = Number(document.getElementById('backup-retention').value || 7);
          if (!name || !source || !targetKind || !target) { showError({ error: { message: 'Choose a backup location, source path, and name.' } }); return; }
          apiJSON('/backup-jobs', { method: 'POST', body: JSON.stringify({ name: name, source: source, target_kind: targetKind, target: target, snapshot_before: document.getElementById('backup-snapshot').checked, retention: retention }) }).then(function (job) { return apiJSON('/backup-jobs/' + encodeURIComponent(job.id) + '/run', { method: 'POST' }); }).then(function () { loadBackups(); alert('Backup started.'); }).catch(showError);
        });
        loadBackups();
      }
      document.title = 'ONYX — ' + v.label;
    }

    /* ── live status ──────────────────────────────────────────────────── */
    function setStatus(kind, text) {
      document.getElementById('status-dot').className = 'dot ' + kind;
      document.getElementById('status-text').textContent = text;
    }
    function loadStatus() {
      fetch(API + '/system/status', { headers: { accept: 'application/json' }, credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (s) {
          var services = Array.isArray(s.services) ? s.services : [];
          var serving = services.filter(function (service) { return service.status === 'SERVING'; }).length;
          var healthy = services.length > 0 && serving === services.length;
          setStatus(healthy ? 'ok' : 'warn', services.length ? serving + '/' + services.length + ' services' : 'Checking services');
          window.__onyxStatus = s;
          window.__onyxServiceHealth = { serving: serving, total: services.length };
          loadStatusStats();
        })
        .catch(function () { setStatus('err', 'API unreachable'); });
    }
    function loadStatusStats() {
      var s = window.__onyxStatus;
      if (!s) return;
      var set = function (id, val) { var el = document.getElementById(id); if (el && val != null) el.textContent = val; };
      set('stat-pools', s.pools != null ? s.pools : (s.poolCount != null ? s.poolCount : '—'));
      set('stat-capacity', s.capacity || s.used || '—');
      var health = window.__onyxServiceHealth || { serving: 0, total: 0 };
      set('stat-health', health.total ? health.serving + '/' + health.total : '—');
      set('stat-version', s.coreVersion || s.version || '—');
    }

    /* ── command palette ──────────────────────────────────────────────── */
    var palette = document.getElementById('palette');
    var paletteInput = document.getElementById('palette-input');
    var paletteList = document.getElementById('palette-list');
    var paletteIndex = 0;

    function commands() {
      return VIEWS.map(function (v) {
        return { label: 'Go to ' + v.label, hint: v.section, run: function () { location.hash = '#/' + v.id; } };
      }).concat([
        { label: 'Toggle theme', hint: 'Appearance', run: toggleTheme },
        { label: 'Toggle activity rail', hint: 'Layout', run: function () {
          var app = document.getElementById('app');
          app.dataset.rail = app.dataset.rail === 'open' ? 'closed' : 'open';
        } }
      ]);
    }
    function renderPalette(query) {
      var q = query.trim().toLowerCase();
      var items = commands().filter(function (c) { return !q || c.label.toLowerCase().indexOf(q) !== -1; });
      paletteIndex = 0;
      paletteList.innerHTML = items.length ? items.map(function (c, i) {
        return '<li data-i="' + i + '"' + (i === 0 ? ' data-active="true"' : '') + '><span>' + esc(c.label) + '</span><span class="hint">' + esc(c.hint) + '</span></li>';
      }).join('') : '<li class="hint" style="justify-content:center">No matching commands</li>';
      paletteList.__items = items;
      Array.prototype.forEach.call(paletteList.querySelectorAll('li[data-i]'), function (li) {
        li.addEventListener('click', function () { runCommand(Number(li.dataset.i)); });
      });
    }
    function runCommand(i) {
      var items = paletteList.__items || [];
      if (!items[i]) return;
      closePalette();
      items[i].run();
    }
    function openPalette() { palette.dataset.open = 'true'; paletteInput.value = ''; renderPalette(''); paletteInput.focus(); }
    function closePalette() { palette.dataset.open = 'false'; }
    function movePalette(delta) {
      var lis = paletteList.querySelectorAll('li[data-i]');
      if (!lis.length) return;
      paletteIndex = (paletteIndex + delta + lis.length) % lis.length;
      Array.prototype.forEach.call(lis, function (li, i) { li.toggleAttribute('data-active', i === paletteIndex); });
    }

    /* ── theme ────────────────────────────────────────────────────────── */
    function toggleTheme() {
      var root = document.documentElement;
      var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('onyx.theme', next); } catch (e) {}
    }

    /* ── wiring ───────────────────────────────────────────────────────── */
    function route() {
      var id = (location.hash || '#/dashboard').replace(/^#\/?/, '');
      render(id || 'dashboard');
    }

    try {
      var saved = localStorage.getItem('onyx.theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      var collapsed = localStorage.getItem('onyx.sidebar');
      if (collapsed != null) document.getElementById('app').dataset.collapsed = collapsed;
    } catch (e) {}

    document.getElementById('collapse').addEventListener('click', function () {
      var app = document.getElementById('app');
      var next = app.dataset.collapsed === 'true' ? 'false' : 'true';
      app.dataset.collapsed = next;
      try { localStorage.setItem('onyx.sidebar', next); } catch (e) {}
    });
    document.getElementById('theme').addEventListener('click', toggleTheme);
    document.getElementById('rail-toggle').addEventListener('click', function () {
      var app = document.getElementById('app');
      app.dataset.rail = app.dataset.rail === 'open' ? 'closed' : 'open';
    });
    document.getElementById('search').addEventListener('click', openPalette);
    palette.addEventListener('click', function (e) { if (e.target === palette) closePalette(); });
    paletteInput.addEventListener('input', function () { renderPalette(paletteInput.value); });
    paletteInput.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); runCommand(paletteIndex); }
      else if (e.key === 'Escape') { closePalette(); }
    });
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); }
      else if (e.key === 'Escape' && palette.dataset.open === 'true') closePalette();
    });
    window.addEventListener('hashchange', route);

    route();
    loadStatus();
    setInterval(loadStatus, 30000);
  })();
  </script>
</body>
</html>
