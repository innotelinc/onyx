          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(b.name) + '</b><span class="tag">' + esc(tier) + '</span><div class="sub">' + (cloudTier ? esc(b.cloudTarget) + ' · ' : '') + nObjects(b.localObjects) + ' local' + (cloudTier ? ' · ' + nObjects(b.cloudObjects) + ' in the cloud' + (b.evictAfterDays ? ' · evict after ' + b.evictAfterDays + ' days' : '') : '') + last + '</div>' +
            (b.syncError ? '<div class="sub" style="color:var(--onyx-danger)">' + esc(b.syncError) + '</div>' : '') + '</div>' +
            '<div>' + (cloudTier ? '<button class="btn" data-bucket-sync="' + esc(b.name) + '">Sync</button> <button class="btn" data-bucket-evict="' + esc(b.name) + '">Sync &amp; evict</button> ' : '') + '<button class="btn" data-bucket-delete="' + esc(b.name) + '">Delete</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No buckets</b>Create one above. Anything S3-compatible can then use the endpoint with the storage access key.</div>');

        Array.prototype.forEach.call(list.querySelectorAll('[data-bucket-sync]'), function (button) {
          button.addEventListener('click', function () { syncBucket(button.dataset.bucketSync, false, button); });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-bucket-evict]'), function (button) {
          button.addEventListener('click', function () {
            if (!window.confirm('Sync ' + button.dataset.bucketEvict + ' and release local copies the cloud has verified? Local reads will refetch from the cloud afterwards.')) return;
            syncBucket(button.dataset.bucketEvict, true, button);
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-bucket-delete]'), function (button) {
          button.addEventListener('click', function () {
            var name = button.dataset.bucketDelete;
            if (!window.confirm('Delete bucket ' + name + ' and everything in it (including its cloud target)? This cannot be undone.')) return;
            button.disabled = true;
            apiJSON('/buckets/' + encodeURIComponent(name) + '?force=true', { method: 'DELETE' })
              .then(function () { return loadBuckets(); })
              .catch(function (err) { button.disabled = false; showError(err); });
          });
        });
      }).catch(function (err) {
        list.innerHTML = '<h3>Buckets</h3><div class="empty"><b>onyx-objectstore is unavailable</b>' + esc(err && err.error && err.error.message ? err.error.message : 'The object store did not answer.') + '</div>';
      });
    }

    // nObjects renders an object count without pretending an unknown one is
    // zero: before a bucket has been synced its cloud count is genuinely
    // unknown, not empty.
    function nObjects(count) {
      var n = Number(count || 0);
      return n + (n === 1 ? ' object' : ' objects');
    }

    function syncBucket(name, evict, button) {
      button.disabled = true; button.textContent = evict ? 'Syncing & evicting…' : 'Syncing…';
      var stamp = document.getElementById('bucket-warning');
      if (stamp) stamp.textContent = 'Syncing ' + name + '…';
      apiJSON('/buckets/' + encodeURIComponent(name) + '/sync?evict=' + (evict ? 'true' : 'false'), { method: 'POST' })
        .then(function (result) {
          if (stamp) {
            var warnings = (result.warnings || []).join(' ');
            stamp.textContent = 'Synced ' + name + ': ' + result.uploaded + ' uploaded, ' + result.evicted + ' evicted.' + (warnings ? ' ' + warnings : '');
          }
          return loadBuckets();
        })
        .catch(function (err) { button.disabled = false; button.textContent = evict ? 'Sync & evict' : 'Sync'; showError(err); });
    }

    function refreshObjects() {
      var button = document.getElementById('objects-refresh');
      if (button) { button.disabled = true; button.textContent = 'Refreshing…'; }
      return loadBuckets().catch(function () {}).then(function () {
        if (button) { button.disabled = false; button.textContent = 'Refresh'; }
      });
    }

    function viewShares() {
      return '<div class="page-head"><div><p>Pick a storage folder, choose protocols, and publish it safely.</p></div></div>' +
        '<div class="card" style="margin-bottom:16px"><h3>Create a share</h3>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end">' +
        '<label>Name<input id="share-name" class="search" style="width:100%;max-width:none" placeholder="media" autocomplete="off"></label>' +
        '<label>Storage folder<div id="share-browser" class="search" style="width:100%;max-width:none;min-height:38px">Loading folders…</div><input type="hidden" id="share-path"></label>' +
        '<label>Comment<input id="share-comment" class="search" style="width:100%;max-width:none" placeholder="Family media" autocomplete="off"></label>' +
        '</div>' +
        '<div style="display:flex;gap:16px;align-items:center;margin-top:16px;flex-wrap:wrap">' +
        '<label><input type="checkbox" id="share-smb" checked> SMB</label>' +
        '<label><input type="checkbox" id="share-nfs" checked> NFS</label>' +
        // Every extra protocol is off until the operator opts in (docs/design/05#6).
        '<label><input type="checkbox" id="share-ftp"> FTP</label>' +
        '<label><input type="checkbox" id="share-sftp"> SFTP</label>' +
        '<label><input type="checkbox" id="share-webdav"> WebDAV</label>' +
        '<label><input type="checkbox" id="share-rsync"> Rsync</label>' +
        '<label><input type="checkbox" id="share-readonly"> Read-only</label>' +
        '<button class="btn primary" id="share-create">Create share</button>' +
        '</div>' +
        // Presets exist because the protocol matrix is the part that trips
        // practical users up: a media library and a team folder differ in two
        // checkboxes nobody wants to reason about.
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">' +
        '<span class="sub">Presets:</span>' +
        '<button class="btn" data-share-preset="media">Media library</button>' +
        '<button class="btn" data-share-preset="team">Team folder</button>' +
        '<button class="btn" data-share-preset="backup">Backup target</button>' +
        '<button class="btn" data-share-preset="guest">Read-only guest drop</button>' +
        '</div><p class="sub" style="margin:8px 0 0">Only folders under the mounted Onyx storage root can be shared. No disk formatting is performed here.</p></div>' +
        // Cloud/remote storage (docs/design/05#6): configure a provider once,
        // then clone a storage folder to it or use it as a backup target. The
        // remote catalog is the shared rclone config the API writes and
        // backupd reads. It sits directly under the create-share form because
        // it is page-level configuration, not one share's property — and it is
        // what an operator needs when the storage they want to share is not on
        // this box at all.
        '<div class="card" style="margin-top:16px" id="share-remote"><h3>Cloud &amp; remote storage</h3>' +
        '<p class="sub">Register a provider once — each configured target can then receive a clone of a storage folder and serve as a backup destination.</p>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end">' +
        '<label>Target name<input id="remote-name" class="search" style="width:100%;max-width:none" placeholder="my-cloud" autocomplete="off"></label>' +
        '<label>Provider<select id="remote-provider" class="search" style="width:100%;max-width:none"><option value="">Loading providers…</option></select></label>' +
        '</div>' +
        '<div id="remote-fields" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end;margin-top:12px"></div>' +
        '<p class="sub" id="remote-hint" style="margin:8px 0 0"></p>' +
        '<button class="btn primary" id="remote-save" style="margin-top:12px">Save target</button>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end;margin-top:16px;border-top:1px solid var(--onyx-border);padding-top:16px">' +
        '<label>Clone folder<input id="remote-clone-source" class="search" style="width:100%;max-width:none" placeholder="media" autocomplete="off"></label>' +
        '<label>Target<select id="remote-clone-target" class="search" style="width:100%;max-width:none"><option value="">No target configured</option></select></label>' +
        '<label>Into folder<input id="remote-clone-dest" class="search" style="width:100%;max-width:none" placeholder="onyx-backups/media" autocomplete="off"></label>' +
        '<button class="btn" id="remote-clone">Clone to target</button>' +
        '</div>' +
        '<div id="remote-list" class="sub" style="margin-top:12px">Loading targets…</div>' +
        '<div id="remote-status" class="sub" style="margin-top:8px"></div></div>' +
        '<div class="card" style="margin-top:16px" id="share-list"><div class="empty"><b>Loading shares…</b>Reading the share catalog.</div><div id="share-detail"></div></div>';
    }

    // copyText writes a connection string to the clipboard, falling back to a
    // selectable prompt on browsers without the async clipboard API (or on a
    // non-HTTPS origin, where it is unavailable).
    function copyText(text, button) {
      function done() {
        if (!button) return;
        var previous = button.textContent;
        button.textContent = 'Copied';
        setTimeout(function () { button.textContent = previous; }, 1200);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { window.prompt('Copy this connection string', text); });
        return;
      }
      window.prompt('Copy this connection string', text);
    }

    // shareConnections renders the client-side address for every protocol a
    // share is published over, using the address the browser reached Onyx on.
    function shareConnections(share) {
      var host = location.hostname || 'localhost';
      var protocols = (share.protocols || []).map(function (p) {
        return String(p).replace(/^SHARE_PROTOCOL_/, '').toLowerCase();
      });
      var lines = [];
      if (protocols.indexOf('smb') >= 0) {
        lines.push(['SMB (Windows)', '\\\\' + host + '\\' + share.name]);
        lines.push(['SMB (macOS / Linux)', 'smb://' + host + '/' + share.name]);
      }
      if (protocols.indexOf('nfs') >= 0) lines.push(['NFS', host + ':' + share.path]);
      if (protocols.indexOf('ftp') >= 0) lines.push(['FTP', 'ftp://' + host + '/']);
      // The SFTP instance chroots one Onyx user per share (onyx-<share>).
      if (protocols.indexOf('sftp') >= 0) lines.push(['SFTP', 'sftp://onyx-' + share.name + '@' + host + ':2222/']);
      if (protocols.indexOf('webdav') >= 0) lines.push(['WebDAV', 'https://' + host + '/webdav/' + share.name]);
      if (protocols.indexOf('rsync') >= 0) lines.push(['Rsync', 'rsync://' + host + '/' + share.name]);
      return lines;
    }

    // loadRemoteProviders fills the provider picker and swaps the credential
    // fields when the selection changes. Field names are rclone's own option
    // names, so they are passed straight through to the target config.
    function loadRemoteProviders() {
      var select = document.getElementById('remote-provider');
      if (!select) return;
      apiJSON('/storage/providers').then(function (data) {
        var providers = data.providers || [];
        select.innerHTML = '<option value="">Choose a provider…</option>' + providers.map(function (p) {
          return '<option value="' + esc(p.type) + '">' + esc(p.label) + (p.oauth ? ' (OAuth)' : '') + '</option>';
        }).join('');
        select.addEventListener('change', function () { renderRemoteFields(providers); });
      }).catch(function () { select.innerHTML = '<option value="">Providers unavailable</option>'; });
    }

    function renderRemoteFields(providers) {
      var select = document.getElementById('remote-provider');
      var fields = document.getElementById('remote-fields');
      var hint = document.getElementById('remote-hint');
      if (!select || !fields) return;
      var provider = (providers || []).filter(function (p) { return p.type === select.value; })[0];
      if (!provider) {
        fields.innerHTML = '';
        if (hint) hint.textContent = '';
        return;
      }
      var required = provider.required || [];
      fields.innerHTML = (provider.fields || []).map(function (field) {
        var label = field.replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
        if (required.indexOf(field) >= 0) label += ' *';
        var secret = /pass|secret|key$/.test(field);
        return '<label>' + esc(label) + '<input class="search" data-remote-field="' + esc(field) + '" style="width:100%;max-width:none"' + (secret ? ' type="password"' : '') + ' autocomplete="off"></label>';
      }).join('');
      if (hint) hint.textContent = provider.hint || '';
    }

    // oauthRedirect is the set of backends the console can sign in for itself
    // (loaded with the target list), so the create handler can offer the
    // browser flow for a target it has just saved.
    var oauthRedirect = {};

    // connectRemoteAccount renders the one-time approval step for an OAuth
    // remote (Google Drive, OneDrive, SharePoint, Dropbox, Box, pCloud). These
    // backends cannot be finished with a password: the account owner has to
    // approve access in a browser and the callback lands on 127.0.0.1 of the
    // machine that ran the approval, so the console shows the exact command and
    // takes the token it prints.
    function connectRemoteAccount(name, type, canRedirect) {
      var status = document.getElementById('remote-status');
      if (!status) return;
      var command = 'rclone authorize ' + type;
      var signIn = canRedirect
        ? '<button class="btn primary" id="remote-oauth-start">Sign in with ' + esc(type) + '</button>' +
          '<div id="remote-oauth-result" class="sub" style="margin-top:8px"></div>' +
          '<p class="sub" style="margin:12px 0 0">The provider sends the browser back to this console, which then stores the token for rclone. The redirect URI below has to be registered in the provider\'s OAuth application once.</p>'
        : '';
      status.innerHTML = '<div style="border-top:1px solid var(--onyx-border);padding-top:12px;margin-top:12px">' +
        '<b>Connect ' + esc(name) + ' (' + esc(type) + ')</b>' +
        (canRedirect ? '' : '<p class="sub" style="margin:6px 0">Approve access once in a browser, then paste what rclone prints:</p>') +
        signIn +
        '<div style="margin-top:12px"><b>Or paste a token</b>' +
        '<ol class="sub" style="margin:6px 0 8px 18px"><li>On any machine with a browser run <code>' + esc(command) + '</code> (install rclone there if needed).</li>' +
        '<li>Sign in and allow access — rclone prints a token.</li>' +
        '<li>Paste it below and press <b>Connect account</b>.</li></ol>' +
        '<textarea id="remote-token" class="search" style="width:100%;min-height:90px" placeholder=\'{"access_token":"…","refresh_token":"…"}\' spellcheck="false"></textarea>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end;margin-top:8px">' +
        '<label>Client ID (optional)<input id="remote-client-id" class="search" style="width:100%;max-width:none" autocomplete="off"></label>' +
        '<label>Client secret (optional)<input id="remote-client-secret" class="search" style="width:100%;max-width:none" type="password" autocomplete="off"></label>' +
        '<button class="btn primary" id="remote-token-save">Connect account</button></div>' +
        '<p class="sub">Client ID / secret are only needed if you registered your own OAuth application for this provider; the command above then becomes <code>' + esc(command) + ' --client-id … --client-secret …</code>.</p>' +
        '<div id="remote-token-result" class="sub"></div></div></div>';
      var startButton = document.getElementById('remote-oauth-start');
      if (startButton) startButton.addEventListener('click', function () {
        var result = document.getElementById('remote-oauth-result');
        startButton.disabled = true;
        startButton.textContent = 'Opening sign-in…';
        apiJSON('/storage/remotes/' + encodeURIComponent(name) + '/oauth/start', { method: 'POST', body: '{}' }).then(function (res) {
          startButton.disabled = false;
          startButton.textContent = 'Sign in with ' + type;
          result.innerHTML = 'Approve access in the window that opened. Register <code>' + esc(res.redirect_uri) + '</code> in the ' + esc(type) + ' OAuth application. <a href="' + esc(res.auth_url) + '" target="_blank" rel="noopener">Reopen the sign-in page</a> if it was blocked.';
          window.open(res.auth_url, '_blank', 'noopener');
        }).catch(function (err) {
          startButton.disabled = false;
          startButton.textContent = 'Sign in with ' + type;
          showError(err);
        });
      });
      var button = document.getElementById('remote-token-save');
      button.addEventListener('click', function () {
        var result = document.getElementById('remote-token-result');
        var token = document.getElementById('remote-token').value;
        if (!token.trim()) { result.textContent = 'Paste the token rclone printed first.'; return; }
        button.disabled = true;
        button.textContent = 'Connecting…';
        apiJSON('/storage/remotes/' + encodeURIComponent(name) + '/token', {
          method: 'POST',
          body: JSON.stringify({
            token: token,
            client_id: document.getElementById('remote-client-id').value.trim(),
            client_secret: document.getElementById('remote-client-secret').value.trim()
          })
        }).then(function (res) {
          button.disabled = false;
          button.textContent = 'Connect account';
          result.textContent = res.ok
            ? name + ' is connected and reachable.'
            : name + ' stored the token but the account could not be reached: ' + res.detail;
          if (res.ok) loadRemoteTargets();
        }).catch(function (err) {
          button.disabled = false;
          button.textContent = 'Connect account';
          showError(err);
        });
      });
    }

    function loadRemoteTargets() {
      var list = document.getElementById('remote-list');
      if (!list) return Promise.resolve();
      return apiJSON('/storage/remotes').then(function (data) {
        var names = data.remotes || [];
        var details = data.details || {};
        // Only a backend that finishes with an OAuth token gets a Connect
        // action; a key-based backend is already complete once it is saved.
        var oauthTypes = {};
        (data.providers || []).forEach(function (p) { if (p.oauth) oauthTypes[p.type] = true; });
        // Providers the console can sign in for itself; the rest get the
        // paste-a-token path only.
        oauthRedirect = {};
        (data.oauth_redirect || []).forEach(function (t) { oauthRedirect[t] = true; });
        var select = document.getElementById('remote-clone-target');
        if (select) {
          select.innerHTML = names.length
            ? names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + (details[n] ? ' · ' + esc(details[n]) : '') + '</option>'; }).join('')
            : '<option value="">No target configured</option>';
        }
        list.innerHTML = names.length
          ? '<div style="display:grid;gap:6px">' + names.map(function (n) {
            var connect = oauthTypes[details[n]] ? '<button class="btn primary" data-remote-connect="' + esc(n) + '">Connect</button>' : '';
            return '<div style="display:flex;gap:8px;align-items:center"><span class="tag">' + esc(n) + (details[n] ? ' · ' + esc(details[n]) : '') + '</span>' + connect + '<button class="btn" data-remote-check="' + esc(n) + '">Check</button><button class="btn" data-remote-delete="' + esc(n) + '">Remove</button></div>';
          }).join('') + '</div>'
          : 'No cloud/remote targets configured yet.';
        if (data.error) list.innerHTML += '<div class="sub" style="margin-top:8px">' + esc(data.error) + '</div>';
        Array.prototype.forEach.call(list.querySelectorAll('[data-remote-check]'), function (button) {
          button.addEventListener('click', function () {
            var status = document.getElementById('remote-status');
            if (status) status.textContent = 'Checking ' + button.dataset.remoteCheck + '…';
            apiJSON('/storage/remotes/' + encodeURIComponent(button.dataset.remoteCheck) + '/check', { method: 'POST' }).then(function (result) {
              if (status) status.textContent = result.ok ? result.name + ' is reachable.' : result.name + ' failed: ' + result.detail;
            }).catch(showError);
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-remote-delete]'), function (button) {
          button.addEventListener('click', function () {
            if (!confirm('Remove the target ' + button.dataset.remoteDelete + '? Stored data at the provider is not touched.')) return;
            apiJSON('/storage/remotes/' + encodeURIComponent(button.dataset.remoteDelete), { method: 'DELETE' }).then(loadRemoteTargets).catch(showError);
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-remote-connect]'), function (button) {
          button.addEventListener('click', function () {
            var type = details[button.dataset.remoteConnect] || 'drive';
            connectRemoteAccount(button.dataset.remoteConnect, type, !!oauthRedirect[type]);
          });
        });
      }).catch(showError);
    }

    function loadSharePaths(path) {
      var browser = document.getElementById('share-browser');
      var hidden = document.getElementById('share-path');
      if (!browser || !hidden) return;
      path = path || '';
      apiJSON('/files' + (path ? '?path=' + encodeURIComponent(path) : '')).then(function (data) {
        var dirs = (data.entries || []).filter(function (entry) { return entry.type === 'directory'; });
        hidden.value = path;
        var parent = path ? path.split('/').slice(0, -1).join('/') : '';
        browser.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>Current: <b>' + esc(path || 'Storage root') + '</b></span>' + (path ? '<button class="btn" type="button" id="share-up">Up</button>' : '') + '</div>' +
          (path ? '<button class="btn primary" type="button" id="share-use" style="margin-top:8px">Use this folder</button>' : '<div class="sub" style="margin-top:8px">Open a folder below to select it.</div>') +
          (dirs.length ? '<div style="display:grid;gap:4px;margin-top:8px">' + dirs.map(function (entry) { return '<button class="btn" type="button" data-share-dir="' + esc(entry.path) + '" style="text-align:left">📁 ' + esc(entry.name) + '</button>'; }).join('') + '</div>' : '<div class="sub" style="margin-top:8px">No subfolders here.</div>');
        var up = document.getElementById('share-up');
        if (up) up.addEventListener('click', function () { loadSharePaths(parent); });
        var use = document.getElementById('share-use');
        if (use) use.addEventListener('click', function () { browser.insertAdjacentHTML('beforeend', '<div class="sub" style="margin-top:8px;color:var(--onyx-success)">Selected for sharing.</div>'); });
        Array.prototype.forEach.call(browser.querySelectorAll('[data-share-dir]'), function (button) { button.addEventListener('click', function () { loadSharePaths(button.dataset.shareDir); }); });
      }).catch(function () { browser.textContent = 'Storage unavailable'; });
    }

    // applySharePreset sets the protocol matrix a practical user actually wants,
    // so the common cases need no reasoning about SMB vs NFS vs WebDAV.
    function applySharePreset(kind) {
      var set = function (id, value) { var box = document.getElementById(id); if (box) box.checked = value; };
      var comment = document.getElementById('share-comment');
      var name = document.getElementById('share-name');
      if (kind === 'media') {
        set('share-smb', true); set('share-nfs', true); set('share-webdav', false); set('share-sftp', false); set('share-ftp', false); set('share-rsync', false);
        set('share-readonly', true);
        if (!name.value) name.value = 'media';
        if (!comment.value) comment.value = 'Movies, music and photos — read-only for players and TVs';
      } else if (kind === 'team') {
        set('share-smb', true); set('share-nfs', true); set('share-webdav', true); set('share-sftp', true); set('share-ftp', false); set('share-rsync', false);
        set('share-readonly', false);
        if (!name.value) name.value = 'team';
        if (!comment.value) comment.value = 'Shared working folder for the team';
      } else if (kind === 'backup') {
        set('share-smb', true); set('share-nfs', true); set('share-webdav', false); set('share-sftp', true); set('share-ftp', false); set('share-rsync', true);
        set('share-readonly', false);
        if (!name.value) name.value = 'backups';
        if (!comment.value) comment.value = 'Destination for backups from other machines';
      } else {
        set('share-smb', true); set('share-nfs', true); set('share-webdav', true); set('share-sftp', false); set('share-ftp', false); set('share-rsync', false);
        set('share-readonly', true);
        if (!name.value) name.value = 'drop';
        if (!comment.value) comment.value = 'Read-only drop box anyone can copy from';
      }
      var panel = document.getElementById('share-detail');
      if (panel) panel.innerHTML = '<div class="sub" style="color:var(--onyx-success)">Preset applied — choose the storage folder, then Create share.</div>';
    }

    // shareHelpPanel is the per-OS "how do I actually open this" answer, which
    // is the step practical users get stuck on: a connection string is not a
    // set of instructions.
    function shareHelpPanel(share) {
      var panel = document.getElementById('share-detail');
      if (!panel) return;
      var host = location.hostname || 'localhost';
      var protocols = (share.protocols || []).map(function (p) { return String(p).replace(/^SHARE_PROTOCOL_/, '').toLowerCase(); });
      var blocks = [];
      if (protocols.indexOf('smb') >= 0) {
        blocks.push(['Windows', 'Open File Explorer → <b>Map network drive</b> → Folder: <code>\\\\' + esc(host) + '\\' + esc(share.name) + '</code> → tick <i>Reconnect at sign-in</i> → Finish, then sign in with your Authentik account.']);
        blocks.push(['macOS', 'Finder → <b>Go ▸ Connect to Server</b> → <code>smb://' + esc(host) + '/' + esc(share.name) + '</code> → Connect, then your Authentik account.']);
        blocks.push(['Linux', 'One-off: <code>sudo mount -t cifs //' + esc(host) + '/' + esc(share.name) + ' /mnt/' + esc(share.name) + ' -o username=YOU,uid=$(id -u),gid=$(id -g)</code><br>Persistent (/etc/fstab): <code>//' + esc(host) + '/' + esc(share.name) + ' /mnt/' + esc(share.name) + ' cifs credentials=/etc/onyx-smb,uid=1000,gid=1000,_netdev 0 0</code>']);
      }
      if (protocols.indexOf('nfs') >= 0) {
        blocks.push(['Linux / macOS (NFS)', 'One-off: <code>sudo mount -t nfs ' + esc(host) + ':' + esc(share.path) + ' /mnt/' + esc(share.name) + '</code><br>Persistent (/etc/fstab): <code>' + esc(host) + ':' + esc(share.path) + ' /mnt/' + esc(share.name) + ' nfs defaults,_netdev 0 0</code>']);
        blocks.push(['macOS (NFS)', 'Finder → Go ▸ Connect to Server → <code>nfs://' + esc(host) + esc(share.path) + '</code>']);
      }
      if (protocols.indexOf('webdav') >= 0) {
        blocks.push(['Windows / macOS / Linux (WebDAV)', 'Add <code>https://' + esc(host) + '/webdav/' + esc(share.name) + '</code> as a network location — good for cloud-sync clients such as Nextcloud desktop or RaiDrive.']);
      }
      if (protocols.indexOf('sftp') >= 0) {
        blocks.push(['FileZilla / WinSCP (SFTP)', 'Host <code>' + esc(host) + '</code>, port <code>2222</code>, user <code>onyx-' + esc(share.name) + '</code>, protocol SFTP.']);
      }
      panel.innerHTML = '<h3>How to connect to ' + esc(share.name) + '</h3><div style="display:grid;gap:8px">' +
        blocks.map(function (pair) { return '<div><b>' + esc(pair[0]) + '</b><div class="sub">' + pair[1] + '</div></div>'; }).join('') +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="share-help-access">Who has access</button><button class="btn" id="share-help-close">Close</button></div>';
      document.getElementById('share-help-access').addEventListener('click', function () { shareAccessPanel(share.name); });
      document.getElementById('share-help-close').addEventListener('click', function () { panel.innerHTML = ''; });
      if (panel.scrollIntoView) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // shareAccessPanel shows who can reach one share, and whether their name can
    // actually sign in over SMB. The grants live in onyx-core, which renders them
    // into smb.conf and davd.conf, so this reads the share's own access endpoint
    // rather than rebuilding the picture from every user's permissions.
    function shareAccessPanel(shareName) {
      var panel = document.getElementById('share-detail');
      if (!panel) return;
      panel.innerHTML = '<div class="sub">Loading access for ' + esc(shareName) + '…</div>';
      return Promise.all([
        apiJSON('/shares/' + encodeURIComponent(shareName) + '/access'),
        apiJSON('/users').catch(function () { return { users: [] }; }),
      ]).then(function (results) {
        var grants = {};
        (results[0].access || []).forEach(function (g) { grants[g.username] = g.mode; });
        var accounts = results[0].samba_accounts || [];
        var users = results[1].users || [];
        if (!users.length) {
          panel.innerHTML = '<h3>Who can reach ' + esc(shareName) + '</h3><div class="sub">No users yet — add one on the Users page first.</div>';
          return;
        }
        // A grant names a person in `valid users`, and Samba treats a name it
        // has no account for as nobody: the grant is recorded and the share
        // still refuses them, which is the confusing case this calls out.
        var sambaMissing = users.filter(function (u) { return grants[u.username] && accounts.indexOf(u.username) < 0; });
        var notice = '';
        if (sambaMissing.length) {
          notice = '<div class="card" style="border-color:var(--onyx-warning);margin:8px 0"><h4 style="margin:0 0 4px">SMB sign-in needed</h4><div class="sub">' + sambaMissing.map(function (u) { return esc(u.username); }).join(', ') + ' can be granted this share but Samba has no account for them yet, so an SMB client will be refused. Set an SMB password on the Users page and they can connect.</div></div>';
        }
        panel.innerHTML = '<h3>Who can reach ' + esc(shareName) + '</h3>' +
          '<p class="sub">This grant applies to this share only; removing access deletes nothing. SMB and WebDAV serve a granted share to exactly the people listed here; NFS, FTP, SFTP and rsync authenticate per share rather than per user, so there they follow the share\u2019s own read-only setting.</p>' + notice +
          '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end">' +
          users.map(function (u) {
            var mode = grants[u.username] || '';
            var options = [['', 'No access'], ['read', 'Read only'], ['read-write', 'Read & write']].map(function (pair) {
              return '<option value="' + pair[0] + '"' + (pair[0] === mode ? ' selected' : '') + '>' + pair[1] + '</option>';
            }).join('');
            var missing = grants[u.username] && accounts.indexOf(u.username) < 0;
            return '<label>' + esc(u.username) + (missing ? ' <span class="sub">(no SMB account)</span>' : '') + '<select class="search" data-share-grant="' + esc(u.username) + '" style="width:100%;max-width:none">' + options + '</select></label>';
          }).join('') +
          '<button class="btn primary" id="share-grant-save">Save access</button><button class="btn" id="share-grant-history">History</button><button class="btn" id="share-grant-close">Close</button></div>';
        document.getElementById('share-grant-close').addEventListener('click', function () { panel.innerHTML = ''; });
        document.getElementById('share-grant-history').addEventListener('click', function () { shareAuditPanel(shareName); });
        document.getElementById('share-grant-save').addEventListener('click', function () {
          var button = this;
          button.disabled = true;
          button.textContent = 'Saving…';
          // The endpoint takes the share's whole map, so one request both
          // grants and revokes, and nobody's other shares are touched.
          var wanted = {};
          Array.prototype.forEach.call(panel.querySelectorAll('[data-share-grant]'), function (select) {
            if (select.value) wanted[select.dataset.shareGrant] = select.value;
          });
          apiJSON('/shares/' + encodeURIComponent(shareName) + '/access', {
            method: 'PUT', body: JSON.stringify({ access: wanted }),
          }).then(function () {
            return shareAccessPanel(shareName);
          }).then(function () {
            panel.insertAdjacentHTML('afterbegin', '<div class="sub" style="color:var(--onyx-success)">Access updated.</div>');
          }).catch(function (err) {
            button.disabled = false;
            button.textContent = 'Save access';
            showError(err);
          });
        });
      }).catch(showError);
    }

    // shareAuditPanel answers "why can this person not reach this share?" from
    // the access trail: the grant changes and the refusals, newest first.
    function shareAuditPanel(shareName) {
      var panel = document.getElementById('share-detail');
      if (!panel) return;
      panel.innerHTML = '<div class="sub">Loading the access trail…</div>';
      return apiJSON('/audit/access?share=' + encodeURIComponent(shareName)).then(function (data) {
        var events = data.events || [];
        panel.innerHTML = '<h3>' + esc(shareName) + ' \u2014 access trail</h3>' +
          (events.length ? '<div style="display:grid;gap:6px">' + events.map(function (e) {
            var verb = e.kind === 'denied' ? 'refused' : (e.kind === 'revoke' ? 'removed' : 'granted');
            var what = e.kind === 'denied' ? (e.method || '') : (e.mode || 'access');
            var when = e.ts ? String(e.ts).replace('T', ' ').replace('Z', ' UTC') : '';
            return '<div class="event" style="border-bottom:1px solid var(--onyx-border);padding-bottom:6px"><div><b>' + esc(e.username) + '</b> ' + esc(verb) + ' <span class="tag">' + esc(String(what)) + '</span><div class="sub">' + esc(when) + (e.actor ? ' · by ' + esc(e.actor) : '') + (e.detail ? ' · ' + esc(e.detail) : '') + '</div></div></div>';
          }).join('') + '</div>' : '<div class="empty"><b>Nothing recorded for this share yet</b>Grant changes and refused requests appear here as they happen.</div>') +
          '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="share-audit-back">Back to access</button></div>';
        document.getElementById('share-audit-back').addEventListener('click', function () { shareAccessPanel(shareName); });
      }).catch(showError);
    }

    function loadShares() {
      var list = document.getElementById('share-list');
      if (!list) return Promise.resolve();
      return apiJSON('/shares').then(function (data) {
        var rows = data.shares || [];
        list.innerHTML = rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (s) {
          // Connection strings: the address a client actually types, per
          // protocol, so nobody has to guess the exported path.
          var connections = shareConnections(s);
          var connectionHtml = connections.map(function (pair) {
            return '<div class="sub" style="display:flex;gap:8px;align-items:center;margin-top:4px"><span style="min-width:150px">' + esc(pair[0]) + '</span><code style="flex:1;overflow-wrap:anywhere">' + esc(pair[1]) + '</code><button class="btn" data-copy="' + esc(pair[1]) + '">Copy</button></div>';
          }).join('');
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div style="flex:1"><b>' + esc(s.name) + '</b><div class="sub">' + esc(s.path) + ' · ' + esc(friendlyProtocols(s.protocols)) + '</div>' + connectionHtml + '</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag">' + (s.readonly ? 'read-only' : 'read-write') + '</span><button class="btn" data-share-help="' + esc(s.name) + '">How to connect</button><button class="btn" data-share-access="' + esc(s.name) + '">Access</button><button class="btn" data-share-delete="' + esc(s.name) + '">Remove</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No shares yet</b>Create a share to expose a dataset over SMB or NFS.</div>';
        Array.prototype.forEach.call(list.querySelectorAll('[data-share-delete]'), function (button) { button.addEventListener('click', function () { if (!confirm('Remove this share? Files will remain unchanged.')) return; apiJSON('/shares/' + encodeURIComponent(button.dataset.shareDelete), { method: 'DELETE' }).then(loadShares).catch(showError); }); });
        Array.prototype.forEach.call(list.querySelectorAll('[data-share-help]'), function (button) {
          button.addEventListener('click', function () {
            var share = rows.filter(function (s) { return s.name === button.dataset.shareHelp; })[0];
            if (share) shareHelpPanel(share);
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-share-access]'), function (button) {
          button.addEventListener('click', function () { shareAccessPanel(button.dataset.shareAccess); });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-copy]'), function (button) { button.addEventListener('click', function () { copyText(button.dataset.copy, button); }); });
      }).catch(showError);
    }

    // reportUserCleanup surfaces the parts of a removal that can be left behind
    // even though the deletion itself succeeded: a share grant that could not be
    // cleared, or an SMB account still accepting the name. Both are permissions
    // the console has stopped showing, which is exactly when they are dangerous.
    function reportUserCleanup(res, username) {
      userCleanupWarnings(res, username).forEach(function (message) {
        showError({ error: { message: message } });
      });
    }

    // userCleanupWarnings is the list of things a removal left behind, so the
    // decision is testable apart from painting it.
    function userCleanupWarnings(res, username) {
      var warnings = [];
      if (!res) return warnings;
      if (res.grants_error) {
        warnings.push('The Onyx mapping for ' + username + ' is gone, but its share grants could not be cleared: ' + res.grants_error);
      }
      if (res.samba_account && res.samba_account !== 'removed' && res.samba_account !== 'skipped') {
        warnings.push(username + ' still has an SMB account: ' + res.samba_account);
      }
      return warnings;
    }

    function viewUsers() {
      return '<div class="page-head"><div><p>Identity is owned by Authentik and mirrored here: adding a user creates the account in both, and an Authentik account gets an Onyx role automatically the first time it is seen.</p></div><a class="btn" href="https://auth.onyx.innotel.us/if/admin/" target="_blank" rel="noopener">Open Authentik</a></div>' +
        '<div id="user-sync" class="sub" style="margin-bottom:12px"></div>' +
        '<div class="card" style="margin-bottom:16px"><h3>Add a user</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end"><label>Username<input id="user-username" class="search" style="width:100%;max-width:none" placeholder="alex"></label><label>Full name<input id="user-display-name" class="search" style="width:100%;max-width:none" placeholder="Alex Doe"></label><label>Email<input id="user-email" class="search" style="width:100%;max-width:none" placeholder="alex@example.com"></label><label>Onyx role<select id="user-role" class="search" style="width:100%;max-width:none"><option>user</option><option>viewer</option><option>operator</option><option>admin</option></select></label><button class="btn primary" id="user-create">Create user</button></div><p class="sub" style="margin:8px 0 0">No password is set here: the account is created in Authentik and the person chooses their own through its recovery and passkey flow.</p></div>' +
        '<div id="user-detail"></div>' +
        '<div class="card" id="user-list"><div class="empty"><b>Loading users…</b>Reading Authentik accounts and Onyx roles.</div></div>';
    }

    // userSambaPanel sets the SMB password for one person. A grant renders their
    // name into smb.conf's `valid users`, and Samba only admits a name that has
    // an account in its own passdb — without one the grant is recorded and the
    // share still refuses them, which looks like a broken permission.
    function userSambaPanel(userID, username) {
      var panel = document.getElementById('user-detail');
      if (!panel) return;
      panel.innerHTML = '<div class="card"><h3>SMB password for ' + esc(username) + '</h3>' +
        '<p class="sub">File Explorer, Finder and smbclient sign in with this name and password. It is stored only inside Samba\u2019s own passdb and is never shown again; the Onyx account and its Authentik sign-in are separate.</p>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end">' +
        '<label>Password<input id="smb-password" type="password" class="search" style="width:100%;max-width:none" autocomplete="new-password"></label>' +
        '<label>Repeat<input id="smb-password-repeat" type="password" class="search" style="width:100%;max-width:none" autocomplete="new-password"></label>' +
        '<button class="btn primary" id="smb-save">Set password</button><button class="btn" id="smb-cancel">Cancel</button></div>' +
        '<div id="smb-status" class="sub" style="margin-top:8px"></div></div>';
      document.getElementById('smb-cancel').addEventListener('click', function () { panel.innerHTML = ''; });
      document.getElementById('smb-save').addEventListener('click', function () {
        var button = this;
        var status = document.getElementById('smb-status');
        var password = document.getElementById('smb-password').value;
        var repeat = document.getElementById('smb-password-repeat').value;
        // Checked here so a typo does not become an account nobody knows the
        // password to; core enforces the length it will actually accept.
        if (password !== repeat) { status.textContent = 'The two passwords do not match.'; return; }
        if (password.length < 8) { status.textContent = 'Use at least 8 characters.'; return; }
        button.disabled = true;
        button.textContent = 'Setting…';
        apiJSON('/users/' + encodeURIComponent(userID) + '/smb-password', {
          method: 'POST', body: JSON.stringify({ password: password }),
        }).then(function () {
          status.style.color = 'var(--onyx-success)';
          status.textContent = username + ' can now sign in to the SMB shares they are granted.';
          document.getElementById('smb-password').value = '';
          document.getElementById('smb-password-repeat').value = '';
          button.disabled = false;
          button.textContent = 'Set password';
          loadUsers();
        }).catch(function (err) {
          button.disabled = false;
          button.textContent = 'Set password';
          status.style.color = 'var(--onyx-danger)';
          status.textContent = err && err.error && err.error.message ? err.error.message : 'Could not set the SMB password.';
        });
      });
    }

    // loadUsers presents one row per person: the identity Authentik owns, the
    // role Onyx stores, and whether the two agree about the account being able
    // to sign in.
    function loadUsers() {
      var list = document.getElementById('user-list');
      if (!list) return Promise.resolve();
      // The Samba half is fetched beside the identities: a share grant only
      // works over SMB when the grantee has an account here, so the page has to
      // show both to be honest about who can actually connect.
      return Promise.all([
        apiJSON('/users'),
        apiJSON('/samba/accounts').catch(function () { return { available: false, accounts: [] }; }),
      ]).then(function (results) {
        var data = results[0];
        var smb = results[1];
        var rows = data.users || [];
        var sync = data.authentik || {};
        var banner = document.getElementById('user-sync');
        if (banner) {
          if (sync.error) banner.innerHTML = '<div class="card" style="border-color:var(--onyx-danger);margin-bottom:12px"><h3>Authentik sync failed</h3><div class="sub">' + esc(sync.error) + '</div></div>';
          else if (sync.enabled) banner.innerHTML = '<div class="sub" style="color:var(--onyx-success)">Connected to Authentik' + (sync.authentik_users != null ? ' · ' + sync.authentik_users + ' account(s)' : '') + ' · users are mirrored both ways.</div>';
          else banner.innerHTML = '<div class="card" style="margin-bottom:12px"><h3>Authentik sync is off</h3><div class="sub">' + esc(sync.reason || 'Set AUTHENTIK_URL and AUTHENTIK_TOKEN to mirror users.') + '</div><div class="sub">Until then this page shows Onyx roles only.</div></div>';
          if (smb.available === false) {
            banner.innerHTML += '<div class="card" style="margin-bottom:12px"><h3>SMB accounts are unavailable</h3><div class="sub">' + esc(smb.reason || 'Samba is not part of this deployment, so a share cannot be reached over SMB.') + '</div></div>';
          }
        }
        var accounts = smb.accounts || [];
        list.innerHTML = rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (u) {
          var source = u.source === 'authentik+onyx' ? 'Authentik + Onyx role' : (u.source === 'authentik' ? 'Authentik (auto-mapped)' : 'Onyx role only');
          var provider = u.in_authentik ? (u.active ? 'can sign in' : 'disabled in Authentik') : 'not in Authentik';
          // SMB is the one protocol that needs a credential the identity
          // provider does not issue, so it is shown per person rather than
          // assumed from the Authentik account.
          var hasSMB = accounts.indexOf(u.username) >= 0;
          var smbTag = hasSMB ? '<span class="tag">SMB ready</span>' : '';
          var smbButton = '<button class="btn" data-user-smb="' + esc(u.id) + '" data-user-name="' + esc(u.username) + '">SMB password</button>';
          if (hasSMB) smbButton += '<button class="btn" data-user-smb-remove="' + esc(u.id) + '" data-user-name="' + esc(u.username) + '">Remove SMB</button>';
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(u.display_name || u.username) + '</b><div class="sub">' + esc(u.username) + ' · ' + esc(u.status) + ' · ' + esc(source) + ' · ' + esc(provider) + '</div></div><div style="display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap"><span class="tag">' + esc(u.role) + '</span>' + smbTag + smbButton + '<button class="btn" data-user-disable="' + esc(u.id) + '" data-user-name="' + esc(u.username) + '">Disable</button><button class="btn" data-user-purge="' + esc(u.id) + '" data-user-name="' + esc(u.username) + '">Delete everywhere</button></div></div>';
        }).join('') + '</div>' : '<div class="empty"><b>No users yet</b>Add one above, or create it in Authentik and reload.</div>';
        Array.prototype.forEach.call(list.querySelectorAll('[data-user-smb]'), function (button) {
          button.addEventListener('click', function () { userSambaPanel(button.dataset.userSmb, button.dataset.userName); });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-user-smb-remove]'), function (button) {
          button.addEventListener('click', function () {
            if (!confirm('Remove the SMB account for ' + button.dataset.userName + '? SMB will stop accepting this name. The Onyx account, its role and any WebDAV access are unchanged.')) return;
            button.disabled = true;
            apiJSON('/users/' + encodeURIComponent(button.dataset.userSmbRemove) + '/smb-password', { method: 'DELETE' })
              .then(loadUsers)
              .catch(function (err) { button.disabled = false; showError(err); });
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-user-disable]'), function (button) {
          button.addEventListener('click', function () {
            if (!confirm('Disable ' + button.dataset.userName + '? The Onyx role is removed and the account is disabled in Authentik, so it can no longer sign in. Nothing about the identity is erased.')) return;
            button.disabled = true;
            apiJSON('/users/' + encodeURIComponent(button.dataset.userDisable), { method: 'DELETE' })
              .then(function (res) { loadUsers(); reportUserCleanup(res, button.dataset.userName); })
              .catch(function (err) { button.disabled = false; showError(err); });
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-user-purge]'), function (button) {
          button.addEventListener('click', function () {
            if (!confirm('Delete ' + button.dataset.userName + ' everywhere? The account is erased in Authentik as well as here. This cannot be undone.')) return;
            button.disabled = true;
            apiJSON('/users/' + encodeURIComponent(button.dataset.userPurge) + '?purge=true', { method: 'DELETE' })
              .then(function (res) { loadUsers(); reportUserCleanup(res, button.dataset.userName); })
              .catch(function (err) { button.disabled = false; showError(err); });
          });
        });
      }).catch(showError);
    }

    // The Settings page owns the one-click side of remote setup: rclone's own
    // config is written for you here, instead of an operator hand-editing
    // rclone.conf. The browser approval an OAuth account needs (Google Drive,
    // OneDrive, SharePoint, Dropbox) is taken on the Shares page, where the
    // token is pasted; key-based backends (S3, SMB, SFTP, WebDAV, ...) are
    // configured there too because they need more than a name.
    function viewSettings() {
      return '<div class="page-head"><div><p>Current platform connections and dashboard preferences.</p></div></div><div class="grid"><div class="card"><h3>Identity</h3><p class="sub">Cerulean Authentik provides SSO and user identity.</p><a class="btn" href="https://auth.onyx.innotel.us/if/admin/" target="_blank" rel="noopener">Manage identity</a></div><div class="card"><h3>Cloud accounts</h3><p class="sub">Rclone reaches Google Drive, Microsoft OneDrive, SharePoint, Dropbox, S3, SMB, SFTP and more. Create the account here — Onyx writes the remote for you.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end"><label>Provider<select id="settings-provider" class="search" style="width:100%;max-width:none"><option value="">Loading providers…</option></select></label><label>Account name<input id="settings-remote-name" class="search" style="width:100%;max-width:none" placeholder="my-drive" autocomplete="off"></label><button class="btn primary" id="settings-remote-create">Create remote</button><button class="btn" id="settings-refresh-remotes">Check all</button></div><div id="settings-remotes" class="sub" style="margin-top:8px">Loading remotes…</div></div><div class="card"><h3>Appearance</h3><p class="sub">ONYX wears the shared Unity theme in its operations scheme. The choice is remembered in this browser and follows the system when you ask it to.</p><label style="display:block;margin-top:10px;font-size:11.5px;color:var(--ink-soft)">Theme<select id="settings-theme" class="search" style="width:100%;margin-top:5px"><option value="system">Follow the system</option><option value="light">Light</option><option value="dark">Dark</option></select></label></div></div>';
    }

    // loadSettingsRemotes fills the provider picker from the same catalog the
    // Shares page uses and lists what is already configured.
    function loadSettingsRemotes() {
      var box = document.getElementById('settings-remotes');
      if (!box) return Promise.resolve();
      return Promise.all([apiJSON('/storage/providers'), apiJSON('/storage/remotes')]).then(function (parts) {
        var providers = parts[0].providers || [];
        var select = document.getElementById('settings-provider');
        if (select && select.dataset.filled !== 'true') {
          select.innerHTML = '<option value="">Choose a provider…</option>' + providers.map(function (p) {
            return '<option value="' + esc(p.type) + '">' + esc(p.label) + (p.oauth ? ' (browser approval on Shares)' : '') + '</option>';
          }).join('');
          select.dataset.filled = 'true';
        }
        var names = parts[1].remotes || [];
        var details = parts[1].details || {};
        box.innerHTML = names.length
          ? '<div style="display:grid;gap:4px">' + names.map(function (n) {
            return '<div style="display:flex;gap:8px;align-items:center"><span class="tag">' + esc(n) + (details[n] ? ' · ' + esc(details[n]) : '') + '</span><span data-settings-status="' + esc(n) + '"></span></div>';
          }).join('') + '</div>'
          : 'No rclone remotes configured yet.';
      }).catch(function (err) { box.textContent = 'Remotes unavailable'; throw err; });
    }

    // checkSettingsRemotes probes every configured remote and writes the result
    // beside its name, so "Check all" answers for the whole catalog at once.
    function checkSettingsRemotes() {
      var box = document.getElementById('settings-remotes');
      if (!box) return Promise.resolve();
      var spans = box.querySelectorAll('[data-settings-status]');
      var queue = Promise.resolve();
      Array.prototype.forEach.call(spans, function (span) {
        var name = span.dataset.settingsStatus;
        span.textContent = 'checking…';
        queue = queue.then(function () {
          return apiJSON('/storage/remotes/' + encodeURIComponent(name) + '/check', { method: 'POST' }).then(function (res) {
            span.textContent = res.ok ? 'reachable' : 'failed: ' + String(res.detail || '').slice(0, 160);
          }).catch(function () { span.textContent = 'check failed'; });
        });
      });
      return queue;
    }

    function viewScrub() {
      return '<div class="page-head"><div><p>Checksum verification protects Btrfs pools from silent corruption. Pick a pool, set a cadence, and run it once now when you want an answer today.</p></div>' +
        '<div><a class="btn" href="#/storage">Back to storage</a><button class="btn" id="scrub-refresh">Refresh</button></div></div>' +
        '<div class="card" id="scrub-pools"><div class="empty"><b>Loading pools…</b>Reading scrub schedules.</div></div>' +
        '<div class="card" id="scrub-config" style="margin-top:14px;display:none"></div>';
    }

    // Every pool is a candidate: scrub is a property of the filesystem, not of a
    // page someone remembered to open. A schedule that failed to load is shown
    // as unknown rather than as "not scheduled", because those are different
    // facts and only one of them needs a decision.
    function loadScrub() {
      var box = document.getElementById('scrub-pools');
      if (!box) return Promise.resolve();
      return apiJSON('/pools').then(function (data) {
        var rows = data.pools || [];
        if (!rows.length) {
          box.innerHTML = '<div class="empty"><b>No pools to scrub</b>Create a pool on the Storage page first.</div>';
          return;
        }
        return Promise.all(rows.map(function (pool) {
          return apiJSON('/pools/' + encodeURIComponent(pool.name) + '/scrub-schedule')
            .then(function (schedule) { return { pool: pool, schedule: schedule }; })
            .catch(function () { return { pool: pool, schedule: null }; });
        })).then(function (items) {
          box.innerHTML = '<h3>Pools</h3><div style="display:grid;gap:8px">' + items.map(function (item) {
            var pool = item.pool, s = item.schedule;
            var cadence = s && s.enabled ? esc(s.frequency || 'weekly') + ' at ' + esc(String(s.hour == null ? 2 : s.hour)) + ':00 UTC' + (s.next_run ? ' · next ' + esc(s.next_run) : '') : (s ? 'Not scheduled' : 'Schedule unavailable');
            return '<div class="event" style="justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0"><div><b>' + esc(pool.name) + '</b> <span class="tag">' + esc(pool.state || 'unknown') + '</span><div class="sub">' + formatBytes(pool.usedBytes) + ' of ' + formatBytes(pool.totalBytes) + ' · ' + cadence + '</div></div>' +
              '<div style="display:flex;gap:8px"><button class="btn" data-scrub-configure="' + esc(pool.name) + '">' + (s && s.enabled ? 'Change schedule' : 'Set schedule') + '</button><button class="btn" data-scrub-run="' + esc(pool.name) + '">Run now</button></div></div>';
          }).join('') + '</div>';
          Array.prototype.forEach.call(box.querySelectorAll('[data-scrub-configure]'), function (button) {
            button.addEventListener('click', function () {
              var item = items.filter(function (candidate) { return candidate.pool.name === button.dataset.scrubConfigure; })[0];
              scrubPanel(item.pool, item.schedule || {});
            });
          });
          Array.prototype.forEach.call(box.querySelectorAll('[data-scrub-run]'), function (button) {
            button.addEventListener('click', function () {
              if (!window.confirm('Start a scrub of ' + button.dataset.scrubRun + ' now? It reads every block and can take hours on a large pool.')) return;
              button.disabled = true;
              button.textContent = 'Starting…';
              apiJSON('/pools/' + encodeURIComponent(button.dataset.scrubRun) + '/scrub', { method: 'POST' })
                .then(function () { toast('Scrub queued for ' + button.dataset.scrubRun); return loadScrub(); })
                .catch(function (err) { button.disabled = false; button.textContent = 'Run now'; showError(err); });
            });
          });
        });
      }).catch(function (err) {
        box.innerHTML = '<div class="empty"><b>Pools unavailable</b>' + esc(err && err.message ? err.message : 'The storage service did not answer.') + '</div>';
      });
    }

    function scrubPanel(pool, schedule) {
      var panel = document.getElementById('scrub-config');
      if (!panel) return;
      var enabled = schedule.enabled !== false;
      var frequency = schedule.frequency || 'weekly';
      var hour = schedule.hour == null ? 2 : Number(schedule.hour);
      panel.style.display = 'block';
      panel.innerHTML = '<h3>' + esc(pool.name) + ' scrub schedule</h3>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end">' +
        '<label style="display:flex;gap:8px;align-items:center;flex-direction:row"><input id="scrub-enabled" type="checkbox"' + (enabled ? ' checked' : '') + '> Enabled</label>' +
        '<label>Cadence<select id="scrub-frequency" class="search" style="width:100%"><option value="weekly"' + (frequency === 'weekly' ? ' selected' : '') + '>Weekly</option><option value="monthly"' + (frequency === 'monthly' ? ' selected' : '') + '>Monthly</option></select></label>' +
        '<label>Hour (UTC)<input id="scrub-hour" class="search" type="number" min="0" max="23" value="' + hour + '" style="width:100%"></label>' +
        '<div style="display:flex;gap:8px"><button class="btn primary" id="scrub-save">Save schedule</button><button class="btn" id="scrub-cancel">Cancel</button></div>' +
        '</div>';
      document.getElementById('scrub-cancel').addEventListener('click', function () { panel.style.display = 'none'; panel.innerHTML = ''; });
      document.getElementById('scrub-save').addEventListener('click', function () {
        var button = this;
        button.disabled = true;
        button.textContent = 'Saving…';
        apiJSON('/pools/' + encodeURIComponent(pool.name) + '/scrub-schedule', {
          method: 'PUT',
          body: JSON.stringify({
            enabled: document.getElementById('scrub-enabled').checked,
            frequency: document.getElementById('scrub-frequency').value,
            hour: Number(document.getElementById('scrub-hour').value) || 0,
          }),
        }).then(function (saved) {
          toast(pool.name + ': scrub ' + (saved.enabled ? saved.frequency + ' at ' + saved.hour + ':00 UTC' : 'disabled'));
          panel.style.display = 'none';
          panel.innerHTML = '';
          return loadScrub();
        }).catch(function (err) {
          button.disabled = false;
          button.textContent = 'Save schedule';
          showError(err);
        });
      });
      if (panel.scrollIntoView) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /* Search: name plus attributes across the pool. The Files page
     * filters one folder; this one walks the tree, so it is the answer to "where
     * is that file" when the operator is not standing in the right folder. */
    function viewSearch() {
      return '<div class="page-head"><div><p>Find a file by name and attributes across the pool — not only the folder you are in.</p></div></div>' +
        '<div class="card" style="margin-bottom:16px"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end">' +
        '<label>Name contains<input id="search-q" class="search" style="width:100%;max-width:none" placeholder="holiday"></label>' +
        '<label>In folder (optional)<input id="search-path" class="search" style="width:100%;max-width:none" placeholder="media/movies"></label>' +
        '<label>Kind<select id="search-type" class="search" style="width:100%;max-width:none"><option value="">Files and folders</option><option value="file">Files</option><option value="directory">Folders</option></select></label>' +
        '<label>Min size (bytes)<input id="search-min" class="search" type="number" min="0" style="width:100%;max-width:none" placeholder="1048576"></label>' +
        '<label>Max size (bytes)<input id="search-max" class="search" type="number" min="0" style="width:100%;max-width:none" placeholder="1073741824"></label>' +
        '<label>Modified within<input id="search-since" class="search" style="width:100%;max-width:none" placeholder="7d"></label>' +
        '</div><div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap"><button class="btn primary" id="search-run">Search</button><span class="sub" id="search-note"></span></div></div>' +
        '<div class="card" id="search-results"><div class="empty"><b>No search yet</b>Enter a name to search the pool.</div></div>';
    }

    function wireSearch() {
      var run = document.getElementById('search-run');
      if (run) run.addEventListener('click', runSearch);
      var q = document.getElementById('search-q');
      if (q) q.addEventListener('keydown', function (event) { if (event.key === 'Enter') runSearch(); });
    }

    function runSearch() {
      var results = document.getElementById('search-results');
      var note = document.getElementById('search-note');
      var q = (document.getElementById('search-q').value || '').trim();
      if (!q) { if (note) note.textContent = 'A name is required.'; return; }
      var params = ['q=' + encodeURIComponent(q)];
      var path = (document.getElementById('search-path').value || '').trim();
      var kind = document.getElementById('search-type').value;
      var min = (document.getElementById('search-min').value || '').trim();
      var max = (document.getElementById('search-max').value || '').trim();
      var since = (document.getElementById('search-since').value || '').trim();
      if (path) params.push('path=' + encodeURIComponent(path));
      if (kind) params.push('type=' + encodeURIComponent(kind));
      if (min) params.push('min_size=' + encodeURIComponent(min));
      if (max) params.push('max_size=' + encodeURIComponent(max));
      if (since) params.push('modified_since=' + encodeURIComponent(since));
      if (note) note.textContent = 'Searching…';
      results.innerHTML = '<div class="empty"><b>Searching…</b>Walking the tree from the storage root.</div>';
      apiJSON('/files/search?' + params.join('&')).then(function (data) {
        var rows = data.results || [];
        if (note) note.textContent = rows.length + ' result(s) from ' + (data.scanned || 0) + ' entries' + (data.truncated ? ' — stopped early, narrow the search for a complete answer' : '');
        results.innerHTML = rows.length ? '<div style="display:grid;gap:10px">' + rows.map(function (entry) {
          return '<div class="event" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--onyx-border);padding-bottom:10px"><div><b>' + esc(entry.name) + '</b><div class="sub">' + esc(entry.path + ' · ' + (entry.type === 'directory' ? 'folder' : formatBytes(entry.size)) + ' · ' + entry.modified_at) + '</div></div>' +
            (entry.type === 'directory'
              ? '<span class="sub">folder</span>'
              : '<div style="display:flex;gap:8px"><button class="btn" data-view="' + esc(entry.path) + '">View</button><button class="btn" data-save="' + esc(entry.path) + '">Download</button></div>') +
            '</div>';
        }).join('') + '</div>' : '<div class="empty"><b>Nothing matched</b>Try a shorter name, or drop a size or age filter.</div>';
        Array.prototype.forEach.call(results.querySelectorAll('[data-view]'), function (button) {
          button.addEventListener('click', function () { window.open(API + '/files/content?path=' + encodeURIComponent(button.dataset.view), '_blank', 'noopener'); });
        });
        Array.prototype.forEach.call(results.querySelectorAll('[data-save]'), function (button) {
          button.addEventListener('click', function () { window.open(API + '/files/content?download=1&path=' + encodeURIComponent(button.dataset.save), '_blank', 'noopener'); });
        });
      }).catch(function (error) {
        if (note) note.textContent = '';
        results.innerHTML = '<div class="empty"><b>Search failed</b>' + esc(error && error.message ? error.message : 'The request was refused.') + '</div>';
      });
    }

    /* Audit report: the trail summarized — how much, and which share
     * or name is worst — rather than a raw page of events. */
    function viewAudit() {
      return '<div class="page-head"><div><p>What was granted, revoked and refused in the access trail, and who was refused the most.</p></div>' +
        '<a class="btn" href="' + API + '/audit?format=csv" target="_blank" rel="noopener">Download CSV</a></div>' +
        '<div class="grid" id="audit-summary"></div>' +
        '<div class="card" style="margin-top:16px" id="audit-shares"><div class="empty"><b>Loading audit report…</b>Reading the access trail from onyx-core.</div></div>' +
        '<div class="card" style="margin-top:16px" id="audit-users"></div>';
    }

    function loadAudit() {
      apiJSON('/audit').then(function (data) {
        var totals = data.totals || {};
        var summary = document.getElementById('audit-summary');
        if (summary) summary.innerHTML =
          '<div class="card"><h3>Granted</h3><div class="stat">' + (totals.grant || 0) + '</div><div class="sub">in the last ' + (data.events || 0) + ' recorded events</div></div>' +
          '<div class="card"><h3>Revoked</h3><div class="stat">' + (totals.revoke || 0) + '</div><div class="sub">grants removed</div></div>' +
          '<div class="card"><h3>Refused</h3><div class="stat">' + (totals.denied || 0) + '</div><div class="sub">' + (data.first_ts ? ('between ' + data.first_ts + ' and ' + data.last_ts) : 'no events in the sample') + '</div></div>';

        var shares = document.getElementById('audit-shares');
        if (shares) shares.innerHTML = '<h3>Shares by refusal</h3>' + ((data.shares || []).filter(function (row) { return row.denied > 0; }).length
          ? '<div style="display:grid;gap:10px">' + data.shares.map(function (row) {
              return '<div class="event" style="justify-content:space-between"><span><b>' + esc(row.share) + '</b><div class="sub">' + (row.grant || 0) + ' granted · ' + (row.revoke || 0) + ' revoked</div></span><span class="badge">' + (row.denied || 0) + ' refused</span></div>';
            }).join('') + '</div>'
          : '<div class="empty"><b>No refusals recorded</b>Every request in this sample was allowed.</div>');

        var users = document.getElementById('audit-users');
        if (users) users.innerHTML = '<h3>Names refused</h3>' + ((data.denied_users || []).length
          ? '<div style="display:grid;gap:10px">' + data.denied_users.map(function (row) {
              return '<div class="event" style="justify-content:space-between"><b>' + esc(row.username) + '</b><span class="badge">' + (row.denied || 0) + ' refused</span></div>';
            }).join('') + '</div>'
          : '<div class="empty"><b>Nobody was refused</b>No denied events in this sample.</div>');
      }).catch(showError);
    }

    /* The advisor is a reading of the platform, not a second source of truth:
     * onyx-ai receives the pool telemetry onyx-api assembled and the backup
     * report onyx-backupd recorded, and returns findings plus a narrative. A
     * failure in either half is shown in place — one panel can still answer
     * when the other cannot. */
    function viewAdvisor() {
      return '<div class="page-head"><div><p>Storage health and backup reliability, reviewed by onyx-ai. Findings are deterministic; a configured model only rewrites the summary.</p></div>' +
        '<button class="btn" id="advisor-refresh">Refresh</button></div>' +
        '<div class="grid" id="advisor-summary"><div class="card"><h3>Storage health</h3><div class="stat">—</div><div class="sub">Reading pool telemetry…</div></div>' +
        '<div class="card"><h3>Backup health</h3><div class="stat">—</div><div class="sub">Reading the backup report…</div></div></div>' +
        '<div class="card" style="margin-top:16px" id="advisor-storage"><h3>Storage findings</h3><div class="empty"><b>Asking the advisor…</b>Pool capacity, snapshots and scrub state.</div></div>' +
        '<div class="card" style="margin-top:16px" id="advisor-backups"><h3>Backup findings</h3><div class="empty"><b>Asking the advisor…</b>Job success, recovery points and trends.</div></div>';
    }

    function advisorFinding(finding) {
      var severity = String(finding.severity || 'info').toLowerCase();
      var badge = severity === 'critical' ? 'bad' : (severity === 'warning' ? 'warn' : '');
      return '<div class="event" style="display:block;border-bottom:1px solid var(--onyx-border);padding-bottom:10px">' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge' + (badge ? ' ' + badge : '') + '">' + esc(severity) + '</span><b>' + esc(finding.summary || finding.code || 'Finding') + '</b></div>' +
        '<div class="sub" style="margin-top:4px">' + esc(finding.detail || '') + '</div>' +
        (finding.action ? '<div class="sub" style="margin-top:4px"><b>Next:</b> ' + esc(finding.action) + '</div>' : '') + '</div>';
    }

    function advisorPanel(id, data, label) {
      var box = document.getElementById(id);
      if (!box) return;
      if (!data) { box.innerHTML = '<h3>' + esc(label) + '</h3><div class="empty"><b>Advisor unavailable</b>onyx-ai did not answer this request.</div>'; return; }
      var findings = data.findings || [];
      var warnings = data.warnings || [];
      box.innerHTML = '<h3>' + esc(label) + '</h3>' +
        (warnings.length ? '<div class="sub" style="color:var(--onyx-warning);margin-bottom:8px">' + warnings.map(esc).join('<br>') + '</div>' : '') +
        (data.narrative ? '<p class="sub" style="margin:0 0 12px">' + esc(data.narrative) + '</p>' : '') +
        (findings.length ? '<div style="display:grid;gap:10px">' + findings.map(advisorFinding).join('') + '</div>' : '<div class="empty"><b>Nothing to flag</b>The advisor found no concerns in what it was given.</div>');
    }

    function loadAdvisor() {
      var storage = document.getElementById('advisor-storage');
      var backups = document.getElementById('advisor-backups');
      var summary = document.getElementById('advisor-summary');
      if (!storage && !backups) return;
      var one = apiJSON('/ai/advisor').catch(function (error) { return { __error: error }; });
      var two = apiJSON('/ai/backup-advice').catch(function (error) { return { __error: error }; });
      return Promise.all([one, two]).then(function (results) {
        var storageData = results[0] && results[0].__error ? null : results[0];
        var backupData = results[1] && results[1].__error ? null : results[1];
        advisorPanel('advisor-storage', storageData, 'Storage findings');
        advisorPanel('advisor-backups', backupData, 'Backup findings');
        if (summary) summary.innerHTML =
          '<div class="card"><h3>Storage health</h3><div class="stat">' + (storageData && storageData.health != null ? Math.round(Number(storageData.health) * 100) + '%' : '—') + '</div><div class="sub">' + (storageData && (storageData.findings || []).length ? (storageData.findings || []).length + ' finding(s)' : 'no findings') + '</div></div>' +
          '<div class="card"><h3>Backup health</h3><div class="stat">' + (backupData && backupData.health != null ? Math.round(Number(backupData.health) * 100) + '%' : '—') + '</div><div class="sub">' + (backupData && (backupData.findings || []).length ? (backupData.findings || []).length + ' finding(s)' : 'no findings') + '</div></div>';
      });
    }

    function render(route) {
      // `#/dashboard` was the old landing page; it stays a working link so a
      // bookmark, a README or an operator's muscle memory is never a 404.
      var id = route === 'dashboard' ? 'overview' : route;
      var scrubbing = id === 'scrub';
      var v = VIEWS.filter(function (x) { return x.id === id; })[0] || VIEWS[0];
      renderNav(scrubbing ? 'storage' : v.id);
      var title = scrubbing ? 'Scrub scheduling' : v.label;
      var subtitle = scrubbing ? 'Checksum verification for a pool, on a cadence you choose.' : v.sub;
      document.getElementById('page-title').textContent = title;
      document.getElementById('page-sub').textContent = subtitle;

      var body;
      if (id === 'overview' || id === 'dashboard') body = viewDashboard();
      else if (id === 'files') body = viewFiles();
      else if (id === 'storage') body = viewStorage();
      else if (id === 'snapshots') body = viewSnapshots();
      else if (id === 'backups') body = viewBackups();
      else if (id === 'scrub') body = viewScrub();
      else if (id === 'apps') body = viewApps();
      else if (id === 'vms') body = viewVMs();
      else if (id === 'objects') body = viewObjects();
      else if (id === 'shares') body = viewShares();
      else if (id === 'users') body = viewUsers();
      else if (id === 'search') body = viewSearch();
      else if (id === 'audit') body = viewAudit();
      else if (id === 'advisor') body = viewAdvisor();
      else if (id === 'settings') body = viewSettings();
      else body = viewDashboard();
      document.getElementById('content').innerHTML = body;
      document.getElementById('content').scrollTop = 0;
      if (id === 'search') {
        wireSearch();
        try {
          var pending = sessionStorage.getItem('onyx.searchQuery');
          if (pending) {
            sessionStorage.removeItem('onyx.searchQuery');
            var input = document.getElementById('search-q');
            if (input) { input.value = pending; runSearch(); }
          }
        } catch (e) {}
      }
      if (id === 'audit') loadAudit();
      if (id === 'advisor') {
        var advisorRefresh = document.getElementById('advisor-refresh');
        if (advisorRefresh) advisorRefresh.addEventListener('click', function () {
          advisorRefresh.disabled = true;
          advisorRefresh.textContent = 'Refreshing…';
          loadAdvisor().then(function () { advisorRefresh.disabled = false; advisorRefresh.textContent = 'Refresh'; });
        });
        loadAdvisor();
      }
      if (id === 'overview' || id === 'dashboard') {
        loadStatus();
        var dashRefresh = document.getElementById('dashboard-refresh');
        if (dashRefresh) dashRefresh.addEventListener('click', function () {
          dashRefresh.disabled = true;
          dashRefresh.textContent = 'Refreshing…';
          loadStatus().then(function () { dashRefresh.disabled = false; dashRefresh.textContent = 'Refresh'; });
        });
        var browse = document.getElementById('overview-browse');
        if (browse) browse.addEventListener('click', function () { location.hash = '#/files'; });
      }
      if (v.id === 'storage') {
        document.getElementById('storage-refresh').addEventListener('click', function () { refreshStorage(true); });
        var scrubLink = document.getElementById('storage-scrub');
        if (scrubLink) scrubLink.addEventListener('click', function () { location.hash = '#/scrub'; });
        refreshStorage();
        // Disks offered for pool creation: any whole device (a whole disk or a
        // loop device) plus disks Onyx already mounted — re-creating a pool
        // unmounts them, erases them and mounts them again in place. The one
        // hard exclusion is a device the host mounted outside /mnt/onyx: it
        // holds somebody else's data, and creating a pool would erase it.
        // Internal (non-removable) disks are offered and labelled, because on
        // most machines they are the only disks there are; the label is what
        // makes the destructive step deliberate.
        var poolDisks = [];
        var poolDevices = [];
        apiJSON('/devices').then(function (data) {
          var select = document.getElementById('pool-device');
          poolDevices = data.devices || [];
          // `nodePresent === false` means the data plane cannot open the device:
          // offering it would produce a failed erase after the confirmation, so
          // it is left out and explained instead.
